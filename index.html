        <span class="linha-principal"><span class="linha-titulo">${esc(m.rotulo)}</span>${m.dica ? `<span class="linha-sub">${esc(m.dica)}</span>` : ''}</span>
        <span class="linha-valor" aria-hidden="true">›</span></a></li>`).join('')}</ul></section>
      <section class="cartao ajuda">
        <h2>Ajuda rápida</h2>
        <details><summary>Lançar um gasto</summary>
          <p>Toque em <b>Lançar</b>, digite o valor e toque na categoria. Data (hoje), forma de pagamento e status já vêm preenchidos. <b>Salvar</b>.</p>
          <p>Várias compras de uma vez: <b>4,79+10,97</b> vira dois lançamentos. Parcelado: escolha as parcelas; as próximas ficam como previstas nos meses seguintes.
          Compra no cartão vai para o mês em que a fatura vence.</p></details>
        <details><summary>Virar o mês</summary>
          <p>No começo do mês: em <b>Contas</b>, toque em <b>Criar previstos do mês</b> (faz o papel da fonte vermelha da planilha).
          Quando pagar, <b>Marcar pago</b>. Quando a fatura do cartão chegar, registre o pagamento em <b>Cartões</b>.
          No <b>Acerto</b>, confira o repasse e registre.</p></details>
        <details><summary>Backup e restauração</summary>
          <p>Em <b>Dados e backup</b>, toque em <b>Fazer backup agora</b> e guarde o arquivo fora do aparelho. Para restaurar, <b>Restaurar um backup</b>.
          O app lembra você no início quando o último backup ficar velho.</p></details>
        <details><summary>Usar no celular e no computador</summary>
          <p>Cada aparelho tem a sua cópia dos dados. Para levar os lançamentos de um para o outro: <b>Dados e backup › Gerar pacote</b> num aparelho
          e <b>Receber pacote</b> no outro. Nada se perde nem duplica.</p></details>
        <details><summary>Desfazer</summary>
          <p>Depois de salvar, excluir ou marcar como pago, aparece <b>Desfazer</b> no aviso de baixo. No <b>Histórico</b>, o botão desfaz a última alteração.</p></details>
      </section>
      <p class="suave centro">Seus dados ficam só neste aparelho. Versão ${esc(FN.VERSAO || 'dev')}.</p>`;
  }

  App.registrarTela('mais', { titulo: 'Mais', render, acoes: {} });
})();

/* ==== main.js ==== */
/* main.js — liga tudo: detecta celular (toque), monta os menus, trata cliques e mudanças de campos,
   carrega os dados do banco, pede armazenamento persistente, registra o service worker (para abrir
   sem internet), avisa quando há versão nova e mantém várias abas do app em sintonia. */
(function () {
  'use strict';
  const D = FN.datas;
  const esc = FN.util.esc;
  const INSTANCIA = FN.util.novoId('aba');   // identifica esta aba nas mensagens entre abas

  /* ---------------- Ícones (traço simples, desenhados aqui; nada vem de fora) ---------------- */
  const ICONES = {
    inicio: '<path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/>',
    lista: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
    mais: '<path d="M12 5v14M5 12h14"/>',
    calendario: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
    cartao: '<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/>',
    pessoa: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/>',
    dados: '<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>',
    ajustes: '<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',
    grafico: '<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 6-6"/>',
    orcamento: '<circle cx="12" cy="12" r="9"/><path d="M12 3v9l6.4 6.4"/>',
    contracheque: '<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/>',
    poupanca: '<path d="M3 10l9-6 9 6"/><path d="M5 10v9h14v-9M9 14v3M12 14v3M15 14v3"/>',
    nuvem: '<path d="M7 18a5 5 0 1 1 .9-9.9A6 6 0 0 1 19 10a4 4 0 0 1 0 8z"/>',
    menu: '<path d="M4 7h16M4 12h16M4 17h16"/>',
  };
  App.icone = function (nome) {
    return `<svg class="icone" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">${ICONES[nome] || ICONES.menu}</svg>`;
  };

  /* ---------------- Menus: lateral (computador) e de baixo (celular) ---------------- */
  function montarMenus() {
    const itens = App.MENU.slice().sort((a, b) => (a.ordem || 0) - (b.ordem || 0));
    const link = (m, classe) => `<a href="${esc(m.rota)}" data-menu="${esc(m.rota.slice(2))}"${classe ? ` class="${classe}"` : ''}>${App.icone(m.icone)}<span>${esc(m.rotulo)}</span></a>`;
    document.getElementById('nav-lateral').innerHTML = `<div class="marca" aria-hidden="true">${App.icone('grafico')}<span>Finanças</span></div>`
      + itens.map((m) => link(m, m.rota === '#/lancar' ? 'nav-lancar' : '')).join('');
    document.getElementById('nav-baixo').innerHTML = itens.filter((m) => m.principal).map((m) => link(m, m.rota === '#/lancar' ? 'nav-lancar' : '')).join('')
      + `<a href="#/mais" data-menu="mais">${App.icone('menu')}<span>Mais</span></a>`;
  }

  /* ---------------- Cliques e campos (delegação: um ouvinte só para a página toda) ---------------- */
  function acaoDe(nome) {
    const t = App.telaAtual;
    return (t && t.acoes && t.acoes[nome]) || UI.acoesComuns[nome] || null;
  }

  function executar(fn, el, ev) {
    Promise.resolve().then(() => fn(el, ev)).catch(App.erro);
  }

  document.addEventListener('click', (ev) => {
    const el = ev.target.closest('[data-acao]');
    if (!el || el.closest('dialog')) return;
    const fn = acaoDe(el.dataset.acao);
    if (!fn) return;
    if (el.tagName === 'A') ev.preventDefault();
    executar(fn, el, ev);
  });

  // Campos de texto avisam a cada letra ("input"); listas, datas e caixas de marcar, ao mudar ("change").
  function mudanca(ev) {
    const el = ev.target.closest && ev.target.closest('[data-mudar]');
    if (!el || el.closest('dialog')) return;
    const porChange = el.tagName === 'SELECT' || ['date', 'month', 'checkbox', 'radio', 'file', 'range'].includes(el.type);
    if ((ev.type === 'change') !== porChange) return;
    const t = App.telaAtual;
    const fn = t && t.mudancas && t.mudancas[el.dataset.mudar];
    if (fn) executar(fn, el, ev);
  }
  document.addEventListener('input', mudanca);
  document.addEventListener('change', mudanca);
  document.addEventListener('submit', (ev) => ev.preventDefault());   // nenhum formulário é enviado a lugar nenhum

  // Enter no campo de valor salva o lançamento (no computador).
  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter' && ev.target.matches && ev.target.matches('.valor-input')) {
      ev.preventDefault();
      const fn = acaoDe('salvar');
      if (fn) executar(fn, ev.target, ev);
    }
  });

  window.addEventListener('unhandledrejection', (ev) => App.erro(ev.reason));

  /* ---------------- Armazenamento persistente ---------------- */
  async function pedirPersistencia() {
    try {
      if (!App.temDados() || !navigator.storage || !navigator.storage.persisted) return;
      if (await navigator.storage.persisted()) return;
      const ped = App.estado.config.persistencia_pedida;
      if (ped && D.diasEntre(ped.slice(0, 10), D.hoje()) < 7) return;   // não insiste mais de uma vez por semana
      const ok = await App.pedirPersistencia();
      await App.salvarConfig('persistencia_pedida', D.hoje() + (ok ? ' concedida' : ' negada'));
    } catch (e) { console.warn(e); }
  }

  /* ---------------- Service worker e aviso de versão nova ---------------- */
  let atualizacaoPedida = false;
  function avisarVersaoNova(sw) {
    const el = document.getElementById('aviso-atualizacao');
    el.innerHTML = '<span>Há uma versão nova do app.</span> <button type="button" class="btn btn-mini btn-primario">Atualizar agora</button>';
    el.hidden = false;
    el.querySelector('button').addEventListener('click', () => {
      atualizacaoPedida = true;
      sw.postMessage({ tipo: 'pular-espera' });
    }, { once: true });
  }

  function registrarServiceWorker() {
    if (!('serviceWorker' in navigator)) return;
    const local = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
    if (location.protocol !== 'https:' && !local) return;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (atualizacaoPedida) location.reload(); });
    navigator.serviceWorker.register('sw.js').then((reg) => {
      if (reg.waiting && navigator.serviceWorker.controller) avisarVersaoNova(reg.waiting);
      reg.addEventListener('updatefound', () => {
        const sw = reg.installing;
        if (!sw) return;
        sw.addEventListener('statechange', () => {
          if (sw.state === 'installed' && navigator.serviceWorker.controller) avisarVersaoNova(sw);
        });
      });
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') reg.update().catch(() => {});
      });
    }).catch((e) => console.warn('Service worker não registrado:', e));
  }

  /* ---------------- Várias abas abertas: quem altera avisa as outras ---------------- */
  function sintoniaEntreAbas() {
    if (!('BroadcastChannel' in window)) return;
    const canal = new BroadcastChannel('financas');
    App.avisarAbas = () => canal.postMessage({ tipo: 'alterado', de: INSTANCIA });
    App.ouvintes.push(App.avisarAbas);
    canal.onmessage = async (ev) => {
      if (!ev.data || ev.data.de === INSTANCIA) return;
      await App.carregar();
      if (App.rotaAtual !== 'lancar') App.renderizar(true);   // não atrapalha quem está digitando
    };
  }

  /* ---------------- Gráficos acompanham a largura da tela ---------------- */
  let larguraAnterior = window.innerWidth;
  let timerLargura = null;
  window.addEventListener('resize', () => {
    clearTimeout(timerLargura);
    timerLargura = setTimeout(() => {
      const w = window.innerWidth;
      if (Math.abs(w - larguraAnterior) / larguraAnterior < 0.12) return;
      larguraAnterior = w;
      if (App.telaAtual && App.telaAtual.redimensionar && !document.getElementById('dialogo').open) App.renderizar(true);
    }, 300);
  });

  /* ---------------- Volta ao app (ex.: no dia seguinte) ---------------- */
  let mesVisto = D.mesAtual();
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible' || !App.telaAtual) return;
    const agora = D.mesAtual();
    if (agora !== mesVisto) {
      if (App.ui.mes === mesVisto) App.ui.mes = agora;   // virou o mês com o app aberto
      mesVisto = agora;
    }
    if (!document.getElementById('dialogo').open) App.renderizar(true);
  });

  /* ---------------- Início ---------------- */
  async function iniciar() {
    if (window.matchMedia && matchMedia('(pointer: coarse)').matches) document.body.classList.add('toque');
    montarMenus();
    try {
      await App.carregar();
    } catch (e) {
      console.error(e);
      document.getElementById('tela').innerHTML = `<section class="cartao"><h2>Não foi possível abrir os dados</h2>
        <p>${esc(e.message)}</p><p>Em janela anônima (privada) o navegador pode bloquear o banco de dados. Abra o app numa janela normal ou pelo ícone instalado.</p></section>`;
      return;
    }
    for (const fn of App.iniciais) {
      try { await fn(); } catch (e) { console.error(e); }
    }
    if (!/^#\//.test(location.hash)) history.replaceState(null, '', location.pathname + location.search + '#/inicio');
    window.addEventListener('hashchange', () => App.renderizar());
    App.renderizar();
    sintoniaEntreAbas();
    registrarServiceWorker();
    pedirPersistencia();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', iniciar);
  else iniciar();
})();
</script>
