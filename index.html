<title>Finanças</title>
<style>/* estilo.css — visual limpo, botões grandes (mínimo 44 px) e bom contraste.
   Cores de status sempre acompanhadas de ícone e texto (nunca só a cor).
   Celular primeiro; a partir de 900 px aparece o menu lateral do computador. */

:root {
  --fundo: #f3f3ef;
  --superficie: #fcfcfb;
  --tinta: #0b0b0b;
  --tinta-2: #52514e;
  --tinta-3: #898781;
  --linha: #e1e0d9;
  --linha-forte: #c9c8c0;
  --marca: #0f4c5c;
  --marca-2: #0a3945;
  --marca-clara: #e2edf0;
  --ok: #006300;
  --ok-icone: #0ca30c;
  --ok-fundo: #e5f3e5;
  --atencao: #fab219;
  --atencao-texto: #6b4a00;
  --atencao-fundo: #fff4d6;
  --serio: #ec835a;
  --critico: #d03b3b;
  --critico-texto: #a32020;
  --critico-fundo: #fbe9e9;
  --info: #2a78d6;
  --info-texto: #1d5aa6;
  --info-fundo: #e8f0fb;
  --serie-1: #2a78d6;
  --serie-2: #eb6834;
  --serie-3: #1baf7a;
  --raio: 12px;
  --nav-h: 64px;
  color-scheme: light;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--fundo);
  color: var(--tinta);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 16px;
  line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
h1, h2, h3 { line-height: 1.25; }
a { color: var(--marca); }
p { margin: 0 0 10px; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--info); outline-offset: 2px; }
.icone { flex: none; }

/* ---------------- Estrutura ---------------- */
.nav-lateral { display: none; }
.topo {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: calc(env(safe-area-inset-top) + 10px) 16px 10px;
  background: var(--marca); color: #fff;
}
#titulo { margin: 0; font-size: 18px; font-weight: 700; }
.topo-direita { display: flex; align-items: center; gap: 8px; }
.sync-indicador {
  display: inline-flex; align-items: center; gap: 4px; min-height: 36px; min-width: 44px; padding: 4px 8px;
  border: 1px solid rgba(255, 255, 255, .45); border-radius: 999px; background: transparent; color: inherit; font: inherit; font-weight: 800; cursor: pointer;
}
.sync-indicador .icone { width: 20px; height: 20px; }
.sync-alerta { background: var(--atencao); border-color: var(--atencao); color: var(--tinta); }
.sync-girando .icone { animation: pulsar 1.2s ease-in-out infinite; }
@keyframes pulsar { 50% { opacity: .35; } }
.versao { font-size: 12px; opacity: .85; }
main#tela {
  max-width: 960px; margin: 0 auto;
  padding: 12px 16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom));
  outline: none;
}
.carregando { text-align: center; color: var(--tinta-2); padding: 48px 0; }

.nav-baixo {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  height: calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom);
  display: grid; grid-template-columns: repeat(5, 1fr);
  background: var(--superficie); border-top: 1px solid var(--linha);
}
.nav-baixo a {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  min-height: 48px; color: var(--tinta-2); text-decoration: none; font-size: 12px; font-weight: 600;
}
.nav-baixo a[aria-current="page"] { color: var(--marca); }
.nav-baixo a[aria-current="page"] span { text-decoration: underline; text-underline-offset: 3px; }
.nav-baixo .nav-lancar .icone {
  width: 42px; height: 42px; padding: 9px; margin-top: -10px;
  border-radius: 50%; background: var(--marca); color: #fff; box-shadow: 0 2px 8px rgba(15, 76, 92, .35);
}

@media (min-width: 900px) {
  .app { display: grid; grid-template-columns: 236px 1fr; min-height: 100vh; }
  .nav-lateral {
    display: flex; flex-direction: column; gap: 2px;
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
    padding: 16px 12px; background: var(--superficie); border-right: 1px solid var(--linha);
  }
  .nav-lateral a {
    display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 8px 12px;
    border-radius: 10px; color: var(--tinta-2); text-decoration: none; font-weight: 600;
  }
  .nav-lateral a:hover { background: var(--fundo); color: var(--tinta); }
  .nav-lateral a[aria-current="page"] { background: var(--marca-clara); color: var(--marca); }
  .nav-lateral .nav-lancar { background: var(--marca); color: #fff; margin: 6px 0; }
  .nav-lateral .nav-lancar:hover, .nav-lateral .nav-lancar[aria-current="page"] { background: var(--marca-2); color: #fff; }
  .marca { display: flex; align-items: center; gap: 10px; padding: 6px 12px 18px; color: var(--marca); font-size: 19px; font-weight: 800; }
  .nav-baixo { display: none; }
  .topo { position: static; max-width: 960px; margin: 0 auto; padding: 28px 32px 4px; background: none; color: var(--tinta); }
  #titulo { font-size: 24px; }
  .versao { color: var(--tinta-2); }
  .sync-indicador { border-color: var(--linha-forte); color: var(--tinta-2); }
  .sync-alerta { color: var(--tinta); border-color: var(--atencao); }
  main#tela { padding: 12px 32px 64px; }
}

/* ---------------- Cartões e textos ---------------- */
.cartao {
  background: var(--superficie); border: 1px solid var(--linha); border-radius: var(--raio);
  padding: 16px; margin: 0 0 12px;
}
.cartao > h2 { font-size: 16px; margin: 0 0 10px; }
.cartao-lista { padding: 0; overflow: hidden; }
.cartao-lista > h2 { padding: 12px 16px 0; }
.destaque { border: 2px solid var(--marca); }
.zona-perigo { border-color: var(--critico); }
.suave { color: var(--tinta-2); }
.centro { text-align: center; }
.texto-critico { color: var(--critico-texto); font-weight: 700; }
.erro { color: var(--critico-texto); font-weight: 700; min-height: 1.2em; margin: 6px 0; }
.dica { font-size: 14px; color: var(--tinta); background: var(--info-fundo); border-radius: 8px; padding: 8px 10px; margin: 8px 0; }
.dica-inline { display: block; margin-top: 6px; font-size: 13px; }
.vazio { text-align: center; padding: 32px 16px; color: var(--tinta-2); }
.vazio .btn { margin-top: 8px; }
.texto-lista, .qualidade { padding-left: 20px; margin: 0; }
.texto-lista li { margin-bottom: 6px; }
.qualidade li { margin-bottom: 12px; font-size: 14px; }
.definicoes { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 0 0 12px; }
.definicoes dt { color: var(--tinta-2); }
.definicoes dd { margin: 0; font-weight: 700; }
details > summary { cursor: pointer; padding: 8px 0; color: var(--marca); font-weight: 700; }
.ajuda details { border-top: 1px solid var(--linha); }
.ajuda details p { font-size: 15px; }

/* ---------------- Botões ---------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 44px; padding: 10px 16px; border-radius: 10px; border: 1px solid transparent;
  font: inherit; font-weight: 700; line-height: 1.2; cursor: pointer; text-decoration: none; text-align: center;
}
.btn-primario { background: var(--marca); color: #fff; }
.btn-primario:hover { background: var(--marca-2); }
.btn-sec { background: var(--superficie); color: var(--marca); border-color: var(--linha-forte); }
.btn-sec:hover { background: var(--marca-clara); }
.btn-perigo { background: var(--critico); color: #fff; }
.btn-perigo:hover { background: var(--critico-texto); }
.btn-mini { min-height: 38px; padding: 6px 12px; font-size: 14px; }
.btn-grande { min-height: 52px; font-size: 18px; flex: 1 1 auto; }
.btn-link { background: none; border: none; padding: 6px 4px; color: var(--marca); font: inherit; font-weight: 600; text-decoration: underline; cursor: pointer; min-height: 36px; }
.btn-icone {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 44px; min-height: 44px; padding: 0 8px; border-radius: 10px;
  border: 1px solid var(--linha); background: var(--superficie); color: var(--tinta); font: inherit; font-size: 20px; cursor: pointer;
}
.botoes { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }

/* ---------------- Campos ---------------- */
.campo { display: flex; flex-direction: column; gap: 4px; margin: 8px 0; font-size: 14px; font-weight: 700; color: var(--tinta-2); }
.campo input, .campo select, .campo textarea, .campo-data {
  width: 100%; min-height: 44px; padding: 8px 10px;
  font: inherit; font-size: 16px; font-weight: 400; color: var(--tinta);
  background: #fff; border: 1px solid var(--linha-forte); border-radius: 10px;
}
.campo textarea { resize: vertical; }
.campo-check { display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 15px; cursor: pointer; }
.campo-check input { width: 22px; height: 22px; margin: 0; accent-color: var(--marca); flex: none; }
.grupo-campo { border: none; padding: 0; margin: 12px 0; min-width: 0; }
.grupo-campo > legend { padding: 0; margin-bottom: 6px; font-size: 14px; font-weight: 700; color: var(--tinta-2); }
.legenda-valor { color: var(--tinta); font-weight: 600; }
.linha-campos { display: flex; flex-wrap: wrap; gap: 0 12px; align-items: flex-end; }
.linha-campos > * { flex: 1 1 150px; }
.meses-check { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0 8px; }

/* ---------------- Seletor de mês e números do painel ---------------- */
.seletor-mes { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 0 12px; }
.mes-nome { flex: 1; min-height: 44px; border: none; background: none; font: inherit; font-size: 18px; font-weight: 800; color: var(--tinta); cursor: pointer; }
.seletor-mes .btn-link { width: 100%; }

.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0 0 12px; }
.kpi { background: var(--superficie); border: 1px solid var(--linha); border-radius: var(--raio); padding: 12px; min-width: 0; }
.kpi-rotulo { font-size: 13px; font-weight: 700; color: var(--tinta-2); }
.kpi-valor { font-size: 21px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi-sub { font-size: 13px; color: var(--tinta-2); margin-top: 2px; }
.kpi-heroi { grid-column: 1 / -1; order: -1; border: 2px solid var(--marca); }
.kpi-heroi .kpi-valor { font-size: 30px; }
.kpi-negativo .kpi-valor { color: var(--critico-texto); }
@media (min-width: 640px) {
  .kpis { grid-template-columns: repeat(3, 1fr); }
  .kpi-heroi { grid-column: auto; order: 0; }
}
.comparacao { margin: 4px 0; }
.delta { font-size: 15px; }
.delta-ruim { color: var(--critico-texto); }
.delta-bom { color: var(--ok); }

/* ---------------- Alertas ---------------- */
.alertas { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.alerta a { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: 10px; border-left: 4px solid; color: var(--tinta); text-decoration: none; }
.alerta-icone { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 14px; font-weight: 900; color: #fff; }
.alerta-critico a { background: var(--critico-fundo); border-color: var(--critico); }
.alerta-critico .alerta-icone { background: var(--critico); }
.alerta-atencao a { background: var(--atencao-fundo); border-color: var(--atencao); }
.alerta-atencao .alerta-icone { background: var(--atencao); color: var(--tinta); }
.alerta-info a { background: var(--info-fundo); border-color: var(--info); }
.alerta-info .alerta-icone { background: var(--info); }

/* ---------------- Barras horizontais ---------------- */
.barras { list-style: none; margin: 0 0 8px; padding: 0; display: grid; gap: 12px; }
.barra-linha a { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; color: var(--tinta); text-decoration: none; }
.barra-linha .barra { grid-column: 1 / -1; }
.barra-rotulo { font-weight: 600; min-width: 0; }
.barra-rotulo .suave { font-weight: 400; font-size: 13px; }
.barra-valor { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.barra { display: block; height: 10px; border-radius: 5px; background: #ecebe5; overflow: hidden; }
.barra i { display: block; height: 100%; width: 0; border-radius: 5px; background: var(--serie-1); }
.barra.b-atencao i { background: var(--atencao); }
.barra.b-estourado i { background: var(--critico); }
.barra.b-ok i { background: var(--ok-icone); }

/* ---------------- Etiquetas de status ---------------- */
.st { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 800; white-space: nowrap; }
.st-pago { background: var(--ok-fundo); color: var(--ok); }
.st-previsto { background: var(--info-fundo); color: var(--info-texto); }
.st-pendente { background: #eeede8; color: var(--tinta-2); }
.st-vencida { background: var(--critico-fundo); color: var(--critico-texto); }

/* ---------------- Listas ---------------- */
.lista { list-style: none; margin: 0; padding: 0; }
.lista > li + li { border-top: 1px solid var(--linha); }
.linha {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  width: 100%; min-height: 56px; padding: 12px 16px;
  background: none; border: none; color: inherit; font: inherit; text-align: left; text-decoration: none; cursor: pointer;
}
.linha:hover { background: #f5f5f1; }
.linha-principal { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.linha-titulo { font-weight: 600; overflow-wrap: anywhere; }
.linha-sub { font-size: 13px; color: var(--tinta-2); }
.linha-valor { font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
.linha-icone { display: flex; color: var(--marca); }
.valor-receita { color: var(--ok); }
.inativa .linha-titulo { color: var(--tinta-2); }
.lista-mes { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 4px 8px; margin: 0; padding: 12px 16px 6px; font-size: 15px; }
.lista-mes .suave { font-size: 13px; font-weight: 600; }
.lista-simples { list-style: none; margin: 0 0 12px; padding: 0; }
.lista-simples li { display: grid; grid-template-columns: 1fr auto 44px; gap: 8px; align-items: center; min-height: 48px; border-bottom: 1px solid var(--linha); }

/* ---------------- Histórico ---------------- */
.filtros-linha { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 10px; }
@media (min-width: 640px) { .filtros-linha { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 1100px) { .filtros-linha { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.barra-desfazer {
  display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
  margin: 0 0 12px; padding: 8px 12px; background: var(--superficie); border: 1px solid var(--linha); border-radius: 10px; font-size: 14px;
}
.resumo-filtro { margin: 0 0 8px; font-size: 14px; }
.mais-filtros { margin-top: 4px; }

/* ---------------- Lançar ---------------- */
.valor-caixa { margin: 12px 0 8px; padding: 10px 12px; background: var(--superficie); border: 1px solid var(--linha); border-radius: var(--raio); }
.valor-caixa:focus-within { border-color: var(--marca); box-shadow: 0 0 0 2px var(--marca-clara); }
.valor-caixa .rotulo { font-size: 13px; font-weight: 700; color: var(--tinta-2); }
.valor-input {
  width: 100%; padding: 2px 0; border: none; background: transparent; outline: none;
  font: inherit; font-size: 34px; font-weight: 800; text-align: right; color: var(--tinta); font-variant-numeric: tabular-nums;
}
.valor-resumo { min-height: 1.3em; text-align: right; font-size: 14px; color: var(--tinta-2); }
.teclado { display: none; }
body.toque .teclado { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 0 0 8px; }
.tecla {
  min-height: 52px; border-radius: 10px; border: 1px solid var(--linha); background: var(--superficie); color: var(--tinta);
  font: inherit; font-size: 22px; font-weight: 700; cursor: pointer; touch-action: manipulation; user-select: none; -webkit-user-select: none;
}
.tecla:active { background: var(--marca-clara); }
.tecla-op { background: #eeede8; color: var(--marca); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip {
  min-height: 42px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--linha-forte);
  background: var(--superficie); color: var(--tinta); font: inherit; font-size: 15px; cursor: pointer;
}
.chip.ativo { background: var(--marca); border-color: var(--marca); color: #fff; font-weight: 700; }
a.chip { display: inline-flex; align-items: center; text-decoration: none; }
.abas { margin: 0 0 12px; }
.chips + .chips { margin-top: 8px; }
.chips + .cartao, .chips + section { margin-top: 12px; }
.chip-mais { border-style: dashed; color: var(--marca); }
.campo-data { width: auto; flex: 1 1 150px; }
.mais-detalhes { margin: 8px 0; }
.botoes-fixos {
  position: sticky; z-index: 5; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 6px);
  display: flex; gap: 8px; padding: 8px 0; background: var(--fundo);
}
@media (min-width: 900px) { .botoes-fixos { bottom: 0; } }

/* ---------------- Contas do mês e calendário ---------------- */
.resumo-contas { margin: 0 0 10px; }
.conta-linha { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; padding: 12px 16px; }
.conta-info { display: flex; flex-direction: column; min-width: 0; }
.conta-valor { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.conta-botoes { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; }
.conta-botoes:empty { display: none; }
.conta-vencida { box-shadow: inset 4px 0 0 var(--critico); }
.calendario { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal-cab { padding: 4px 0; text-align: center; font-size: 12px; font-weight: 800; color: var(--tinta-2); }
.cal-dia { display: flex; flex-direction: column; gap: 2px; min-height: 64px; min-width: 0; padding: 4px; border: 1px solid var(--linha); border-radius: 8px; overflow: hidden; }
.cal-vazio { border: none; }
.cal-hoje { border: 2px solid var(--marca); }
.cal-num { font-size: 12px; font-weight: 800; color: var(--tinta-2); }
.cal-item { padding: 2px 4px; border-radius: 4px; font-size: 11px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cal-pago { background: var(--ok-fundo); color: var(--ok); }
.cal-previsto { background: var(--info-fundo); color: var(--info-texto); }
.cal-pendente { background: #eeede8; color: var(--tinta-2); }
.cal-vencida { background: var(--critico-fundo); color: var(--critico-texto); font-weight: 800; }
@media (max-width: 639px) {
  .cal-dia { min-height: 48px; }
  .cal-item { height: 6px; padding: 0; font-size: 0; }
  .cal-pago { background: var(--ok-icone); }
  .cal-previsto { background: var(--info); }
  .cal-pendente { background: var(--tinta-3); }
  .cal-vencida { background: var(--critico); }
}
.agenda { list-style: none; margin: 12px 0 0; padding: 0; }
.agenda li { display: grid; grid-template-columns: 52px 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--linha); }
.agenda-dia { font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.2; }
.agenda-dia .suave { font-weight: 600; font-size: 12px; }
.agenda-nome { min-width: 0; }

/* ---------------- Tabelas ---------------- */

/* ---------------- Cartões de crédito ---------------- */

.acerto-conta { list-style: none; margin: 0 0 12px; padding: 0; }

dialog.dialogo {

.dlg { display: flex; flex-direction: column; max-height: calc(100vh - 24px); }

.dlg-corpo { padding: 0 16px; overflow-y: auto; }
.dlg-corpo ul { padding-left: 20px; }
.dlg-erro { min-height: 1.2em; margin: 4px 16px; color: var(--critico-texto); font-weight: 700; }
.dlg-botoes { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; padding: 8px 16px 16px; }

.toast {
  position: fixed; left: 12px; right: 12px; z-index: 50; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 12px);
  width: fit-content; max-width: 560px; margin: 0 auto;
  display: flex; align-items: center; gap: 12px; padding: 10px 14px;
  background: #1f1f1d; color: #fff; border-radius: 12px; box-shadow: 0 4px 16px rgba(0, 0, 0, .25);
  opacity: 0; pointer-events: none; transform: translateY(16px); transition: opacity .2s, transform .2s;
}
.toast.visivel { opacity: 1; pointer-events: auto; transform: translateY(0); }
.toast-acao { min-height: 36px; padding: 0 4px; border: none; background: none; color: #9fd8e6; font: inherit; font-weight: 800; cursor: pointer; }
@media (min-width: 900px) { .toast { bottom: 24px; } }

.aviso-atualizacao {
  position: fixed; left: 12px; right: 12px; top: calc(env(safe-area-inset-top) + 8px); z-index: 60;
  width: fit-content; max-width: 560px; margin: 0 auto;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center;
  padding: 8px 12px; border-radius: 12px; background: #1f1f1d; color: #fff;
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}

/* ---------------- v1.1: orçamento ---------------- */
.st-ok { background: var(--ok-fundo); color: var(--ok); }

.centro-botoes { justify-content: center; }

/* ---------------- v1.1: gráficos ---------------- */
figure.grafico { margin: 0; }
figure.grafico svg { display: block; width: 100%; height: auto; overflow: visible; }
.grafico .alvo { cursor: pointer; }
.grafico .alvo:hover, .grafico .alvo.ativo { fill: rgba(15, 76, 92, .08); }
.grafico-leitura { min-height: 1.4em; margin-top: 6px; font-size: 14px; color: var(--tinta-2); }
.legenda { display: flex; flex-wrap: wrap; gap: 6px 14px; list-style: none; margin: 0 0 8px; padding: 0; font-size: 13px; font-weight: 600; }
.legenda li { display: inline-flex; align-items: center; }
.legenda i { display: inline-block; width: 12px; height: 12px; margin-right: 6px; border-radius: 3px; }
.legenda-calor { gap: 2px; margin-top: 10px; align-items: center; font-weight: 400; color: var(--tinta-2); }

.mapa-calor .fixa { position: sticky; left: 0; z-index: 1; min-width: 132px; max-width: 170px; background: var(--superficie); font-weight: 600; font-size: 12px; }
.mapa-calor .fixa a { color: var(--tinta); }

/* ---------------- v1.1: poupança e sincronização ---------------- */
.campo-curto select { max-width: 240px; }
.cartao-alerta { border: 2px solid var(--atencao); }
.sync-status { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.definicoes-empilhadas { grid-template-columns: 1fr; gap: 2px; }
.definicoes-empilhadas dd { margin-bottom: 10px; font-weight: 400; }
code { padding: 2px 6px; border-radius: 6px; background: #eeede8; font-size: 13px; word-break: break-all; }

<noscript><p>Este app precisa de JavaScript ligado.</p></noscript>
<script>/* App de finanças 1.1.0 — código comentado em português; nenhum dado financeiro aqui. */
var FN = globalThis.FN || {}; globalThis.FN = FN; FN.VERSAO = '1.1.0';
/* ==== core.js ==== */
/* core.js — dinheiro, datas e utilidades (sem tela).
   Regras de ouro do app:
   - dinheiro SEMPRE em centavos inteiros (R$ 10,50 = 1050); nada de float para guardar valor;
   - datas SEMPRE em texto: "AAAA-MM-DD" (data) e "AAAA-MM" (mês de referência).
     Nunca usamos new Date("AAAA-MM-DD"), que o navegador lê como meia-noite em UTC
     e mostra como o dia anterior no horário de Brasília (UTC−3).
   Tudo aqui é coberto por testes/core.test.js. */
var FN = (typeof globalThis !== 'undefined' ? globalThis : window).FN || {};
(typeof globalThis !== 'undefined' ? globalThis : window).FN = FN;

/* ------------------------------------------------------------------ */
/* Dinheiro                                                            */
/* ------------------------------------------------------------------ */
FN.dinheiro = (function () {
  'use strict';

  /** Converte "1.234,56" / "1234,56" / "1234.56" / "10" em centavos, sem float.
   *  Devolve {centavos} ou {erro}. */
  function numeroParaCentavos(texto) {
    const s = String(texto).trim();
    if (!s) return { erro: 'vazio' };
    let inteiro;
    let frac;
    if (s.includes(',')) {
      // vírgula = decimal (padrão brasileiro); pontos antes dela = milhar
      if (s.indexOf(',') !== s.lastIndexOf(',')) return { erro: 'mais de uma vírgula' };
      const [a, b] = s.split(',');
      if (a === '') inteiro = '0';
      else if (/^\d{1,3}(\.\d{3})+$/.test(a) || /^\d+$/.test(a)) inteiro = a.replace(/\./g, '');
      else return { erro: 'número inválido' };
      frac = b;
    } else if (s.includes('.')) {
      if (/^\d{1,3}(\.\d{3})+$/.test(s)) { inteiro = s.replace(/\./g, ''); frac = ''; }   // 1.234 = mil duzentos...
      else if (/^\d+\.\d{1,2}$/.test(s)) { [inteiro, frac] = s.split('.'); }              // 1234.56 = decimal
      else if (/^\d+\.\d{3,}$/.test(s)) return { erro: 'mais de 2 casas decimais' };
      else return { erro: 'número inválido' };
    } else {
      inteiro = s;
      frac = '';
    }
    if (!/^\d+$/.test(inteiro)) return { erro: 'número inválido' };
    if (!/^\d*$/.test(frac)) return { erro: 'número inválido' };
    if (frac.length > 2) return { erro: 'mais de 2 casas decimais' };
    const c = Number(inteiro) * 100 + Number((frac + '00').slice(0, 2));
    if (!Number.isSafeInteger(c)) return { erro: 'número grande demais' };
    return { centavos: c };
  }

  /** Quantidade de uma multiplicação ("2", "1,5", "0.25"): devolve {num, den} exatos. */
  function lerQuantidade(texto) {
    const s = String(texto).trim().replace(',', '.');
    const m = /^(\d+)(?:\.(\d{1,3}))?$/.exec(s);
    if (!m) return { erro: 'quantidade inválida' };
    const casas = (m[2] || '').length;
    const den = Math.pow(10, casas);
    const num = Number(m[1]) * den + Number(m[2] || 0);
    if (num <= 0) return { erro: 'quantidade precisa ser maior que zero' };
    return { num, den };
  }

  /** Arredonda num/den ao inteiro mais próximo (meio para longe do zero). */
  function arredondarDivisao(num, den) {
    if (den <= 0) throw new Error('denominador inválido');
    const neg = num < 0;
    const n = Math.abs(num);
    const r = Math.floor((2 * n + den) / (2 * den));
    return neg ? -r : r;
  }

  const MENSAGENS = {
    'vazio': 'Digite um valor.',
    'mais de uma vírgula': 'Use só uma vírgula em cada valor.',
    'número inválido': 'Não entendi o valor. Exemplos: 15,90 · 1.234,56 · 4,79+10,97',
    'mais de 2 casas decimais': 'Use no máximo 2 casas depois da vírgula (centavos).',
    'número grande demais': 'Valor grande demais.',
    'quantidade inválida': 'Depois do × use uma quantidade, como 2 ou 1,5.',
    'quantidade precisa ser maior que zero': 'A quantidade precisa ser maior que zero.',
  };

  /** Lê o campo de valor do jeito que você lança hoje: "4,79+10,97+27,23" vira 3 itens.
   *  "23,36*2" (ou 23,36x2) é um item só, com a conta guardada.
   *  Devolve {ok, itens:[{centavos, conta}], total} ou {ok:false, erro}. */
  function lerValor(texto) {
    const s = String(texto == null ? '' : texto).replace(/R\$/gi, '').replace(/\s+/g, '');
    if (!s) return { ok: false, erro: MENSAGENS['vazio'] };
    if (/-/.test(s)) return { ok: false, erro: 'Use só valores positivos; para estorno lance como receita.' };
    const termos = s.split('+');
    const itens = [];
    for (const t of termos) {
      if (!t) return { ok: false, erro: 'A conta tem um "+" sobrando.' };
      const partes = t.split(/[*x×]/i);
      if (partes.length > 2) return { ok: false, erro: 'Use só uma multiplicação por item (ex.: 23,36×2).' };
      const r = numeroParaCentavos(partes[0]);
      if (r.erro) return { ok: false, erro: MENSAGENS[r.erro] || r.erro };
      let c = r.centavos;
      let conta = null;
      if (partes.length === 2) {
        const q = lerQuantidade(partes[1]);
        if (q.erro) return { ok: false, erro: MENSAGENS[q.erro] || q.erro };
        c = arredondarDivisao(r.centavos * q.num, q.den);
        conta = formatarNumero(r.centavos) + ' × ' + partes[1].replace('.', ',');
      }
      if (c <= 0) return { ok: false, erro: 'Cada valor precisa ser maior que zero.' };
      itens.push({ centavos: c, conta });
    }
    const total = itens.reduce((a, b) => a + b.centavos, 0);
    if (!Number.isSafeInteger(total)) return { ok: false, erro: MENSAGENS['número grande demais'] };
    return { ok: true, itens, total };
  }

  /** 123456 -> "1.234,56" (sem R$). Negativo usa o sinal de menos tipográfico. */
  function formatarNumero(c) {
    const neg = c < 0;
    const v = Math.abs(Math.round(c));
    const inteiro = Math.floor(v / 100).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    return (neg ? '−' : '') + inteiro + ',' + String(v % 100).padStart(2, '0');
  }

  /** 123456 -> "R$ 1.234,56"; -1005 -> "−R$ 10,05". */
  function brl(c) {
    if (c == null || Number.isNaN(c)) return '—';
    return (c < 0 ? '−' : '') + 'R$ ' + formatarNumero(Math.abs(c));
  }

  /** Forma curta para eixos: 1234567 -> "12,3 mil". */
  function brlCurto(c) {
    const r = c / 100;
    const a = Math.abs(r);
    if (a >= 1e6) return (r / 1e6).toFixed(1).replace('.', ',') + ' mi';
    if (a >= 1e3) return (r / 1e3).toFixed(1).replace('.', ',').replace(',0', '') + ' mil';
    return String(Math.round(r));
  }

  /** Divide um total em n parcelas que somam exatamente o total (centavo a mais nas primeiras). */
  function dividirEmParcelas(total, n) {
    if (!Number.isInteger(total) || total <= 0) throw new Error('total inválido');
    if (!Number.isInteger(n) || n < 1) throw new Error('número de parcelas inválido');
    const base = Math.floor(total / n);
    const resto = total - base * n;
    const out = [];
    for (let i = 0; i < n; i++) out.push(base + (i < resto ? 1 : 0));
    return out;
  }

  /** Metade de um valor, arredondada ao centavo (meio para cima). */
  function metade(c) { return arredondarDivisao(c, 2); }

  /** Porcentagem para exibir: 12.345 -> "12,3%". */
  function pct(valor, casas) {
    if (valor == null || !Number.isFinite(valor)) return '—';
    return valor.toFixed(casas == null ? 1 : casas).replace('.', ',') + '%';
  }

  /** Converte um número do Excel/planilha (ex.: 1234.5) em centavos com arredondamento explícito. */
  function reaisParaCentavos(reais) {
    return Math.round(Number(reais) * 100);
  }

  return { numeroParaCentavos, lerQuantidade, arredondarDivisao, lerValor, formatarNumero, brl, brlCurto,
    dividirEmParcelas, metade, pct, reaisParaCentavos };
})();

/* ------------------------------------------------------------------ */
/* Datas (texto, sem fuso horário)                                     */
/* ------------------------------------------------------------------ */
FN.datas = (function () {
  'use strict';
  const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
  const ABREV = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  const SEMANA = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];

  function pad(n) { return String(n).padStart(2, '0'); }

  /** Data de hoje no relógio do aparelho, montada com os componentes locais (sem UTC). */
  function hoje(agora) {
    const d = agora || new Date();
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }
  function mesAtual(agora) { return hoje(agora).slice(0, 7); }
  function bissexto(a) { return (a % 4 === 0 && a % 100 !== 0) || a % 400 === 0; }
  function diasNoMes(mes) {
    const [a, m] = mes.split('-').map(Number);
    return [31, bissexto(a) ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][m - 1];
  }
  function validarMes(mes) { return typeof mes === 'string' && /^\d{4}-(0[1-9]|1[0-2])$/.test(mes); }
  function validarData(d) {
    if (typeof d !== 'string' || !/^\d{4}-(0[1-9]|1[0-2])-\d{2}$/.test(d)) return false;
    const dia = Number(d.slice(8));
    return dia >= 1 && dia <= diasNoMes(d.slice(0, 7));
  }
  function mesDe(data) { return data.slice(0, 7); }
  function diaDe(data) { return Number(data.slice(8, 10)); }
  function somarMeses(mes, n) {
    const [a, m] = mes.split('-').map(Number);
    const t = a * 12 + (m - 1) + n;
    return `${Math.floor(t / 12)}-${pad((t % 12 + 12) % 12 + 1)}`;
  }
  function listaMeses(inicio, fim) {
    const out = [];
    if (!inicio || !fim || inicio > fim) return out;
    for (let m = inicio; m <= fim; m = somarMeses(m, 1)) out.push(m);
    return out;
  }
  function diferencaMeses(de, ate) {
    const [a1, m1] = de.split('-').map(Number);
    const [a2, m2] = ate.split('-').map(Number);
    return (a2 * 12 + m2) - (a1 * 12 + m1);
  }

  /** Número do dia desde 1970-01-01 (algoritmo civil puro, sem Date). */
  function numeroDoDia(data) {
    let [y, m, d] = data.split('-').map(Number);
    y -= m <= 2 ? 1 : 0;
    const era = Math.floor(y / 400);
    const yoe = y - era * 400;
    const doy = Math.floor((153 * (m + (m > 2 ? -3 : 9)) + 2) / 5) + d - 1;
    const doe = yoe * 365 + Math.floor(yoe / 4) - Math.floor(yoe / 100) + doy;
    return era * 146097 + doe - 719468;
  }
  function dataDoNumero(z) {
    z += 719468;
    const era = Math.floor(z / 146097);
    const doe = z - era * 146097;
    const yoe = Math.floor((doe - Math.floor(doe / 1460) + Math.floor(doe / 36524) - Math.floor(doe / 146096)) / 365);
    const doy = doe - (365 * yoe + Math.floor(yoe / 4) - Math.floor(yoe / 100));
    const mp = Math.floor((5 * doy + 2) / 153);
    const d = doy - Math.floor((153 * mp + 2) / 5) + 1;
    const m = mp + (mp < 10 ? 3 : -9);
    const y = yoe + era * 400 + (m <= 2 ? 1 : 0);
    return `${y}-${pad(m)}-${pad(d)}`;
  }
  function somarDias(data, n) { return dataDoNumero(numeroDoDia(data) + n); }
  function diasEntre(de, ate) { return numeroDoDia(ate) - numeroDoDia(de); }
  /** 0 = domingo ... 6 = sábado */
  function diaDaSemana(data) { return ((numeroDoDia(data) + 4) % 7 + 7) % 7; }

  function formatarData(d) {
    if (!d) return '';
    const [a, m, dd] = d.split('-');
    return `${dd}/${m}/${a}`;
  }
  function formatarDataCurta(d) {
    if (!d) return '';
    return `${d.slice(8, 10)}/${d.slice(5, 7)}`;
  }
  function formatarMes(mes) {
    const [a, m] = mes.split('-');
    return `${ABREV[Number(m) - 1]}/${a}`;
  }
  function nomeMes(mes) {
    const [a, m] = mes.split('-');
    const n = MESES[Number(m) - 1];
    return n.charAt(0).toUpperCase() + n.slice(1) + ' de ' + a;
  }
  /** Converte "25/09/2026" (digitado) em "2026-09-25"; devolve null se inválida. */
  function lerDataBR(texto) {
    const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(String(texto).trim());
    if (!m) return null;
    const d = `${m[3]}-${pad(m[2])}-${pad(m[1])}`;
    return validarData(d) ? d : null;
  }

  /** Mês em que a compra no cartão será paga (mês de referência = mês do pagamento).
   *  cartao.dia_fechamento: dia em que a fatura fecha (31 = último dia do mês).
   *  cartao.dia_vencimento: dia em que a fatura vence.
   *  Compra até o fechamento entra na fatura que fecha naquele mês; depois, na seguinte.
   *  Se o vencimento é depois do fechamento no calendário, vence no mesmo mês do fechamento;

/* Utilidades                                                          */
/* ------------------------------------------------------------------ */
FN.util = (function () {
  'use strict';

  /** Identificador aleatório (não depende de crypto.randomUUID, que exige HTTPS). */
  function novoId(prefixo) {

    let s = '';

    return (prefixo ? prefixo + '-' : '') + s;
  }

  /** Carimbo de data e hora do registro (só para saber qual versão é mais nova ao sincronizar). */
  function agora() { return new Date().toISOString(); }

  /** Compara dois carimbos (texto ISO); devolve >0 se a for mais novo. */
  function compararCarimbos(a, b) {
    const ta = a ? Date.parse(a) : 0;
    const tb = b ? Date.parse(b) : 0;
    return (Number.isNaN(ta) ? 0 : ta) - (Number.isNaN(tb) ? 0 : tb);
  }

  /** JSON canônico: chaves em ordem alfabética, sem espaços (igual ao do script de migração em Python).
   *  Serve para o "sha256_dados" do backup: se um byte mudar, a conferência acusa. */
  function jsonCanonico(v) {
    if (v === null || typeof v !== 'object') return JSON.stringify(v === undefined ? null : v);
    if (Array.isArray(v)) return '[' + v.map(jsonCanonico).join(',') + ']';
    return '{' + Object.keys(v).filter((k) => v[k] !== undefined).sort().map((k) => JSON.stringify(k) + ':' + jsonCanonico(v[k])).join(',') + '}';
  }

  function clonar(v) { return v == null ? v : JSON.parse(JSON.stringify(v)); }

  /** Escapa texto para colocar dentro de HTML (os dados vêm de arquivos: nunca confiar). */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  /** Normaliza texto para busca: sem acento, minúsculo. */
  function normalizar(s) {
    return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  }

  function somaPor(lista, chave, valor) {
    const m = new Map();
    for (const x of lista) {
      const k = typeof chave === 'function' ? chave(x) : x[chave];
      m.set(k, (m.get(k) || 0) + (typeof valor === 'function' ? valor(x) : x[valor]));
    }
    return m;
  }

  function mediana(valores) {
    if (!valores.length) return 0;
    const v = valores.slice().sort((a, b) => a - b);
    const meio = Math.floor(v.length / 2);
    if (v.length % 2) return v[meio];
    return FN.dinheiro.arredondarDivisao(v[meio - 1] + v[meio], 2);

/* ==== regras.js ==== */
/* regras.js — as contas do app: resumo do mês, comparações, contas fixas, cartões, acerto,
   contracheque, orçamento, poupança e alertas. Funções puras sobre o "estado" (sem tela),
   cobertas por testes/regras.test.js e pela reconciliação com a planilha. */
var FN = (typeof globalThis !== 'undefined' ? globalThis : window).FN || {};
(typeof globalThis !== 'undefined' ? globalThis : window).FN = FN;

FN.regras = (function () {
  'use strict';
  const D = FN.datas;
  const U = FN.util;

  const TIPOS = ['despesa', 'receita', 'pagamento_divida', 'transferencia'];
  const TIPO_NOME = { despesa: 'Despesa', receita: 'Receita', pagamento_divida: 'Pagamento de dívida', transferencia: 'Transferência' };

  function ativos(lista) { return (lista || []).filter((x) => x && !x.excluido_em); }
  function porId(lista) { const m = new Map(); for (const x of lista || []) m.set(x.id, x); return m; }

  function categoria(estado, id) { return (estado.categorias || []).find((c) => c.id === id) || null; }
  function nomeCategoria(estado, id) { const c = categoria(estado, id); return c ? c.nome : (id || 'Sem categoria'); }
  function nomeGrupo(estado, id) { const g = (estado.grupos || []).find((x) => x.id === id); return g ? g.nome : (id || 'Sem grupo'); }
  function nomeConta(estado, id) { const c = (estado.contas || []).find((x) => x.id === id); return c ? c.nome : 'Não informado'; }

  /* ---------------- Resumo do mês ---------------- */

  /** Totais de um mês. "saidas" = despesas (pagas + previstas) + pagamento de dívida,
   *  o mesmo que a coluna "soma débitos" (AC) da planilha; "saldo" = coluna "diferença" (AE). */
  function resumoMes(estado, mes) {
    const cats = porId(estado.categorias);
    const r = {
      mes, n: 0, receitas: 0, receitas_previstas: 0, despesas_pagas: 0, despesas_previstas: 0,
      divida: 0, transferencias: 0, por_categoria: {}, por_grupo: {}, por_categoria_pago: {},
    };
    for (const x of ativos(estado.lancamentos)) {
      if (x.mes_ref !== mes) continue;
      r.n++;
      const v = x.valor_centavos;
      if (x.tipo === 'receita') {
        if (x.status === 'previsto') r.receitas_previstas += v; else r.receitas += v;
      } else if (x.tipo === 'despesa') {
        if (x.status === 'previsto') r.despesas_previstas += v; else r.despesas_pagas += v;
        r.por_categoria[x.categoria_id] = (r.por_categoria[x.categoria_id] || 0) + v;
        if (x.status !== 'previsto') r.por_categoria_pago[x.categoria_id] = (r.por_categoria_pago[x.categoria_id] || 0) + v;
        const g = (cats.get(x.categoria_id) || {}).grupo_id || 'sem-grupo';
        r.por_grupo[g] = (r.por_grupo[g] || 0) + v;
      } else if (x.tipo === 'pagamento_divida') {
        r.divida += v;
      } else if (x.tipo === 'transferencia') {
        r.transferencias += v;
      }
    }
    r.despesas = r.despesas_pagas + r.despesas_previstas;
    r.receitas_total = r.receitas + r.receitas_previstas;
    r.saidas = r.despesas + r.divida;
    r.saldo = r.receitas_total - r.saidas;
    r.sobra_pct = r.receitas_total ? (r.saldo / r.receitas_total) * 100 : null;
    return r;
  }

  function mesesComDados(estado) {
    const s = new Set();
    for (const x of ativos(estado.lancamentos)) s.add(x.mes_ref);
    return [...s].sort();
  }

  function inicioHistorico(estado) {
    const cfg = (estado.config || {}).inicio_historico;
    const meses = mesesComDados(estado);
    return cfg || meses[0] || D.mesAtual();
  }

  /** Média dos n meses anteriores a `mes` que têm lançamentos (meses fechados). */
  function mediaMeses(estado, mes, n) {
    n = n || 12;
    const ini = inicioHistorico(estado);
    const comDados = new Set(mesesComDados(estado));
    const meses = [];
    for (let i = 1; i <= n; i++) {
      const m = D.somarMeses(mes, -i);
      if (m < ini) break;
      if (comDados.has(m)) meses.push(m);
    }
    if (!meses.length) return null;
    const rs = meses.map((m) => resumoMes(estado, m));
    const soma = (k) => rs.reduce((a, r) => a + r[k], 0);
    return {
      meses, n: meses.length,
      saidas: FN.dinheiro.arredondarDivisao(soma('saidas'), meses.length),
      despesas: FN.dinheiro.arredondarDivisao(soma('despesas'), meses.length),
      receitas: FN.dinheiro.arredondarDivisao(soma('receitas_total'), meses.length),
      saldo: FN.dinheiro.arredondarDivisao(soma('saldo'), meses.length),
    };
  }

  /** Categorias que mais aparecem nos últimos 3 meses com lançamentos (para o topo da tela de lançar). */
  function maisUsadas(estado, tipo, mesRef, quantas) {
    const limite = D.somarMeses(mesRef || D.mesAtual(), -3);
    const cont = new Map();
    const contTudo = new Map();
    for (const x of ativos(estado.lancamentos)) {
      if (x.tipo !== tipo) continue;
      contTudo.set(x.categoria_id, (contTudo.get(x.categoria_id) || 0) + 1);
      if (x.mes_ref >= limite) cont.set(x.categoria_id, (cont.get(x.categoria_id) || 0) + 1);
    }
    const ativasIds = new Set((estado.categorias || []).filter((c) => c.ativa !== false && !c.excluido_em && (c.tipo === tipo || (tipo === 'despesa' && c.tipo === 'despesa'))).map((c) => c.id));
    const ordenar = (m) => [...m.entries()].filter(([id]) => ativasIds.has(id)).sort((a, b) => b[1] - a[1]).map(([id]) => id);
    const lista = ordenar(cont);
    for (const id of ordenar(contTudo)) if (!lista.includes(id)) lista.push(id);
    for (const c of (estado.categorias || []).slice().sort((a, b) => (a.ordem || 0) - (b.ordem || 0))) {
      if (ativasIds.has(c.id) && !lista.includes(c.id)) lista.push(c.id);

  /* ---------------- Contracheque ---------------- */

  const BASE_IR_PADRAO = {
    soma: ['subsidio', 'subsidio-retroativo'],
    subtrai: ['subsidio-desconto-pontual', 'seguridade-social', 'seguridade-retroativa'],
  };

  /** Contracheque de um mês: bruto (proventos que entram no bruto), descontos, líquido,
   *  auxílio-alimentação (fora do bruto), base do IR calculada e alíquota efetiva do IR. */
  function contracheque(estado, mes) {
    const verbas = porId(estado.verbas);
    const cfg = (estado.config || {}).base_ir || BASE_IR_PADRAO;
    const out = {
      mes, proventos: [], descontos: [], beneficios: [], informativos: [],
      bruto: 0, descontos_total: 0, beneficios_total: 0, ir: 0, base_ir: 0, base_ir_planilha: null, linhas: 0,
    };
    for (const c of ativos(estado.contracheque)) {
      if (c.mes_ref !== mes) continue;
      out.linhas++;
      const v = verbas.get(c.verba_id) || { id: c.verba_id, nome: c.verba_id, tipo: 'informativo' };
      const item = { id: c.id, verba_id: v.id, nome: v.nome, valor: c.valor_centavos, obs: c.obs || '' };
      if (v.tipo === 'provento' && v.entra_no_bruto) { out.proventos.push(item); out.bruto += c.valor_centavos; }
      else if (v.tipo === 'provento') { out.beneficios.push(item); out.beneficios_total += c.valor_centavos; }
      else if (v.tipo === 'desconto') {
        out.descontos.push(item); out.descontos_total += c.valor_centavos;
        if (v.grupo === 'ir') out.ir += c.valor_centavos;
      } else {
        out.informativos.push(item);
        if (v.id === 'base-ir-planilha') out.base_ir_planilha = c.valor_centavos;
      }
      if (cfg.soma.includes(v.id)) out.base_ir += c.valor_centavos;
      if (cfg.subtrai.includes(v.id)) out.base_ir -= c.valor_centavos;

    out.receita = out.liquido + out.beneficios_total;   // = coluna "soma créditos" (AD) da planilha

  /** Recalcula o acerto mês a mês: valor-base + extras − débitos + saldo negativo do mês anterior.

  function acerto(estado, ateMes) {

    if (!recs.length && !ateMes) return [];
    const inicio = regra.inicio || (recs[0] ? recs[0].mes_ref : ateMes);
    let fim = ateMes || D.mesAtual();
    if (recs.length && recs[recs.length - 1].mes_ref > fim) fim = recs[recs.length - 1].mes_ref;
    const porMes = new Map(recs.map((r) => [r.mes_ref, r]));
    const pagos = new Map();
    for (const x of ativos(estado.lancamentos)) {
      if (x.categoria_id === regra.categoria_repasse_id && x.tipo === 'despesa') {
        const p = pagos.get(x.mes_ref) || { pago: 0, previsto: 0, ids: [] };
        if (x.status === 'previsto') p.previsto += x.valor_centavos; else p.pago += x.valor_centavos;

      const base = baseDoMes(regra, mes);
      const tExtras = extras.reduce((a, e) => a + e.valor_centavos, 0);

      const resultado = base + tExtras - tDebitos + saldo;
      const repasse = Math.max(resultado, 0);

        resultado, repasse, saldo_proximo: proximo, registrado_pago: p.pago, registrado_previsto: p.previsto,
        lancamentos_ids: p.ids, registro: rec,

  /* ---------------- Contas fixas (recorrentes) ---------------- */

  function recorrenteAplica(r, mes) {
    if (!r || r.excluido_em || r.ativa === false) return false;
    if (r.inicio && mes < r.inicio) return false;
    if (r.fim && mes > r.fim) return false;

  }

  /** Situação de cada conta fixa no mês: paga, prevista ou pendente (e vencida, se passou do dia). */
  function contasDoMes(estado, mes, hoje) {
    hoje = hoje || D.hoje();
    const recs = ativos(estado.recorrentes).filter((r) => recorrenteAplica(r, mes));
    const lancs = ativos(estado.lancamentos).filter((x) => x.mes_ref === mes && x.tipo !== 'receita');
    const porCategoria = new Map();
    for (const r of recs) porCategoria.set(r.categoria_id, (porCategoria.get(r.categoria_id) || 0) + 1);
    const usadosPorOutro = new Set(lancs.filter((x) => x.recorrente_id).map((x) => x.id));
    return recs.map((r) => {

      const pago = ls.filter((x) => x.status !== 'previsto').reduce((a, x) => a + x.valor_centavos, 0);

  function cartoes(estado) {

  }

  /** Fatura de um cartão num mês de pagamento: o que foi lançado nele e o registro de pagamento. */
  function fatura(estado, conta, mes) {

    const reg = ativos(estado.faturas).find((f) => f.conta_id === conta.id && f.mes_ref === mes) || null;
    const total = ls.reduce((a, x) => a + x.valor_centavos, 0);
    const previsto = ls.filter((x) => x.status === 'previsto').reduce((a, x) => a + x.valor_centavos, 0);
    const vencimento = conta.dia_vencimento ? D.vencimentoNoMes(mes, conta.dia_vencimento) : null;
    return { conta, mes, lancamentos: ls, total, previsto, pago: total - previsto, registro: reg, vencimento };
  }

  /** Compras parceladas que ainda têm parcelas por pagar. */
  function parcelasEmAberto(estado) {
    const lancs = ativos(estado.lancamentos);
    const out = [];
    for (const cp of ativos(estado.compras_parceladas)) {
      const parcelas = lancs.filter((x) => x.compra_parcelada_id === cp.id).sort((a, b) => (a.parcela_num || 0) - (b.parcela_num || 0));
      const abertas = parcelas.filter((x) => x.status === 'previsto');
      if (!abertas.length) continue;
      out.push({
        compra: cp, parcelas, faltam: abertas.length, total: parcelas.length,
        valor_restante: abertas.reduce((a, x) => a + x.valor_centavos, 0),

  /* ---------------- Orçamento ---------------- */

  /** Orçamento vigente de cada categoria/grupo no mês e quanto já foi gasto (pago + previsto). */
  function orcamentoMes(estado, mes) {
    const res = resumoMes(estado, mes);
    const vig = new Map();
    for (const o of ativos(estado.orcamentos)) {
      if (o.vigencia_inicio && mes < o.vigencia_inicio) continue;
      if (o.vigencia_fim && mes > o.vigencia_fim) continue;
      const chave = o.alvo_tipo + ':' + o.alvo_id;
      const atual = vig.get(chave);
      if (!atual || (o.vigencia_inicio || '') > (atual.vigencia_inicio || '')) vig.set(chave, o);
    }

    for (const o of vig.values()) {

      const p = o.valor_centavos ? (gasto / o.valor_centavos) * 100 : null;

  /** Sugestão de orçamento: mediana dos n meses fechados anteriores (gasto pago; mês sem gasto conta como zero). */
  function sugestaoOrcamento(estado, alvoTipo, alvoId, mes, n) {
    n = n || 6;
    const ini = inicioHistorico(estado);
    const valores = [];
    for (let i = 1; i <= n; i++) {
      const m = D.somarMeses(mes, -i);
      if (m < ini) break;
      const r = resumoMes(estado, m);
      if (!r.n) continue;
      if (alvoTipo === 'grupo') {
        const cats = new Set((estado.categorias || []).filter((c) => c.grupo_id === alvoId).map((c) => c.id));
        valores.push(Object.entries(r.por_categoria_pago).filter(([k]) => cats.has(k)).reduce((a, [, v]) => a + v, 0));
      } else {
        valores.push(r.por_categoria_pago[alvoId] || 0);
      }
    }
    return { valor: U.mediana(valores), meses: valores.length, valores };
  }

  /* ---------------- Poupança e reserva ---------------- */

  function sinalPoupanca(tipo) { return tipo === 'resgate' ? -1 : 1; }

  /** Saldo da poupança: saldo inicial informado + movimentos depois dele.
   *  No mesmo dia do saldo, só conta o movimento lançado depois de informar o saldo (o de antes já
   *  estava no extrato). Registros históricos (anteriores ao saldo inicial) não mudam o saldo. */
  function poupanca(estado) {
    const ini = (estado.config || {}).poupanca_saldo_inicial || null;
    const movs = ativos(estado.poupanca).slice().sort((a, b) => ((a.data || a.mes_ref + '-00') < (b.data || b.mes_ref + '-00') ? -1 : 1));
    if (!ini) return { definido: false, saldo: null, movimentos: movs, considerados: [] };
    const depois = (m) => {
      const d = m.data || (m.mes_ref + '-31');
      if (d !== ini.data) return d > ini.data;
      return !!(ini.registrado_em && m.criado_em && m.criado_em > ini.registrado_em);
    };
    const considerados = movs.filter((m) => !m.historico && depois(m));
    const saldo = considerados.reduce((a, m) => a + sinalPoupanca(m.tipo) * m.valor_centavos, ini.valor_centavos);
    return { definido: true, saldo, inicial: ini, movimentos: movs, considerados };
  }

  /** Média mensal das despesas essenciais (categorias com a etiqueta "essencial") nos n meses fechados. */
  function mediaEssenciais(estado, mes, n) {
    n = n || 12;
    const ess = new Set((estado.categorias || []).filter((c) => (c.etiquetas || []).includes('essencial')).map((c) => c.id));
    const comDados = new Set(mesesComDados(estado));
    const ini = inicioHistorico(estado);
    const valores = [];
    for (let i = 1; i <= n; i++) {
      const m = D.somarMeses(mes, -i);
      if (m < ini) break;
      if (!comDados.has(m)) continue;
      const r = resumoMes(estado, m);
      valores.push(Object.entries(r.por_categoria).filter(([k]) => ess.has(k)).reduce((a, [, v]) => a + v, 0));
    }
    if (!valores.length) return null;
    return { media: FN.dinheiro.arredondarDivisao(valores.reduce((a, b) => a + b, 0), valores.length), meses: valores.length };
  }

  function reserva(estado, mes) {
    const p = poupanca(estado);
    const m = mediaEssenciais(estado, mes, 12);
    const meta = (estado.config || {}).meta_reserva_meses || 6;
    const meses = p.definido && m && m.media ? p.saldo / m.media : null;
    return { poupanca: p, media_essenciais: m, meses, meta };
  }

  /* ---------------- Séries para relatórios ---------------- */

  function serieMensal(estado, meses) {
    return meses.map((m) => resumoMes(estado, m));
  }

  function totaisPorCategoria(estado, meses) {
    const tot = new Map();
    const set = new Set(meses);
    for (const x of ativos(estado.lancamentos)) {
      if (x.tipo !== 'despesa' || !set.has(x.mes_ref)) continue;
      tot.set(x.categoria_id, (tot.get(x.categoria_id) || 0) + x.valor_centavos);
    }
    return [...tot.entries()].map(([id, v]) => ({ id, valor: v })).sort((a, b) => b.valor - a.valor);
  }

  function totaisPorGrupo(estado, meses) {
    const cats = porId(estado.categorias);
    const tot = new Map();
    for (const it of totaisPorCategoria(estado, meses)) {
      const g = (cats.get(it.id) || {}).grupo_id || 'sem-grupo';
      tot.set(g, (tot.get(g) || 0) + it.valor);
    }
    return [...tot.entries()].map(([id, v]) => ({ id, valor: v })).sort((a, b) => b.valor - a.valor);
  }

  /* ---------------- Alertas ---------------- */

  /** Alertas do mês. nivel: "critico" (vencido, estourado), "atencao" (vence logo, 80%), "info". */
  function alertas(estado, mes, hoje) {
    hoje = hoje || D.hoje();
    const out = [];
    const mesHoje = D.mesDe(hoje);
    if (mes === mesHoje) {
      for (const c of contasDoMes(estado, mes, hoje)) {
        if (c.status === 'pago') continue;
        const nome = c.recorrente.descricao;
        if (c.vencida) out.push({ nivel: 'critico', texto: `${nome}: venceu em ${D.formatarDataCurta(c.vencimento)} e não está marcada como paga.`, rota: '#/contas' });
        else if (c.dias !== null && c.dias <= 3) out.push({ nivel: 'atencao', texto: `${nome} vence ${c.dias === 0 ? 'hoje' : c.dias === 1 ? 'amanhã' : 'em ' + c.dias + ' dias'} (${D.formatarDataCurta(c.vencimento)}).`, rota: '#/contas' });
      }
      const semLanc = contasDoMes(estado, mes, hoje).filter((c) => c.status === 'pendente' && !c.vencimento);
      if (semLanc.length) out.push({ nivel: 'info', texto: `${semLanc.length} conta(s) fixa(s) do mês ainda sem lançamento.`, rota: '#/contas' });
      for (const cartao of cartoes(estado)) {
        const f = fatura(estado, cartao, mes);
        if (f.previsto > 0 && f.vencimento) {
          const dias = D.diasEntre(hoje, f.vencimento);
          if (dias < 0) out.push({ nivel: 'critico', texto: `Fatura ${cartao.nome} venceu em ${D.formatarDataCurta(f.vencimento)} e não foi registrada como paga.`, rota: '#/cartoes' });
          else if (dias <= 5) out.push({ nivel: 'atencao', texto: `Fatura ${cartao.nome} vence ${dias === 0 ? 'hoje' : 'em ' + dias + ' dia(s)'}: ${FN.dinheiro.brl(f.total)}.`, rota: '#/cartoes' });
        }
      }
      const reg = regraAcerto(estado);
      if (reg) {
        const a = acerto(estado, mes).find((x) => x.mes === mes);
        if (a && a.repasse > 0 && !a.registrado_pago) out.push({ nivel: 'info', texto: `Repasse para ${reg.pessoa || 'o acerto'} do mês ainda não registrado (${FN.dinheiro.brl(a.repasse)}).`, rota: '#/acerto' });
      }
    }
    // orçamento: um aviso por nível (não um por categoria), para o início não virar uma lista enorme
    const orc = orcamentoMes(estado, mes).sort((a, b) => (b.pct || 0) - (a.pct || 0));
    const nomeOrc = (o) => (o.orcamento.alvo_tipo === 'grupo' ? nomeGrupo(estado, o.orcamento.alvo_id) : nomeCategoria(estado, o.orcamento.alvo_id));
    const lista = (itens) => {
      const nomes = itens.slice(0, 3).map((o) => `${nomeOrc(o)} (${FN.dinheiro.pct(o.pct, 0)})`);
      return nomes.join(', ') + (itens.length > 3 ? ` e mais ${itens.length - 3}` : '');
    };
    const estourados = orc.filter((o) => o.nivel === 'estourado');
    const atencao = orc.filter((o) => o.nivel === 'atencao');
    if (estourados.length) out.push({ nivel: 'critico', texto: `Orçamento estourado em ${estourados.length} ${estourados.length === 1 ? 'item' : 'itens'}: ${lista(estourados)}.`, rota: '#/orcamento' });
    if (atencao.length) out.push({ nivel: 'atencao', texto: `${atencao.length} ${atencao.length === 1 ? 'item chegou' : 'itens chegaram'} a 80% ou mais do orçamento: ${lista(atencao)}.`, rota: '#/orcamento' });
    const cfg = estado.config || {};
    const temDados = ativos(estado.lancamentos).length > 0;
    if (temDados) {
      const dias = cfg.lembrete_backup_dias || 7;
      const ult = cfg.ultimo_backup && D.validarData(cfg.ultimo_backup) ? cfg.ultimo_backup : null;   // data local AAAA-MM-DD
      if (!ult) out.push({ nivel: 'atencao', texto: 'Você ainda não fez nenhum backup neste aparelho.', rota: '#/dados' });
      else if (D.diasEntre(ult, hoje) > dias) out.push({ nivel: 'atencao', texto: `Último backup há ${D.diasEntre(ult, hoje)} dias. Faça um novo.`, rota: '#/dados' });
    }
    const ordem = { critico: 0, atencao: 1, info: 2 };
    return out.sort((a, b) => ordem[a.nivel] - ordem[b.nivel]);
  }

  return {
    TIPOS, TIPO_NOME, ativos, porId, categoria, nomeCategoria, nomeGrupo, nomeConta,
    resumoMes, mesesComDados, inicioHistorico, mediaMeses, maisUsadas,
    BASE_IR_PADRAO, contracheque, mesesContracheque,
    regraAcerto, baseDoMes, acerto,
    recorrenteAplica, contasDoMes,
    cartoes, fatura, parcelasEmAberto,
    orcamentoMes, sugestaoOrcamento,
    poupanca, mediaEssenciais, reserva,
    serieMensal, totaisPorCategoria, totaisPorGrupo,
    alertas,
  };
})();

/* ==== dados.js ==== */
/* dados.js — formato do backup, importação (base migrada ou backup do app), conferência de
   integridade, junção de dois aparelhos (sincronização) e exportação.
   O mesmo formato serve para a base migrada, o backup e o pacote de sincronização. */
var FN = (typeof globalThis !== 'undefined' ? globalThis : window).FN || {};
(typeof globalThis !== 'undefined' ? globalThis : window).FN = FN;

FN.dados = (function () {
  'use strict';
  const U = FN.util;
  const D = FN.datas;

  const FORMATO = 'app-financas-backup';
  const FORMATO_CIFRADO = 'app-financas-cifrado';
  const VERSAO_FORMATO = 1;
  const TABELAS = ['grupos', 'categorias', 'contas', 'lancamentos', 'recorrentes', 'compras_parceladas', 'orcamentos',
    'verbas', 'contracheque', 'acerto_meses', 'poupanca', 'qualidade', 'faturas'];
  /** Configurações que são do aparelho e não viajam no backup nem na sincronização. */
  const CONFIG_LOCAL = new Set(['dispositivo', 'ultimo_backup', 'ultima_sincronizacao', 'sync_senha', 'drive_arquivo_id',
    'persistencia_pedida', 'lembrete_adiado', 'importacao', 'sync_ativa', 'sync_estado', 'drive_token', 'sync_chave']);

  function estadoVazio() {
    const e = { config: {}, configMeta: {} };
    for (const t of TABELAS) e[t] = [];
    return e;
  }

  /** Completa campos de controle que a base migrada não tem (id do mês do acerto, carimbos). */
  function completar(tabela, x, carimbo, dispositivo, i) {
    const r = Object.assign({}, x);
    if (tabela === 'acerto_meses') {
      if (!r.id) r.id = 'am-' + r.mes_ref;
      r.extras = (r.extras || []).map((e, k) => Object.assign({ id: r.id + '-x' + (k + 1) }, e));
      r.debitos = (r.debitos || []).map((d, k) => Object.assign({ id: r.id + '-d' + (k + 1) }, d));
    }
    if (!r.id) r.id = tabela + '-' + (i + 1);
    if (!r.criado_em) r.criado_em = carimbo;
    if (!r.atualizado_em) r.atualizado_em = carimbo;
    if (r.excluido_em === undefined) r.excluido_em = null;
    if (!r.dispositivo) r.dispositivo = dispositivo;
    return r;
  }

  function erroFormato(backup) {
    if (!backup || typeof backup !== 'object') return 'O arquivo não é um JSON válido do app.';
    if (backup.formato === FORMATO_CIFRADO) return null;
    if (backup.formato !== FORMATO) return 'Este arquivo não é um backup do app (formato desconhecido).';
    if (!(backup.versao_formato >= 1)) return 'Backup sem versão de formato.';
    if (backup.versao_formato > VERSAO_FORMATO) return 'Backup feito por uma versão mais nova do app. Atualize o app antes de importar.';
    if (!backup.dados || typeof backup.dados !== 'object') return 'Backup sem dados.';
    return null;
  }

  /** Confere o sha256 dos dados (gravado no arquivo) com o conteúdo lido. */
  async function conferirIntegridade(backup) {
    if (!backup.sha256_dados) return { conferido: false, ok: true, motivo: 'arquivo sem código de conferência' };
    if (!FN.cripto || !FN.cripto.disponivel()) return { conferido: false, ok: true, motivo: 'navegador sem criptografia disponível' };
    const sha = await FN.cripto.sha256Hex(U.jsonCanonico(backup.dados));
    return { conferido: true, ok: sha === backup.sha256_dados, esperado: backup.sha256_dados, calculado: sha };
  }

  /** Transforma o conteúdo de um backup no estado do app, conferindo cada registro.
   *  Devolve {estado, erros, avisos, contagens}. Com erros, a importação não deve prosseguir. */
  function normalizar(backup) {
    const msg = erroFormato(backup);
    if (msg) return { estado: null, erros: [msg], avisos: [], contagens: {} };
    const dd = backup.dados;
    const carimbo = backup.gerado_em || U.agora();
    const disp = backup.dispositivo || backup.origem || 'importacao';
    const e = estadoVazio();
    for (const t of TABELAS) {
      const lista = Array.isArray(dd[t]) ? dd[t] : [];
      e[t] = lista.map((x, i) => completar(t, x, carimbo, disp, i));
    }
    // configuração: objeto simples (base migrada) ou lista de registros (backup do app)
    const regs = [];
    if (Array.isArray(dd.config)) regs.push(...dd.config);
    else if (dd.config && typeof dd.config === 'object') for (const [k, v] of Object.entries(dd.config)) regs.push({ id: k, valor: v });
    if (dd.acerto_regra && !regs.some((r) => r.id === 'acerto_regra')) regs.push({ id: 'acerto_regra', valor: dd.acerto_regra });
    for (const r of regs) {
      if (!r || !r.id || CONFIG_LOCAL.has(r.id) || r.excluido_em) continue;
      e.config[r.id] = r.valor;
      e.configMeta[r.id] = { atualizado_em: r.atualizado_em || carimbo, dispositivo: r.dispositivo || disp };
    }
    const { erros, avisos } = validar(e);
    return { estado: e, erros, avisos, contagens: contar(e) };
  }

  /** Confere tipos e campos obrigatórios. Qualquer erro impede a importação. */
  function validar(e) {
    const erros = [];
    const avisos = [];
    const add = (lista, t) => { if (lista.length < 30) lista.push(t); };
    const ids = new Map();
    for (const t of TABELAS) {
      for (const x of e[t]) {
        const k = t + ':' + x.id;
        if (ids.has(k)) add(erros, `${t}: identificador repetido (${x.id}).`);
        ids.set(k, true);
      }
    }
    const cats = new Set(e.categorias.map((c) => c.id));
    const verbas = new Set(e.verbas.map((v) => v.id));
    for (const x of e.lancamentos) {
      if (x.excluido_em) continue;
      if (!FN.regras.TIPOS.includes(x.tipo)) add(erros, `Lançamento ${x.id}: tipo "${x.tipo}" desconhecido.`);
      if (!D.validarMes(x.mes_ref)) add(erros, `Lançamento ${x.id}: mês de referência inválido (${x.mes_ref}).`);
      if (!Number.isSafeInteger(x.valor_centavos) || x.valor_centavos <= 0) add(erros, `Lançamento ${x.id}: valor inválido (${x.valor_centavos}).`);
      if (!['pago', 'previsto'].includes(x.status)) add(erros, `Lançamento ${x.id}: status inválido (${x.status}).`);
      if (x.data && !D.validarData(x.data)) add(erros, `Lançamento ${x.id}: data inválida (${x.data}).`);
      if (x.categoria_id && !cats.has(x.categoria_id)) add(avisos, `Lançamento ${x.id}: categoria "${x.categoria_id}" não existe.`);
    }
    for (const c of e.contracheque) {
      if (c.excluido_em) continue;
      if (!D.validarMes(c.mes_ref)) add(erros, `Contracheque ${c.id}: mês inválido.`);
      if (!Number.isSafeInteger(c.valor_centavos)) add(erros, `Contracheque ${c.id}: valor inválido.`);
      if (!verbas.has(c.verba_id)) add(avisos, `Contracheque ${c.id}: verba "${c.verba_id}" não existe.`);
    }
    for (const a of e.acerto_meses) {
      if (!D.validarMes(a.mes_ref)) add(erros, `Acerto ${a.id}: mês inválido.`);
      for (const d of (a.debitos || []).concat(a.extras || [])) {
        if (!Number.isSafeInteger(d.valor_centavos) || d.valor_centavos <= 0) add(erros, `Acerto ${a.mes_ref}: valor inválido (${d.valor_centavos}).`);
      }
    }
    for (const p of e.poupanca) {
      if (!Number.isSafeInteger(p.valor_centavos) || p.valor_centavos <= 0) add(erros, `Poupança ${p.id}: valor inválido.`);
    }
    return { erros, avisos };
  }

  function contar(e) {
    const ativos = (l) => l.filter((x) => !x.excluido_em);
    const lanc = ativos(e.lancamentos);
    const meses = [...new Set(lanc.map((x) => x.mes_ref))].sort();
    return {
      lancamentos: lanc.length, primeiro_mes: meses[0] || null, ultimo_mes: meses[meses.length - 1] || null,
      contracheque: ativos(e.contracheque).length, acerto_meses: ativos(e.acerto_meses).length,
      poupanca: ativos(e.poupanca).length, recorrentes: ativos(e.recorrentes).length,
      categorias: ativos(e.categorias).length, contas: ativos(e.contas).length,
      compras_parceladas: ativos(e.compras_parceladas).length, orcamentos: ativos(e.orcamentos).length,
    };
  }

  function maisNovo(a, b) {
    const c = U.compararCarimbos(a.atualizado_em, b.atualizado_em);
    if (c !== 0) return c > 0;
    return String(a.dispositivo || '') > String(b.dispositivo || '');
  }

  /** Junta dois estados registro a registro: vale a alteração mais recente de cada um.
   *  Exclusões viajam como "lixeira" (excluido_em preenchido), então também se propagam. */
  function mesclar(local, remoto) {
    const res = estadoVazio();
    const stats = { novos: 0, atualizados: 0, mantidos: 0 };
    for (const t of TABELAS) {
      const m = new Map((local[t] || []).map((x) => [x.id, x]));
      for (const r of remoto[t] || []) {
        const l = m.get(r.id);
        if (!l) { m.set(r.id, r); stats.novos++; }
        else if (maisNovo(r, l)) { m.set(r.id, r); stats.atualizados++; }
        else stats.mantidos++;
      }
      res[t] = [...m.values()];
    }
    const chaves = new Set([...Object.keys(local.configMeta || {}), ...Object.keys(remoto.configMeta || {})]);
    for (const k of chaves) {
      if (CONFIG_LOCAL.has(k)) {
        if (k in (local.config || {})) { res.config[k] = local.config[k]; res.configMeta[k] = local.configMeta[k]; }
        continue;
      }
      const lm = (local.configMeta || {})[k];
      const rm = (remoto.configMeta || {})[k];
      const usarRemoto = rm && (!lm || maisNovo(rm, lm));
      res.config[k] = usarRemoto ? remoto.config[k] : local.config[k];
      res.configMeta[k] = usarRemoto ? rm : lm;
    }
    for (const k of Object.keys(local.config || {})) {
      if (!(k in res.config)) { res.config[k] = local.config[k]; res.configMeta[k] = (local.configMeta || {})[k]; }
    }
    return { estado: res, stats };
  }

  /** O que "remoto" tem de novo ou mais recente que "local", registro a registro (sem regravar tudo).
   *  Usado pela sincronização: diferencas(local, remoto) = o que aplicar aqui;
   *  diferencas(remoto, local) = o que falta lá (se houver, é preciso enviar). */
  function diferencas(local, remoto) {
    const registros = [];
    for (const t of TABELAS) {
      const m = new Map((local[t] || []).map((x) => [x.id, x]));
      for (const r of remoto[t] || []) {
        const l = m.get(r.id);
        if (!l || maisNovo(r, l)) registros.push({ tabela: t, registro: r });
      }
    }
    const config = [];
    for (const k of Object.keys(remoto.configMeta || {})) {
      if (CONFIG_LOCAL.has(k)) continue;
      const rm = remoto.configMeta[k];
      const lm = (local.configMeta || {})[k];
      if (rm && (!lm || maisNovo(rm, lm))) {
        config.push({ id: k, valor: remoto.config[k], atualizado_em: rm.atualizado_em, dispositivo: rm.dispositivo || '', excluido_em: null });
      }
    }
    return { registros, config, total: registros.length + config.length };
  }

  /** Monta o arquivo de backup/sincronização a partir do estado (inclui a lixeira). */
  async function exportar(estado, meta) {
    const dados = {};
    for (const t of TABELAS) dados[t] = estado[t] || [];
    dados.config = Object.keys(estado.config || {}).filter((k) => !CONFIG_LOCAL.has(k)).sort().map((k) => ({
      id: k, valor: estado.config[k],
      atualizado_em: ((estado.configMeta || {})[k] || {}).atualizado_em || U.agora(),
      dispositivo: ((estado.configMeta || {})[k] || {}).dispositivo || meta.dispositivo || '',
      excluido_em: null,
    }));
    const sha = FN.cripto && FN.cripto.disponivel() ? await FN.cripto.sha256Hex(U.jsonCanonico(dados)) : null;
    return {
      formato: FORMATO, versao_formato: VERSAO_FORMATO, versao_app: FN.VERSAO || 'dev', gerado_em: U.agora(),
      origem: 'app', tipo: meta.tipo || 'backup', dispositivo: meta.dispositivo || '', sha256_dados: sha, dados,
    };
  }

  /** Texto canônico do estado, para comparar dois estados (teste do ciclo exportar → apagar → importar). */
  function assinatura(estado) {
    const d = {};
    for (const t of TABELAS) d[t] = (estado[t] || []).slice().sort((a, b) => (a.id < b.id ? -1 : a.id > b.id ? 1 : 0));
    const cfg = {};
    for (const k of Object.keys(estado.config || {}).sort()) if (!CONFIG_LOCAL.has(k)) cfg[k] = estado.config[k];
    d.config = cfg;
    return U.jsonCanonico(d);
  }

  return { FORMATO, FORMATO_CIFRADO, VERSAO_FORMATO, TABELAS, CONFIG_LOCAL, estadoVazio, erroFormato, conferirIntegridade,
    normalizar, validar, contar, mesclar, diferencas, exportar, assinatura, maisNovo };
})();

/* ==== cripto.js ==== */
/* cripto.js — conferência (SHA-256) e cifra dos backups/sincronização com a sua senha.
   Usa só a criptografia do próprio navegador (WebCrypto): PBKDF2-SHA-256 para derivar a chave
   da senha e AES-GCM de 256 bits para cifrar. Sem a senha, o arquivo é ilegível.
   O que isso protege: o arquivo copiado para fora do aparelho (Drive, e-mail, pen drive).
   O que não protege: um aparelho desbloqueado com o app aberto. */
var FN = (typeof globalThis !== 'undefined' ? globalThis : window).FN || {};
(typeof globalThis !== 'undefined' ? globalThis : window).FN = FN;

FN.cripto = (function () {
  'use strict';
  const ITERACOES = 600000;   // recomendação atual da OWASP para PBKDF2-HMAC-SHA256

  function sutil() { return (typeof crypto !== 'undefined' && crypto.subtle) ? crypto.subtle : null; }
  function disponivel() { return !!sutil(); }

  function paraBase64(bytes) {
    let s = '';
    for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(s);
  }
  function deBase64(texto) {
    const bin = atob(texto);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  async function sha256Hex(texto) {
    const h = await sutil().digest('SHA-256', new TextEncoder().encode(texto));
    return [...new Uint8Array(h)].map((b) => b.toString(16).padStart(2, '0')).join('');
  }

  async function derivarChave(senha, sal, iteracoes) {
    const base = await sutil().importKey('raw', new TextEncoder().encode(senha), 'PBKDF2', false, ['deriveKey']);
    return sutil().deriveKey({ name: 'PBKDF2', salt: sal, iterations: iteracoes, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  }

  /** Cifra um texto com a senha. Devolve o "envelope" (JSON) que vai para o arquivo. */
  async function cifrar(texto, senha, iteracoes) {
    if (!senha) throw new Error('Informe uma senha.');
    iteracoes = iteracoes || ITERACOES;
    const sal = crypto.getRandomValues(new Uint8Array(16));
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const chave = await derivarChave(senha, sal, iteracoes);
    const cifrado = await sutil().encrypt({ name: 'AES-GCM', iv }, chave, new TextEncoder().encode(texto));
    return {
      formato: 'app-financas-cifrado', versao_formato: 1, kdf: 'PBKDF2-SHA-256', iteracoes,
      sal: paraBase64(sal), iv: paraBase64(iv), cifra: 'AES-GCM-256', dados: paraBase64(new Uint8Array(cifrado)),
    };
  }

  /** Decifra o envelope. Senha errada ou arquivo alterado dão o mesmo erro (a cifra detecta os dois). */
  async function decifrar(envelope, senha) {
    if (!envelope || envelope.formato !== 'app-financas-cifrado') throw new Error('Arquivo cifrado em formato desconhecido.');
    const chave = await derivarChave(senha, deBase64(envelope.sal), envelope.iteracoes || ITERACOES);
    try {
      const claro = await sutil().decrypt({ name: 'AES-GCM', iv: deBase64(envelope.iv) }, chave, deBase64(envelope.dados));
      return new TextDecoder().decode(claro);
    } catch (e) {
      throw new Error('Senha errada ou arquivo corrompido.');
    }
  }

  /* ---- Para a sincronização: a chave é derivada uma vez e guardada no aparelho como chave
     "não extraível" (o código consegue usá-la, mas não consegue ler os bytes dela). O "sal" fica
     no arquivo do Drive, para o outro aparelho derivar a mesma chave com a mesma senha. ---- */

  function novoSal() { return paraBase64(crypto.getRandomValues(new Uint8Array(16))); }

  function chaveDaSenha(senha, salBase64, iteracoes) {
    if (!senha) throw new Error('Informe a senha.');
    return derivarChave(senha, deBase64(salBase64), iteracoes || ITERACOES);
  }

  /* Compressão (gzip) antes de cifrar: o arquivo da sincronização fica cerca de 10 vezes menor,
     o que importa no plano de dados do celular. Só é usada se o navegador tiver CompressionStream. */
  function podeComprimir() { return typeof CompressionStream !== 'undefined' && typeof Response !== 'undefined' && typeof Blob !== 'undefined'; }
  async function passarPor(bytes, transformacao) {
    const fluxo = new Blob([bytes]).stream().pipeThrough(transformacao);
    return new Uint8Array(await new Response(fluxo).arrayBuffer());
  }

  async function cifrarComChave(texto, chave, salBase64, iteracoes, opcoes) {
    const iv = crypto.getRandomValues(new Uint8Array(12));   // IV novo a cada gravação (obrigatório no AES-GCM)
    let bytes = new TextEncoder().encode(texto);
    const comprimir = !!(opcoes && opcoes.comprimir && podeComprimir());
    if (comprimir) bytes = await passarPor(bytes, new CompressionStream('gzip'));
    const cifrado = await sutil().encrypt({ name: 'AES-GCM', iv }, chave, bytes);
    const env = {
      formato: 'app-financas-cifrado', versao_formato: 1, kdf: 'PBKDF2-SHA-256', iteracoes: iteracoes || ITERACOES,
      sal: salBase64, iv: paraBase64(iv), cifra: 'AES-GCM-256', dados: paraBase64(new Uint8Array(cifrado)),
    };
    if (comprimir) env.compressao = 'gzip';
    return env;
  }

  async function decifrarComChave(envelope, chave) {
    if (!envelope || envelope.formato !== 'app-financas-cifrado') throw new Error('Arquivo cifrado em formato desconhecido.');
    let claro;
    try {
      claro = new Uint8Array(await sutil().decrypt({ name: 'AES-GCM', iv: deBase64(envelope.iv) }, chave, deBase64(envelope.dados)));
    } catch (e) {
      throw new Error('Senha errada ou arquivo corrompido.');
    }
    if (envelope.compressao === 'gzip') {
      if (typeof DecompressionStream === 'undefined') throw new Error('Este navegador não abre arquivos comprimidos. Atualize o navegador.');
      claro = await passarPor(claro, new DecompressionStream('gzip'));
    }
    return new TextDecoder().decode(claro);
  }

  return { ITERACOES, disponivel, paraBase64, deBase64, sha256Hex, cifrar, decifrar, novoSal, chaveDaSenha, cifrarComChave, decifrarComChave };
})();

/* ==== xlsx.js ==== */
/* xlsx.js — gera um arquivo Excel (.xlsx) sem biblioteca externa.
   Um .xlsx é um ZIP com arquivos XML; aqui montamos o ZIP no modo "sem compressão", que o Excel,
   o LibreOffice e o Numbers abrem normalmente. Suporta: várias abas, cabeçalho em negrito, primeira
   linha congelada, filtro, larguras e formatos de moeda (R$), porcentagem e número inteiro. */
var FN = (typeof globalThis !== 'undefined' ? globalThis : window).FN || {};
(typeof globalThis !== 'undefined' ? globalThis : window).FN = FN;

FN.xlsx = (function () {
  'use strict';

  /* ---------- CRC-32 (exigido pelo formato ZIP) ---------- */
  const TABELA_CRC = (function () {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
    return t;
  })();
  function crc32(bytes) {
    let c = 0xFFFFFFFF;
    for (let i = 0; i < bytes.length; i++) c = TABELA_CRC[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }

  /** Monta um ZIP sem compressão a partir de [{nome, bytes}]. */
  function zip(arquivos) {
    const enc = new TextEncoder();
    const partes = [];
    const central = [];
    let offset = 0;
    const agora = new Date();
    const hora = ((agora.getHours() << 11) | (agora.getMinutes() << 5) | Math.floor(agora.getSeconds() / 2)) & 0xFFFF;
    const data = (((agora.getFullYear() - 1980) << 9) | ((agora.getMonth() + 1) << 5) | agora.getDate()) & 0xFFFF;
    for (const a of arquivos) {
      const nome = enc.encode(a.nome);
      const dados = a.bytes;
      const crc = crc32(dados);
      const loc = new DataView(new ArrayBuffer(30));
      loc.setUint32(0, 0x04034b50, true); loc.setUint16(4, 20, true); loc.setUint16(6, 0x0800, true);
      loc.setUint16(8, 0, true); loc.setUint16(10, hora, true); loc.setUint16(12, data, true);
      loc.setUint32(14, crc, true); loc.setUint32(18, dados.length, true); loc.setUint32(22, dados.length, true);
      loc.setUint16(26, nome.length, true); loc.setUint16(28, 0, true);
      partes.push(new Uint8Array(loc.buffer), nome, dados);
      const cen = new DataView(new ArrayBuffer(46));
      cen.setUint32(0, 0x02014b50, true); cen.setUint16(4, 20, true); cen.setUint16(6, 20, true);
      cen.setUint16(8, 0x0800, true); cen.setUint16(10, 0, true); cen.setUint16(12, hora, true); cen.setUint16(14, data, true);
      cen.setUint32(16, crc, true); cen.setUint32(20, dados.length, true); cen.setUint32(24, dados.length, true);
      cen.setUint16(28, nome.length, true); cen.setUint16(30, 0, true); cen.setUint16(32, 0, true);
      cen.setUint16(34, 0, true); cen.setUint16(36, 0, true); cen.setUint32(38, 0, true); cen.setUint32(42, offset, true);
      central.push(new Uint8Array(cen.buffer), nome);
      offset += 30 + nome.length + dados.length;
    }
    const tamCentral = central.reduce((s, p) => s + p.length, 0);
    const fim = new DataView(new ArrayBuffer(22));
    fim.setUint32(0, 0x06054b50, true); fim.setUint16(4, 0, true); fim.setUint16(6, 0, true);
    fim.setUint16(8, arquivos.length, true); fim.setUint16(10, arquivos.length, true);
    fim.setUint32(12, tamCentral, true); fim.setUint32(16, offset, true); fim.setUint16(20, 0, true);
    const todas = partes.concat(central, [new Uint8Array(fim.buffer)]);
    const total = todas.reduce((s, p) => s + p.length, 0);
    const out = new Uint8Array(total);
    let pos = 0;
    for (const p of todas) { out.set(p, pos); pos += p.length; }
    return out;
  }

  /* ---------- XML ---------- */
  function xmlEsc(s) {
    return String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function colunaLetra(i) {   // 0 -> A, 25 -> Z, 26 -> AA
    let s = '';
    i += 1;
    while (i > 0) { const r = (i - 1) % 26; s = String.fromCharCode(65 + r) + s; i = Math.floor((i - 1) / 26); }
    return s;
  }
  const ESTILO = { texto: 0, cabecalho: 1, moeda: 2, pct: 3, inteiro: 4 };
