        return `<tr><th class="fixa" scope="row"><a href="#/historico/${esc(meses[meses.length - 1])}/${esc(c.id)}">${esc(R.nomeCategoria(e, c.id))}</a></th>${vs.map((v, i) => {
          const cor = G.corCalor(v, modo === 'linha' ? maxLinha : maxTabela);
          return `<td class="num"${cor ? ` data-bg="${cor.fundo}" data-cor="${cor.texto}"` : ''} title="${esc(R.nomeCategoria(e, c.id))}, ${esc(D.formatarMes(meses[i]))}: ${esc($.brl(v))}">${v ? esc($.brlCurto(v)) : '—'}</td>`;
        }).join('')}<td class="num"><b>${esc($.brlCurto(c.valor))}</b></td></tr>`;
      }).join('')}</tbody></table></div>
      <ul class="legenda legenda-calor" aria-label="Escala de cores"><li>menos</li>${G.RAMPA.map((c) => `<li><i data-bg="${c}"></i></li>`).join('')}<li>mais</li></ul></section>`;
    return html;
  }

  function render(params) {
    const e = App.estado;
    const aba = ABAS.some((a) => a.valor === params[0]) ? params[0] : 'evolucao';
    if (!App.temDados()) return UI.vazio('Sem lançamentos ainda.');
    const cab = `<div class="chips abas" role="tablist">${ABAS.map((a) => `<a class="chip${a.valor === aba ? ' ativo' : ''}" role="tab" aria-selected="${a.valor === aba}" href="#/relatorios/${a.valor}">${esc(a.texto)}</a>`).join('')}</div>`;
    const corpo = aba === 'anos' ? anos(e) : aba === 'ranking' ? ranking(e) : aba === 'calor' ? calor(e) : evolucao(e);
    return cab + corpo;
  }

  const escolha = (chave) => (el) => { App.ui[chave] = el.dataset.valor; App.renderizar(true); };
  App.registrarTela('relatorios', {
    titulo: 'Relatórios', render, redimensionar: true,
    acoes: {
      'rel-periodo': escolha('relPeriodo'), 'rank-periodo': (el) => { App.ui.rankTudo = false; escolha('rankPeriodo')(el); },
      'rank-modo': (el) => { App.ui.rankTudo = false; escolha('rankModo')(el); }, 'rank-tudo': () => { App.ui.rankTudo = true; App.renderizar(true); },
      'calor-periodo': escolha('calorPeriodo'), 'calor-modo': escolha('calorModo'),
    },
  }, { rotulo: 'Relatórios', icone: 'grafico', ordem: 9, dica: 'Evolução, anos, ranking e mapa de calor' });
})();

/* ==== tela-poupanca.js ==== */
/* tela-poupanca.js — poupança e reserva de emergência. O saldo parte do valor que você informar
   (o do extrato) e soma aportes e rendimentos, menos resgates, lançados depois dessa data.
   Registros históricos (ex.: restituições do IR vindas da planilha) aparecem, mas não mudam o saldo.
   Reserva = saldo ÷ média mensal das despesas essenciais dos últimos 12 meses (categorias
   marcadas como "essencial" em Ajustes › Categorias). */
(function () {
  'use strict';
  const $ = FN.dinheiro;
  const D = FN.datas;
  const R = FN.regras;
  const U = FN.util;
  const esc = U.esc;
  const TIPOS = { aporte: { nome: 'Aporte', sinal: '+' }, rendimento: { nome: 'Rendimento', sinal: '+' }, resgate: { nome: 'Resgate', sinal: '−' } };
  const BTN_CANCELAR = { valor: 'cancelar', texto: 'Cancelar', classe: 'btn-sec', semValidar: true };

  function render() {
    const e = App.estado;
    const mes = D.mesAtual();
    const res = R.reserva(e, mes);
    const p = res.poupanca;
    let html = '';
    if (!p.definido) {
      html += `<section class="cartao destaque"><h2>Informe o saldo atual da poupança</h2>
        <p>O saldo do app parte do valor do seu extrato. Depois, cada aporte, rendimento ou resgate lançado aqui atualiza o saldo.</p>
        <button type="button" class="btn btn-primario" data-acao="saldo-inicial">Informar saldo</button></section>`;
    } else {
      const essenciais = res.media_essenciais;
      const pctMeta = res.meses !== null ? Math.min(100, res.meses / res.meta * 100) : 0;
      html += `<section class="kpis" aria-label="Poupança">
        ${UI.kpi('Saldo da poupança', $.brl(p.saldo), `desde ${esc(D.formatarData(p.inicial.data))}: ${$.brl(p.inicial.valor_centavos)} do extrato`, 'kpi-heroi')}
        ${UI.kpi('Reserva de emergência', res.meses === null ? '—' : `${res.meses.toFixed(1).replace('.', ',')} meses`, `meta: ${res.meta} meses`)}
        ${UI.kpi('Despesas essenciais', essenciais ? $.brl(essenciais.media) : '—', essenciais ? `média de ${essenciais.meses} meses` : 'marque categorias como essenciais')}
      </section>
      <section class="cartao"><h2>Meta da reserva</h2>
        ${res.meses !== null ? `<p>${res.meses >= res.meta ? '✓ Meta atingida.' : `Faltam ${$.brl(Math.max(0, res.meta * essenciais.media - p.saldo))} para ${res.meta} meses de despesas essenciais.`}</p>
        ${UI.barra(pctMeta, res.meses >= res.meta ? 'b-ok' : '')}` : '<p class="suave">Para calcular, marque as categorias essenciais em Ajustes › Categorias.</p>'}
        <label class="campo campo-curto"><span>Meta (meses de despesas essenciais)</span><select data-mudar="meta">${UI.opcoes([3, 6, 9, 12].map((n) => ({ valor: n, texto: `${n} meses` })), res.meta)}</select></label>
        <p class="suave">A reserva de emergência cobre imprevistos (perda de renda, saúde, conserto). A regra comum é de 3 a 12 meses de despesas essenciais; isto não é recomendação de investimento.</p>
      </section>
      <section class="cartao"><div class="botoes">
        <button type="button" class="btn btn-primario" data-acao="movimento" data-tipo="aporte">+ Aporte</button>
        <button type="button" class="btn btn-sec" data-acao="movimento" data-tipo="rendimento">+ Rendimento</button>
        <button type="button" class="btn btn-sec" data-acao="movimento" data-tipo="resgate">− Resgate</button>
        <button type="button" class="btn btn-sec" data-acao="extrato">Conferir com o extrato</button></div></section>`;
    }
    const movs = p.movimentos.slice().reverse();
    const considerados = new Set(p.considerados.map((m) => m.id));
    html += `<section class="cartao cartao-lista"><h2 class="lista-mes">Movimentos</h2>${movs.length ? `<ul class="lista">${movs.map((m) => {
      const t = TIPOS[m.tipo] || { nome: m.tipo, sinal: '' };
      const conta = considerados.has(m.id);
      return `<li><button type="button" class="linha" data-acao="editar-movimento" data-id="${esc(m.id)}">
        <span class="linha-principal"><span class="linha-titulo">${esc(m.descricao || t.nome)}</span>
        <span class="linha-sub">${esc(t.nome)} · ${m.data ? esc(D.formatarData(m.data)) : esc(D.formatarMes(m.mes_ref))}${m.historico ? ' · registro histórico (não altera o saldo)' : !conta && p.definido ? ' · antes do saldo informado (não altera o saldo)' : ''}</span></span>
        <span class="linha-valor${m.tipo === 'resgate' ? '' : ' valor-receita'}">${t.sinal}${$.brl(m.valor_centavos)}</span></button></li>`;
    }).join('')}</ul>` : '<p class="vazio">Nenhum movimento.</p>'}</section>
    ${p.definido ? '<p><button type="button" class="btn-link" data-acao="saldo-inicial">Trocar o saldo de partida</button></p>' : ''}`;
    return html;
  }

  async function saldoInicial() {
    const e = App.estado;
    const atual = e.config.poupanca_saldo_inicial;
    const r = await App.dialogo({
      titulo: 'Saldo da poupança',
      html: `<p class="suave">Use o valor do extrato. O que você lançar depois desta data soma ou subtrai dele.</p>
        <label class="campo"><span>Saldo</span><input name="valor" inputmode="decimal" placeholder="0,00" autofocus value="${atual ? esc($.formatarNumero(atual.valor_centavos).replace(/\./g, '')) : ''}"></label>
        <label class="campo"><span>Data do saldo</span><input type="date" name="data" value="${esc(atual ? atual.data : D.hoje())}"></label>`,
      botoes: [BTN_CANCELAR, { valor: 'ok', texto: 'Salvar', classe: 'btn-primario' }],
      validar: (v) => {
        if (!D.validarData(v.data)) return 'Informe a data.';
        if (/^0+(,0+)?$/.test(v.valor.trim())) return null;
        const lv = $.lerValor(v.valor);
        return lv.ok ? null : 'Saldo: ' + lv.erro;
      },
    });
    if (r.botao !== 'ok') return;
    const valor = /^0+(,0+)?$/.test(r.valores.valor.trim()) ? 0 : $.lerValor(r.valores.valor).total;
    await App.salvarConfig('poupanca_saldo_inicial', { valor_centavos: valor, data: r.valores.data, registrado_em: U.agora() });
    App.toast('Saldo salvo.');
    App.renderizar(true);
  }

  async function movimento(el, antigo) {
    const tipo = antigo ? antigo.tipo : el.dataset.tipo;
    const t = TIPOS[tipo] || { nome: tipo };
    const r = await App.dialogo({
      titulo: antigo ? t.nome : `Novo ${t.nome.toLowerCase()}`,
      html: `<label class="campo"><span>Valor</span><input name="valor" inputmode="decimal" placeholder="0,00" autofocus value="${antigo ? esc($.formatarNumero(antigo.valor_centavos).replace(/\./g, '')) : ''}"></label>
        <label class="campo"><span>Data</span><input type="date" name="data" value="${esc(antigo && antigo.data ? antigo.data : D.hoje())}"></label>
        <label class="campo"><span>Descrição (opcional)</span><input name="descricao" maxlength="80" value="${esc(antigo && antigo.descricao ? antigo.descricao : '')}"></label>
        ${antigo && antigo.historico ? '<p class="dica">Registro histórico da planilha: aparece na lista, mas não muda o saldo.</p>' : ''}`,
      botoes: [BTN_CANCELAR].concat(antigo ? [{ valor: 'excluir', texto: 'Excluir', classe: 'btn-perigo', semValidar: true }] : [], [{ valor: 'ok', texto: 'Salvar', classe: 'btn-primario' }]),
      validar: (v) => (!$.lerValor(v.valor).ok ? 'Valor: ' + $.lerValor(v.valor).erro : !D.validarData(v.data) ? 'Informe a data.' : null),
    });
    if (r.botao === 'excluir') {
      await App.excluir('poupanca', [antigo], `Movimento da poupança excluído`);
      App.toast('Excluído.', { acao: 'Desfazer', fn: async () => { await App.desfazer(); App.renderizar(true); } });
      App.renderizar(true);
      return;
    }
    if (r.botao !== 'ok') return;
    const v = r.valores;
    const reg = Object.assign({}, antigo || { id: U.novoId('p'), tipo, historico: false, origem: 'app' },
      { valor_centavos: $.lerValor(v.valor).total, data: v.data, mes_ref: D.mesDe(v.data), descricao: v.descricao.trim() || null });
    await App.salvar([{ tabela: 'poupanca', registro: reg }], `${t.nome} de ${$.brl(reg.valor_centavos)} na poupança`);
    App.toast(`${t.nome} registrado.`, { acao: 'Desfazer', fn: async () => { await App.desfazer(); App.renderizar(true); } });
    App.renderizar(true);
  }

  /** Confere com o extrato: a diferença vira rendimento (se o extrato tem mais) ou ajuste (se tem menos). */
  async function extrato() {
    const p = R.poupanca(App.estado);
    const r = await App.dialogo({
      titulo: 'Conferir com o extrato',
      html: `<p>Saldo no app: <b>${$.brl(p.saldo)}</b>.</p>
        <label class="campo"><span>Saldo no extrato hoje</span><input name="valor" inputmode="decimal" placeholder="0,00" autofocus></label>`,
      botoes: [BTN_CANCELAR, { valor: 'ok', texto: 'Conferir', classe: 'btn-primario' }],
      validar: (v) => ($.lerValor(v.valor).ok ? null : 'Saldo: ' + $.lerValor(v.valor).erro),
    });
    if (r.botao !== 'ok') return;
    const dif = $.lerValor(r.valores.valor).total - p.saldo;
    if (dif === 0) { App.toast('Confere com o extrato. ✓'); return; }
    const tipo = dif > 0 ? 'rendimento' : 'resgate';
    const ok = await App.confirmar('Diferença encontrada', `O extrato tem ${$.brl(Math.abs(dif))} ${dif > 0 ? 'a mais' : 'a menos'} que o app. Registrar como ${dif > 0 ? 'rendimento' : 'resgate (ajuste)'} de hoje?`, 'Registrar');
    if (!ok) return;
    const hoje = D.hoje();
    await App.salvar([{ tabela: 'poupanca', registro: { id: U.novoId('p'), tipo, valor_centavos: Math.abs(dif), data: hoje, mes_ref: D.mesDe(hoje),
      descricao: 'Ajuste pelo extrato', historico: false, origem: 'app (conferência com o extrato)' } }], 'Ajuste da poupança pelo extrato');
    App.toast('Poupança conferida com o extrato.', { acao: 'Desfazer', fn: async () => { await App.desfazer(); App.renderizar(true); } });
    App.renderizar(true);
  }

  App.registrarTela('poupanca', {
    titulo: 'Poupança e reserva', render,
    acoes: {
      'saldo-inicial': saldoInicial, movimento: (el) => movimento(el, null), extrato,
      'editar-movimento': (el) => movimento(el, App.estado.poupanca.find((m) => m.id === el.dataset.id)),
    },
    mudancas: { meta: async (el) => { await App.salvarConfig('meta_reserva_meses', Number(el.value)); App.renderizar(true); } },
  }, { rotulo: 'Poupança', icone: 'poupanca', ordem: 10, dica: 'Saldo, aportes, rendimentos e reserva de emergência' });
})();

/* tela-dados.js — onde os dados ficam e como protegê-los: importar (base migrada ou backup),
   backup e restauração (com senha opcional), levar para o outro aparelho (sincronização manual),
   exportar para Excel/CSV, painel de qualidade da migração e apagar tudo. */
(function () {
  'use strict';
  const $ = FN.dinheiro;
  const D = FN.datas;
  const R = FN.regras;
  const U = FN.util;
  const esc = U.esc;

  function render() {
    const e = App.estado;
    const c = FN.dados.contar(e);

        <p class="suave">Tudo fica guardado só neste aparelho, no banco de dados do navegador. Nada é enviado para servidor nenhum.</p>
        <p><b>Proteção contra limpeza automática:</b> <span id="persistencia">verificando…</span></p>
        <p class="suave" id="espaco"></p>
        ${imp ? `<p class="suave">Última importação: ${esc(imp.arquivo || '')} em ${esc(D.formatarData(imp.data || ''))}.</p>` : ''}
      </section>
      <section class="cartao">
        <h2>Backup</h2>
        <p>Último backup neste aparelho: <b>${ult ? esc(D.formatarData(ult)) : 'nunca'}</b>. Guarde o arquivo fora do aparelho (Google Drive, e-mail, pen drive).</p>
        <label class="campo-check"><input type="checkbox" id="backup-senha"> Proteger o arquivo com senha</label>
        <div class="botoes">
          <button type="button" class="btn btn-primario" data-acao="backup">Fazer backup agora</button>
          <button type="button" class="btn btn-sec" data-acao="importar" data-modo="substituir">Restaurar um backup</button>
        </div>
      </section>
      <section class="cartao">
        <h2>Importar histórico</h2>
        <p>Use o arquivo <b>financas-migracao-v1.json</b> (sua planilha migrada) ou um backup do app.</p>
        <button type="button" class="btn btn-sec" data-acao="importar" data-modo="">Escolher arquivo…</button>
      </section>
      <section class="cartao">

        No outro aparelho: receba o pacote. O app junta os dois lados sem duplicar: vale a alteração mais recente de cada lançamento, e exclusões também passam.</p>
        <div class="botoes">
          <button type="button" class="btn btn-sec" data-acao="pacote">Gerar pacote</button>
          <button type="button" class="btn btn-sec" data-acao="importar" data-modo="juntar">Receber pacote</button>

        <ol class="qualidade">${qualidade.map((q) => `<li><b>${esc(q.titulo)}</b><br>${esc(q.tratamento)}<br><span class="suave">${esc(q.origem || '')}</span></li>`).join('')}</ol></details></section>` : ''}
      <section class="cartao">
        <h2>Quando o navegador pode apagar os dados</h2>
        <ul class="texto-lista">
          <li>Se você mandar limpar os dados do site (ou do navegador) — por isso o backup.</li>
          <li>Sem a proteção acima, o navegador pode apagar quando faltar espaço no aparelho.</li>
          <li>No Mac, o Safari apaga dados de sites abertos no navegador depois de 7 dias de uso sem visitar o site.
          Use o app pelo Dock (Safari › Arquivo › Adicionar ao Dock) ou instalado pelo Chrome.
          Atenção: o app do Dock tem dados separados do Safari; importe lá dentro.</li>
          <li>Trocar ou formatar o celular: restaure o último backup no aparelho novo.</li>
        </ul>
      </section>
      <section class="cartao zona-perigo">
        <h2>Apagar tudo deste aparelho</h2>
        <p>Remove todos os dados do app neste aparelho. Faça um backup antes.</p>
        <button type="button" class="btn btn-perigo" data-acao="apagar-tudo">Apagar todos os dados</button>
      </section>
      <p class="suave centro">Versão do app ${esc(FN.VERSAO || 'dev')} · estrutura do banco ${FN.db.VERSAO}</p>`;
  }

  async function depois(raiz) {
    const el = raiz.querySelector('#persistencia');
    const esp = raiz.querySelector('#espaco');
    try {
      const p = navigator.storage && navigator.storage.persisted ? await navigator.storage.persisted() : null;
      if (el) el.textContent = p ? 'ativa — o navegador não apaga estes dados para liberar espaço.'
        : 'ainda não — instale o app na tela inicial e use-o; o navegador costuma ativar sozinho.';
      if (navigator.storage && navigator.storage.estimate && esp) {
        const est = await navigator.storage.estimate();
        esp.textContent = `Espaço usado: ${(est.usage / 1048576).toFixed(1).replace('.', ',')} MB.`;
      }
    } catch (e) { if (el) el.textContent = 'não foi possível verificar.'; }
  }

  async function gerarArquivo(tipo, comSenha) {
    const b = await FN.dados.exportar(App.estado, { tipo, dispositivo: App.estado.config.dispositivo });
    let conteudo = JSON.stringify(b);
    let nome = App.nomeArquivo(tipo === 'sincronizacao' ? 'financas-pacote' : 'financas-backup', 'json');
    if (comSenha) {
      const s = await App.pedirSenha('Senha do arquivo', true, 'Guarde esta senha: sem ela o arquivo não abre (nem a Claude consegue abrir).');
      if (!s) return null;
      App.toast('Cifrando…');
      conteudo = JSON.stringify(await FN.cripto.cifrar(conteudo, s));
      nome = nome.replace('.json', '-com-senha.json');
    }
    App.baixar(nome, conteudo, 'application/json');
    return nome;
  }

  async function backup() {
    const comSenha = document.getElementById('backup-senha') && document.getElementById('backup-senha').checked;
    const nome = await gerarArquivo('backup', comSenha);
    if (!nome) return;
    await App.salvarConfig('ultimo_backup', D.hoje());
    App.toast(`Backup salvo: ${nome}`);
    App.renderizar(true);
  }

  async function pacote() {
    const r = await App.dialogo({ titulo: 'Pacote para o outro aparelho',
      html: '<p>O pacote leva todos os dados. Se for mandar por mensagem ou e-mail, proteja com senha.</p><label class="campo-check"><input type="checkbox" name="senha" checked> Proteger com senha</label>',
      botoes: [{ valor: 'cancelar', texto: 'Cancelar', classe: 'btn-sec' }, { valor: 'ok', texto: 'Gerar', classe: 'btn-primario' }] });
    if (r.botao !== 'ok') return;
    const nome = await gerarArquivo('sincronizacao', r.valores.senha);
    if (nome) App.toast(`Pacote gerado: ${nome}`);
  }

  function descricaoArquivo(obj) {
    if (obj.origem === 'migracao-planilha') return 'base migrada da planilha';
    if (obj.tipo === 'sincronizacao') return 'pacote de outro aparelho';
    return 'backup do app';
  }

  async function importar(el) {
    const modo = el.dataset.modo;
    const arq = await App.escolherArquivo('.json,application/json');
    if (!arq) return;
    let obj;
    try { obj = JSON.parse(arq.texto); } catch (e) { App.toast('Este arquivo não é um JSON válido.'); return; }
    if (obj && obj.formato === FN.dados.FORMATO_CIFRADO) {
      const s = await App.pedirSenha('Senha do arquivo', false);
      if (!s) return;
      try { obj = JSON.parse(await FN.cripto.decifrar(obj, s)); } catch (e) { App.toast(e.message); return; }
    }
    const norm = FN.dados.normalizar(obj);
    if (norm.erros.length) {
      await App.dialogo({ titulo: 'Arquivo recusado', html: `<p>Nada foi importado. Problemas encontrados:</p><ul>${norm.erros.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` });
      return;
    }
    const integ = await FN.dados.conferirIntegridade(obj);
    const c = norm.contagens;
    const tem = App.temDados();
    const html = `<p><b>${esc(arq.nome)}</b> — ${esc(descricaoArquivo(obj))}${obj.gerado_em ? `, gerado em ${esc(D.formatarData(obj.gerado_em.slice(0, 10)))}` : ''}.</p>
      <ul><li>${c.lancamentos} lançamentos${c.primeiro_mes ? ` (${esc(D.formatarMes(c.primeiro_mes))} a ${esc(D.formatarMes(c.ultimo_mes))})` : ''}</li>
      <li>${c.contracheque} linhas de contracheque · ${c.acerto_meses} meses de acerto · ${c.recorrentes} contas fixas · ${c.poupanca} registros de poupança</li></ul>
      <p>${integ.conferido ? (integ.ok ? '✓ Conferência do arquivo: íntegro (nada foi alterado desde que foi gerado).' : '<span class="texto-critico">✗ Conferência do arquivo: o conteúdo foi alterado depois de gerado. Só importe se você mesmo editou.</span>') : 'Conferência do arquivo: ' + esc(integ.motivo)}</p>
      ${norm.avisos.length ? `<details><summary>${norm.avisos.length} aviso(s)</summary><ul>${norm.avisos.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></details>` : ''}
      ${tem ? '<p><b>Juntar</b> mantém o que já está aqui e acrescenta o que é novo (vale a alteração mais recente). <b>Substituir</b> apaga o que está aqui e deixa só o arquivo.</p>' : ''}`;
    const botoes = [{ valor: 'cancelar', texto: 'Cancelar', classe: 'btn-sec' }];
    if (tem) botoes.push({ valor: 'substituir', texto: 'Substituir tudo', classe: modo === 'substituir' ? 'btn-perigo' : 'btn-sec' });
    botoes.push({ valor: tem ? 'juntar' : 'substituir', texto: tem ? 'Juntar' : 'Importar', classe: 'btn-primario' });
    const r = await App.dialogo({ titulo: 'Importar arquivo', html, botoes });
    if (!r.botao || r.botao === 'cancelar') return;
    if (r.botao === 'substituir') {
      if (tem && !(await App.confirmar('Substituir tudo', 'Os dados atuais deste aparelho serão trocados pelos do arquivo. Continuar?', 'Substituir', true))) return;
      await App.substituirEstado(norm.estado);
      App.toast(`Importado: ${c.lancamentos} lançamentos.`);
    } else {
      const st = await App.juntarEstado(norm.estado);
      App.toast(`Juntado: ${st.novos} novos, ${st.atualizados} atualizados, ${st.mantidos} iguais ou mais novos aqui.`);
    }
    await App.salvarConfig('importacao', { arquivo: arq.nome, data: D.hoje(), tipo: descricaoArquivo(obj) });
    await App.pedirPersistencia();
    App.ui.mes = D.mesAtual();
    App.navegar('#/inicio');
  }

  async function apagarTudo() {
    const r = await App.dialogo({ titulo: 'Apagar todos os dados',
      html: '<p>Isto remove tudo deste aparelho e não dá para desfazer. Digite <b>APAGAR</b> para confirmar.</p><label class="campo"><span>Confirmação</span><input name="conf" autocomplete="off" autofocus></label>',
      botoes: [{ valor: 'cancelar', texto: 'Cancelar', classe: 'btn-sec', semValidar: true }, { valor: 'ok', texto: 'Apagar tudo', classe: 'btn-perigo' }],
      validar: (v) => (v.conf.trim().toUpperCase() === 'APAGAR' ? null : 'Digite APAGAR para confirmar.') });
    if (r.botao !== 'ok') return;
    await FN.db.apagarTudo();
    await App.carregar();
    App.ui.form = null;
    App.toast('Todos os dados deste aparelho foram apagados.');
    App.navegar('#/inicio');
  }

  const acoes = {
    backup, pacote, importar, 'apagar-tudo': apagarTudo,
    excel: () => {
      const bytes = FN.espelho.excel(App.estado, D.hoje());
      App.baixar(App.nomeArquivo('financas-espelho', 'xlsx'), new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
      App.toast('Excel gerado.');
    },
    csv: () => {
      App.baixar(App.nomeArquivo('financas-lancamentos', 'csv'), FN.espelho.csvLancamentos(App.estado), 'text/csv;charset=utf-8');
      App.toast('CSV gerado.');
    },
  };

  App.registrarTela('dados', { titulo: 'Dados e backup', render, depois, acoes }, { rotulo: 'Dados e backup', icone: 'dados', ordem: 20 });
})();

/* ==== sync.js ==== */
/* sync.js — sincronização automática e cifrada pelo Google Drive (pasta oculta do app).

   Como funciona, em linguagem simples:
   1. Uma vez: você cria no Google Cloud um "ID do cliente OAuth" (passo a passo no manual) e cola
      no app. A permissão pedida é só "drive.appdata": o app enxerga apenas a pasta oculta dele no
      seu Drive; não vê seus outros arquivos, e os outros apps não veem esta pasta.
   2. "Conectar" leva você à página do Google e volta com uma chave de acesso que vale 1 hora.
      Nenhum código do Google roda dentro do app: é só ir e voltar da página de login.
   3. Os dados saem do aparelho comprimidos e cifrados com a sua senha de sincronização (AES-256).
      No Drive fica só um arquivo ilegível. A senha nunca sai do aparelho; o que fica guardado aqui
      é uma chave derivada dela, que o código consegue usar mas não consegue ler.
   4. Cada aparelho baixa o arquivo, junta com o que tem (vale a alteração mais recente de cada
      registro; exclusões também viajam) e, se tiver novidade, sobe o resultado.
   5. Quando a chave de acesso vence (1 hora), a sincronização pausa e o app pede um toque em
      "Reconectar" — sem senha, se você já estiver logado no Google neste navegador. */
(function () {
  'use strict';
  const U = FN.util;
  const API = 'https://www.googleapis.com';
  const AUTORIZACAO = 'https://accounts.google.com/o/oauth2/v2/auth';
  const ESCOPO = 'https://www.googleapis.com/auth/drive.appdata';
  const ARQUIVO = 'financas-sync.json';
  const ESPERA_ALTERACAO = 4000;        // sobe 4 s depois da última alteração
  const INTERVALO = 5 * 60 * 1000;      // e busca novidades a cada 5 min com o app aberto

  /* ---------------- Cliente do Google Drive (só as chamadas necessárias) ---------------- */
  function ErroDrive(mensagem, status) {
    const e = new Error(mensagem);
    e.status = status;
    return e;
  }

  async function pedir(token, metodo, url, corpo, tipo) {
    let resp;
    try {
      const cab = { Authorization: 'Bearer ' + token };
      if (tipo) cab['Content-Type'] = tipo;
      resp = await fetch(url, { method: metodo, headers: cab, body: corpo, cache: 'no-store', referrerPolicy: 'no-referrer' });
    } catch (e) {
      throw ErroDrive('Sem conexão com o Google Drive.', 0);
    }
    if (resp.status === 401) throw ErroDrive('A conexão com o Google venceu.', 401);
    if (!resp.ok) {
      let msg = `O Google Drive respondeu ${resp.status}.`;
      try { const j = await resp.json(); if (j.error && j.error.message) msg += ' ' + j.error.message; } catch (e) { /* sem detalhes */ }
      throw ErroDrive(msg, resp.status);
    }
    return resp;
  }

  const drive = {
    async procurar(token) {
      const q = encodeURIComponent(`name='${ARQUIVO}' and trashed=false`);
      const campos = encodeURIComponent('files(id,name,modifiedTime)');
      const r = await pedir(token, 'GET', `${API}/drive/v3/files?spaces=appDataFolder&q=${q}&fields=${campos}&orderBy=${encodeURIComponent('modifiedTime desc')}&pageSize=10`);
      const j = await r.json();
      return (j.files || [])[0] || null;
    },
    async baixar(token, id) {
      return (await pedir(token, 'GET', `${API}/drive/v3/files/${encodeURIComponent(id)}?alt=media`)).text();
    },
    async criar(token, texto) {
      const limite = 'fronteira' + U.novoId('b').replace(/[^a-z0-9]/gi, '');
      const meta = JSON.stringify({ name: ARQUIVO, parents: ['appDataFolder'], mimeType: 'application/json' });
      const corpo = `--${limite}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${meta}\r\n--${limite}\r\nContent-Type: application/json\r\n\r\n${texto}\r\n--${limite}--`;
      const r = await pedir(token, 'POST', `${API}/upload/drive/v3/files?uploadType=multipart&fields=${encodeURIComponent('id,modifiedTime')}`, corpo, `multipart/related; boundary=${limite}`);
      return r.json();
    },
    async atualizar(token, id, texto) {
      const r = await pedir(token, 'PATCH', `${API}/upload/drive/v3/files/${encodeURIComponent(id)}?uploadType=media&fields=${encodeURIComponent('id,modifiedTime')}`, texto, 'application/json');
      return r.json();
    },
    async apagar(token, id) {
      await pedir(token, 'DELETE', `${API}/drive/v3/files/${encodeURIComponent(id)}`);
    },
  };

  /* ---------------- Estado da sincronização ---------------- */
  const S = { estado: 'desligada', mensagem: '', emAndamento: null, pendente: false, recebidos: 0 };
  const TEXTOS = {
    desligada: 'Desligada', ok: 'Sincronizado', sincronizando: 'Sincronizando…', reconectar: 'Pausada: reconectar',
    senha: 'Falta a senha', erro: 'Com erro', offline: 'Sem internet',
  };

  function cfg() { return App.estado.config; }
  function ativa() { return !!cfg().sync_ativa; }

  function tokenValido() {
    const t = cfg().drive_token;
    return t && t.token && t.expira_em > Date.now() + 60000 ? t.token : null;
  }

  /** Endereço de volta do Google: o próprio app (tem de estar cadastrado igual no Google Cloud). */
  function enderecoDoApp() { return location.origin + location.pathname.replace(/index\.html$/, ''); }

  function definir(estado, mensagem) {
    S.estado = estado;
    S.mensagem = mensagem || '';
    indicador();
    if (App.rotaAtual === 'sincronizacao' && !document.getElementById('dialogo').open) App.renderizar(true);
  }

  /** Pequeno aviso no topo (toque leva à tela de sincronização). */
  function indicador() {
    const el = document.getElementById('sync-indicador');
    if (!el) return;
    if (!ativa()) { el.hidden = true; return; }
    const alerta = ['reconectar', 'senha', 'erro'].includes(S.estado);
    el.hidden = false;
    el.className = 'sync-indicador' + (alerta ? ' sync-alerta' : '') + (S.estado === 'sincronizando' ? ' sync-girando' : '');
    el.innerHTML = `${App.icone ? App.icone('nuvem') : ''}<span>${alerta ? '!' : S.estado === 'ok' ? '✓' : S.estado === 'sincronizando' ? '…' : '–'}</span>`;
    el.setAttribute('aria-label', 'Sincronização: ' + TEXTOS[S.estado]);
    el.title = 'Sincronização: ' + TEXTOS[S.estado];
  }

  /* ---------------- Conectar (ida e volta do Google) ---------------- */
  async function conectar() {
    const c = cfg();
    if (!c.google_client_id) { App.toast('Cole antes o ID do cliente do Google (tela Sincronização).'); App.navegar('#/sincronizacao'); return; }
    if (navigator.onLine === false) { App.toast('Sem internet agora. Conecte quando estiver on-line.'); return; }
    const state = U.novoId('estado');
    const voltar = /^#\/[a-z]/.test(location.hash) ? location.hash : '#/sincronizacao';
    await App.salvarConfig('sync_estado', { state, voltar, criado_em: Date.now() });
    const p = new URLSearchParams({ client_id: c.google_client_id, redirect_uri: enderecoDoApp(), response_type: 'token', scope: ESCOPO, include_granted_scopes: 'true', state });
    location.assign(`${AUTORIZACAO}?${p.toString()}`);
  }

  /** Roda antes da primeira tela: se a página voltou do Google, guarda a chave de acesso e limpa o endereço. */
  async function aoIniciar() {
    const h = location.hash || '';
    if (/(access_token|error)=/.test(h)) {
      const p = new URLSearchParams(h.slice(1));
      const esperado = cfg().sync_estado || {};
      history.replaceState(null, '', location.pathname + location.search + (esperado.voltar || '#/sincronizacao'));   // tira o token da barra de endereço
      await App.salvarConfig('sync_estado', null);
      if (!esperado.state || p.get('state') !== esperado.state) {
        S.estado = 'erro'; S.mensagem = 'Resposta do Google não reconhecida. Toque em Conectar de novo.';
      } else if (p.get('error')) {
        S.estado = ativa() ? 'reconectar' : 'desligada';
        S.mensagem = p.get('error') === 'access_denied' ? 'O acesso ao Drive não foi autorizado.' : 'O Google recusou a conexão (' + p.get('error') + ').';
      } else {
        const segundos = Number(p.get('expires_in')) || 3600;
        await App.salvarConfig('drive_token', { token: p.get('access_token'), expira_em: Date.now() + segundos * 1000 });
        await App.salvarConfig('sync_ativa', true);
        S.estado = 'ok';
        S.primeira = true;
      }
    } else if (ativa()) {
      S.estado = tokenValido() ? 'ok' : 'reconectar';
      if (!tokenValido()) S.mensagem = 'A conexão com o Google venceu. Toque em Reconectar.';
    }
    setTimeout(() => {
      indicador();
      if (ativa() && tokenValido()) sincronizar(S.primeira ? 'primeira' : 'abertura');
      S.primeira = false;
    }, 400);
  }

  /* ---------------- Senha e chave ---------------- */
  async function prepararChave(token) {
    const atual = cfg().sync_chave;
    if (atual && atual.chave) return atual;
    const arq = await drive.procurar(token);
    const env = arq ? JSON.parse(await drive.baixar(token, arq.id)) : null;
    const criar = !env;
    const senha = await App.pedirSenha(criar ? 'Crie a senha de sincronização' : 'Senha de sincronização', criar, criar
      ? 'Use a mesma senha no outro aparelho. Ela cifra os dados antes de irem para o Drive e nunca sai deste aparelho. Guarde-a: sem ela a cópia do Drive não abre (os dados dos aparelhos continuam).'
      : 'Digite a senha de sincronização criada no outro aparelho.');
    if (!senha) return null;
    App.toast('Preparando a chave (leva alguns segundos)…');
    const sal = env ? env.sal : FN.cripto.novoSal();
    const iteracoes = env ? env.iteracoes : FN.cripto.ITERACOES;
    const chave = await FN.cripto.chaveDaSenha(senha, sal, iteracoes);
    if (env) await FN.cripto.decifrarComChave(env, chave);   // senha errada → erro aqui, nada é gravado
    const reg = { sal, iteracoes, chave };
    await App.salvarConfig('sync_chave', reg);
    return reg;
  }

  /* ---------------- Sincronizar ---------------- */
  async function sincronizarAgora(interativo) {
    const c = cfg();
    const token = tokenValido();
    if (!token) { definir('reconectar', 'A conexão com o Google venceu. Toque em Reconectar.'); return; }
    if (navigator.onLine === false) { definir('offline', 'Sem internet: sincroniza quando a conexão voltar.'); return; }
    definir('sincronizando');
    try {
      // a senha só é pedida quando você toca num botão (ou logo depois de conectar), nunca de surpresa
      const chave = c.sync_chave && c.sync_chave.chave ? c.sync_chave : interativo ? await prepararChave(token) : null;
      if (!chave) { definir('senha', 'Informe a senha de sincronização.'); return; }
      const arq = await drive.procurar(token);
      let enviar = true;
      S.recebidos = 0;
      if (arq) {
        const env = JSON.parse(await drive.baixar(token, arq.id));
        if (env.sal !== chave.sal) {
          await App.salvarConfig('sync_chave', null);
          definir('senha', 'A cópia do Drive foi criada com outra senha. Informe a senha de sincronização.');
          return;
        }
        const remoto = FN.dados.normalizar(JSON.parse(await FN.cripto.decifrarComChave(env, chave.chave)));
        if (remoto.erros.length) throw new Error('Arquivo do Drive com problema: ' + remoto.erros[0]);
        const chegou = FN.dados.diferencas(App.estado, remoto.estado);
        if (chegou.total) {
          await App.aplicarRemoto(chegou);
          S.recebidos = chegou.total;
          if (App.rotaAtual !== 'lancar' && !document.getElementById('dialogo').open) App.renderizar(true);
        }
        enviar = FN.dados.diferencas(remoto.estado, App.estado).total > 0;
      }
      if (enviar) {
        const backup = await FN.dados.exportar(App.estado, { tipo: 'sincronizacao', dispositivo: c.dispositivo });
        const env = await FN.cripto.cifrarComChave(JSON.stringify(backup), chave.chave, chave.sal, chave.iteracoes, { comprimir: true });
        const texto = JSON.stringify(env);
        const r = arq ? await drive.atualizar(token, arq.id, texto) : await drive.criar(token, texto);
        if (r && r.id && r.id !== c.drive_arquivo_id) await App.salvarConfig('drive_arquivo_id', r.id);
      }
      await App.salvarConfig('ultima_sincronizacao', U.agora());
      definir('ok', S.recebidos ? `${S.recebidos} alteração(ões) recebida(s).` : '');
    } catch (e) {
      if (e.status === 401) { await App.salvarConfig('drive_token', null); definir('reconectar', 'A conexão com o Google venceu. Toque em Reconectar.'); }
      else if (e.status === 0) definir('offline', 'Sem internet: sincroniza quando a conexão voltar.');
      else if (/Senha errada/.test(e.message)) { await App.salvarConfig('sync_chave', null); definir('senha', 'Essa senha não abre a cópia do Drive. Tente de novo.'); }
      else { console.error(e); definir('erro', e.message); }
    }
  }

  /** Uma sincronização por vez (também entre abas, quando o navegador permite). */
  async function sincronizar(motivo) {
    if (!ativa()) { S.estado = 'desligada'; indicador(); return; }
    if (S.emAndamento) { S.pendente = true; return S.emAndamento; }
    const interativo = motivo === 'manual' || motivo === 'primeira';
    const trabalho = navigator.locks && navigator.locks.request
      ? navigator.locks.request('financas-sincronizacao', () => sincronizarAgora(interativo))
      : sincronizarAgora(interativo);
    S.emAndamento = trabalho;
    try { await trabalho; } finally { S.emAndamento = null; }
    if (S.pendente) { S.pendente = false; agendar(1000); }
  }

  let timer = null;
  function agendar(ms) {
    clearTimeout(timer);
    timer = setTimeout(() => sincronizar('agendada'), ms);
  }

  async function desligar() {
    await App.salvarConfig('sync_ativa', false);
    await App.salvarConfig('drive_token', null);
    await App.salvarConfig('sync_chave', null);
    await App.salvarConfig('drive_arquivo_id', null);
    clearTimeout(timer);
    definir('desligada');
  }

  async function apagarCopia() {
    const token = tokenValido();
    if (!token) { App.toast('Reconecte ao Google antes de apagar a cópia.'); return false; }
    const arq = await drive.procurar(token);
    if (arq) await drive.apagar(token, arq.id);
    await App.salvarConfig('drive_arquivo_id', null);
    await App.salvarConfig('sync_chave', null);
    return !!arq;
  }

  /* ---------------- Ganchos no resto do app ---------------- */
  App.iniciais.push(aoIniciar);
  App.ouvintes.push(() => { if (ativa()) agendar(ESPERA_ALTERACAO); });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible' || !ativa()) return;
    const ult = cfg().ultima_sincronizacao;
    if (!ult || Date.now() - Date.parse(ult) > 60000) sincronizar('volta');
    else indicador();
  });
  window.addEventListener('online', () => { if (ativa()) sincronizar('conexao'); });
  setInterval(() => { if (document.visibilityState === 'visible' && ativa() && tokenValido()) sincronizar('periodica'); }, INTERVALO);
  App.alertasExtras.push(() => {
    if (!ativa()) return null;
    if (S.estado === 'reconectar') return { nivel: 'info', texto: 'Sincronização pausada: a conexão com o Google venceu. Toque para reconectar.', rota: '#/sincronizacao' };
    if (S.estado === 'senha') return { nivel: 'atencao', texto: 'Sincronização parada: falta a senha de sincronização.', rota: '#/sincronizacao' };
    if (S.estado === 'erro') return { nivel: 'atencao', texto: 'Erro na sincronização: ' + S.mensagem, rota: '#/sincronizacao' };
    return null;
  });

  App.sync = { S, TEXTOS, drive, conectar, sincronizar, desligar, apagarCopia, tokenValido, enderecoDoApp, ativa, ARQUIVO, ESCOPO };
})();

/* ==== tela-sincronizacao.js ==== */
/* tela-sincronizacao.js — liga, acompanha e desliga a sincronização automática pelo Google Drive.
   A configuração (uma vez por aparelho) é colar o "ID do cliente" criado no Google Cloud; o passo
   a passo está no manual. A sincronização manual por arquivo continua em Dados e backup. */
(function () {
  'use strict';
  const D = FN.datas;
  const esc = FN.util.esc;

  /** Data e hora locais de um carimbo ISO (ex.: "30/09/2026 às 14:32"). */
  function quando(iso) {
    if (!iso) return 'nunca';
    const d = new Date(iso);
    if (Number.isNaN(d.getTime())) return '—';
    return `${D.pad(d.getDate())}/${D.pad(d.getMonth() + 1)}/${d.getFullYear()} às ${D.pad(d.getHours())}:${D.pad(d.getMinutes())}`;
  }

  function render() {
    const e = App.estado;
    const sy = App.sync;
    const c = e.config;
    const S = sy.S;
    const estado = sy.ativa() ? S.estado : 'desligada';
    const alerta = ['reconectar', 'senha', 'erro'].includes(estado);
    const botoes = [];
    if (estado === 'desligada') botoes.push(`<button type="button" class="btn btn-primario" data-acao="conectar"${c.google_client_id ? '' : ' disabled'}>Conectar ao Google Drive</button>`);
    if (estado === 'reconectar') botoes.push('<button type="button" class="btn btn-primario" data-acao="conectar">Reconectar</button>');
    if (estado === 'senha') botoes.push('<button type="button" class="btn btn-primario" data-acao="sincronizar">Informar a senha</button>');
    if (['ok', 'erro', 'offline'].includes(estado)) botoes.push('<button type="button" class="btn btn-primario" data-acao="sincronizar">Sincronizar agora</button>');
    if (estado !== 'desligada') botoes.push('<button type="button" class="btn btn-sec" data-acao="desligar">Desligar</button>');
    const endereco = sy.enderecoDoApp();
    return `<section class="cartao${alerta ? ' cartao-alerta' : ''}">
        <h2>Sincronização automática</h2>
        <p class="sync-status"><span class="st ${estado === 'ok' ? 'st-pago' : alerta ? 'st-vencida' : 'st-pendente'}">${esc(sy.TEXTOS[estado])}</span>
          ${S.mensagem && estado !== 'desligada' ? `<span class="suave">${esc(S.mensagem)}</span>` : ''}</p>
        ${sy.ativa() ? `<p>Última sincronização deste aparelho: <b>${esc(quando(c.ultima_sincronizacao))}</b>.</p>` : ''}
        <div class="botoes">${botoes.join('')}</div>
        ${estado === 'desligada' && !c.google_client_id ? '<p class="dica">Para ligar, cole antes o ID do cliente do Google (abaixo).</p>' : ''}
      </section>
      <section class="cartao"><h2>Como funciona</h2>
        <ul class="texto-lista">
          <li>Os dados vão <b>cifrados com a sua senha de sincronização</b> para uma pasta oculta do seu Google Drive, que só este app enxerga. No Drive fica um arquivo ilegível.</li>
          <li>Com o app aberto, cada alteração sobe em poucos segundos, e as novidades do outro aparelho chegam ao abrir o app e a cada 5 minutos.</li>
          <li>A conexão com o Google vale <b>1 hora</b>. Depois, a sincronização pausa e o início mostra "Toque para reconectar" (sem senha, se você estiver logado no Google neste navegador).</li>
          <li>Use a <b>mesma senha</b> nos dois aparelhos. Se esquecer: desligue, apague a cópia do Drive e conecte de novo com uma senha nova — os dados dos aparelhos continuam.</li>
          <li>No Mac, use o app instalado pelo <b>Chrome</b>. No app do Dock do Safari, a volta do Google abre no Safari e a conexão não chega ao app (lá, use a sincronização manual).</li>
        </ul>
      </section>
      <section class="cartao"><h2>Configuração (uma vez por aparelho)</h2>
        <label class="campo"><span>ID do cliente do Google (termina em .apps.googleusercontent.com)</span>
          <input data-mudar="client-id" value="${esc(c.google_client_id || '')}" autocomplete="off" spellcheck="false" placeholder="000000000000-xxxx.apps.googleusercontent.com"></label>
        <p>O que cadastrar no Google Cloud, na credencial:</p>
        <dl class="definicoes definicoes-empilhadas">
          <dt>Origens JavaScript autorizadas</dt><dd><code>${esc(location.origin)}</code></dd>
          <dt>URIs de redirecionamento autorizados</dt><dd><code>${esc(endereco)}</code> <button type="button" class="btn btn-mini btn-sec" data-acao="copiar-endereco">Copiar</button></dd>
        </dl>
        <p class="suave">O passo a passo completo está no guia "Instalação passo a passo", parte 3.</p>
      </section>
      ${sy.ativa() ? `<section class="cartao zona-perigo"><h2>Apagar a cópia do Drive</h2>
        <p>Remove o arquivo cifrado da pasta oculta do app no seu Drive. Os dados dos aparelhos não mudam.</p>
        <button type="button" class="btn btn-perigo" data-acao="apagar-copia">Apagar a cópia do Drive</button></section>` : ''}
      <p class="suave">Prefere sem nuvem? Em <a href="#/dados">Dados e backup</a> há a sincronização manual por arquivo.</p>`;
  }

  const acoes = {
    conectar: () => App.sync.conectar(),
    sincronizar: async () => { await App.sync.sincronizar('manual'); if (App.sync.S.estado === 'ok') App.toast('Sincronizado.'); },
    desligar: async () => {
      if (!(await App.confirmar('Desligar sincronização', 'Este aparelho para de sincronizar. A cópia no Drive continua lá (dá para apagar antes, aqui mesmo).', 'Desligar'))) return;
      await App.sync.desligar();
      App.toast('Sincronização desligada neste aparelho.');
      App.renderizar(true);
    },
    'apagar-copia': async () => {
      if (!(await App.confirmar('Apagar a cópia do Drive', 'O arquivo cifrado sai do seu Drive. Os dados deste e do outro aparelho continuam. Para voltar a sincronizar, conecte de novo e crie uma senha.', 'Apagar', true))) return;
      try {
        const havia = await App.sync.apagarCopia();
        App.toast(havia ? 'Cópia do Drive apagada.' : 'Não havia cópia no Drive.');
      } catch (e) { App.toast(e.message); }
      App.renderizar(true);
    },
    'copiar-endereco': async () => {
      try { await navigator.clipboard.writeText(App.sync.enderecoDoApp()); App.toast('Endereço copiado.'); } catch (e) { App.toast('Não deu para copiar; selecione o texto e copie.'); }
    },
  };

  const mudancas = {
    'client-id': async (el) => {
      const v = el.value.trim();
      if (v && !/^[\w.-]+\.apps\.googleusercontent\.com$/.test(v)) return;   // espera o ID completo
      if (v === (App.estado.config.google_client_id || '')) return;
      await App.salvarConfig('google_client_id', v || null);
      App.toast(v ? 'ID do cliente salvo.' : 'ID do cliente apagado.');
      App.renderizar(true);
    },
  };

  App.registrarTela('sincronizacao', { titulo: 'Sincronização', render, acoes, mudancas },
    { rotulo: 'Sincronização', icone: 'nuvem', ordem: 21, dica: 'Automática e cifrada pelo seu Google Drive' });
})();

/* ==== tela-ajustes.js ==== */
/* tela-ajustes.js — cadastros e preferências: contas fixas (vencimento, valor, meses, forma de
   pagamento), categorias e grupos, contas e cartões (dias de fechamento e vencimento), regra do
   acerto com outra pessoa e lembrete de backup. Rotas: #/ajustes e #/ajustes/<seção>. */
(function () {
  'use strict';
  const $ = FN.dinheiro;
  const D = FN.datas;
  const R = FN.regras;
  const U = FN.util;
  const esc = U.esc;

  const SECOES = [
    { id: 'recorrentes', titulo: 'Contas fixas', texto: 'Dia de vencimento, valor esperado, meses e forma de pagamento de cada conta.' },
    { id: 'categorias', titulo: 'Categorias e grupos', texto: 'Nomes, grupos, categorias ativas e essenciais (usadas na reserva de emergência).' },
    { id: 'contas', titulo: 'Contas e cartões', texto: 'Dias de fechamento e vencimento dos cartões e a forma de pagamento padrão.' },
    { id: 'acerto', titulo: 'Acerto com outra pessoa', texto: 'Valor-base mensal, exceções e categoria do repasse.' },
    { id: 'geral', titulo: 'Preferências', texto: 'Lembrete de backup.' },
  ];
  const TIPOS_CONTA = [
    { valor: 'conta_corrente', texto: 'Conta corrente' }, { valor: 'cartao_credito', texto: 'Cartão de crédito' },
    { valor: 'poupanca', texto: 'Poupança' }, { valor: 'dinheiro', texto: 'Dinheiro' }, { valor: 'outra', texto: 'Outra' },
  ];
  const DIAS = Array.from({ length: 31 }, (_, i) => ({ valor: i + 1, texto: i === 30 ? '31 (ou último dia)' : String(i + 1) }));
  const BTN_CANCELAR = { valor: 'cancelar', texto: 'Cancelar', classe: 'btn-sec', semValidar: true };

  /** Identificador legível a partir do nome ("Plano de saúde" → "plano-de-saude"), sem repetir. */
  function novoIdLegivel(nome, lista, prefixo) {
    const base = (prefixo || '') + (U.normalizar(nome).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'item');
    let id = base;
    let i = 2;
    while (lista.some((x) => x.id === id)) id = base + '-' + i++;
    return id;
  }

  function contarUso(e, campo, id) {
    return R.ativos(e.lancamentos).filter((x) => x[campo] === id).length;
  }

  /* ---------------- Índice ---------------- */

  function indice() {
    return `<section class="cartao cartao-lista"><ul class="lista">${SECOES.map((s) => `<li><a class="linha" href="#/ajustes/${s.id}">
      <span class="linha-principal"><span class="linha-titulo">${esc(s.titulo)}</span><span class="linha-sub">${esc(s.texto)}</span></span>
      <span class="linha-valor" aria-hidden="true">›</span></a></li>`).join('')}</ul></section>`;
  }

  /* ---------------- Contas fixas ---------------- */

  function textoMeses(r) {
    if (Array.isArray(r.meses) && r.meses.length) return r.meses.slice().sort((a, b) => a - b).map((m) => D.ABREV[m - 1]).join(', ');
    return r.frequencia === 'anual' ? 'anual (mês não definido)' : 'todo mês';
  }

  function secaoRecorrentes(e) {
    const lista = R.ativos(e.recorrentes).slice().sort((a, b) => (a.ativa === false) - (b.ativa === false)
      || String(a.descricao).localeCompare(String(b.descricao), 'pt-BR'));
    const semDia = lista.filter((r) => r.ativa !== false && !r.dia_vencimento).length;
    return `<section class="cartao">
        <p>Contas que se repetem. O app avisa quando vencem e quando ainda não foram lançadas no mês.</p>
        ${semDia ? `<p class="dica">${semDia} conta(s) sem dia de vencimento: sem ele o app não consegue avisar antes de vencer.</p>` : ''}
        <button type="button" class="btn btn-primario" data-acao="editar-recorrente" data-id="">+ Nova conta fixa</button>
      </section>
      ${lista.length ? `<section class="cartao cartao-lista"><ul class="lista">${lista.map((r) => `<li><button type="button" class="linha${r.ativa === false ? ' inativa' : ''}" data-acao="editar-recorrente" data-id="${esc(r.id)}">
        <span class="linha-principal"><span class="linha-titulo">${esc(r.descricao)}${r.ativa === false ? ' <span class="suave">(desativada)</span>' : ''}</span>
        <span class="linha-sub">${r.dia_vencimento ? 'vence dia ' + esc(r.dia_vencimento) : 'sem dia de vencimento'} · ${esc(textoMeses(r))} · ${esc(R.nomeConta(e, r.conta_id))}</span></span>
        <span class="linha-valor">${r.valor_esperado_centavos ? $.brl(r.valor_esperado_centavos) + (r.valor_estimado ? '<br><span class="suave">aprox.</span>' : '') : '<span class="suave">variável</span>'}</span>
      </button></li>`).join('')}</ul></section>` : UI.vazio('Nenhuma conta fixa cadastrada.')}`;
  }

  async function editarRecorrente(el) {
    const e = App.estado;
    const antigo = el.dataset.id ? e.recorrentes.find((r) => r.id === el.dataset.id) : null;
    const r0 = antigo || { descricao: '', categoria_id: '', valor_esperado_centavos: null, valor_estimado: false, dia_vencimento: null,
      conta_id: null, meses: null, inicio: D.mesAtual(), fim: null, ativa: true };
    const contas = R.ativos(e.contas).filter((c) => c.tipo !== 'poupanca');
    const meses = new Set(Array.isArray(r0.meses) ? r0.meses : []);
    const html = `<label class="campo"><span>Nome</span><input name="descricao" maxlength="60" value="${esc(r0.descricao)}" autofocus></label>
      <label class="campo"><span>Categoria</span><select name="categoria"><option value="">Escolha…</option>${UI.opcoesCategorias(e, 'despesa', r0.categoria_id)}</select></label>
      <label class="campo"><span>Valor esperado (em branco = valor variável)</span><input name="valor" inputmode="decimal" placeholder="0,00"
        value="${r0.valor_esperado_centavos ? esc($.formatarNumero(r0.valor_esperado_centavos).replace(/\./g, '')) : ''}"></label>
      <label class="campo-check"><input type="checkbox" name="estimado"${r0.valor_estimado ? ' checked' : ''}> O valor é aproximado</label>
      <label class="campo"><span>Dia de vencimento</span><select name="dia">${UI.opcoes(DIAS, r0.dia_vencimento || '', 'Sem dia definido')}</select></label>
      <label class="campo"><span>Forma de pagamento</span><select name="conta">${UI.opcoes(contas.map((c) => ({ valor: c.id, texto: c.nome })), r0.conta_id || '', 'Não informado')}</select></label>
      <fieldset class="grupo-campo"><legend>Em quais meses (nenhum marcado = todo mês)</legend>
        <div class="meses-check">${D.ABREV.map((m, i) => `<label class="campo-check"><input type="checkbox" name="m${i + 1}"${meses.has(i + 1) ? ' checked' : ''}> ${m}</label>`).join('')}</div>
      </fieldset>
      <div class="linha-campos">
        <label class="campo"><span>A partir de</span><input type="month" name="inicio" value="${esc(r0.inicio || '')}"></label>
        <label class="campo"><span>Até (opcional)</span><input type="month" name="fim" value="${esc(r0.fim || '')}"></label>
      </div>
      <label class="campo-check"><input type="checkbox" name="ativa"${r0.ativa !== false ? ' checked' : ''}> Ativa</label>`;
    const botoes = [BTN_CANCELAR];
    if (antigo) botoes.push({ valor: 'excluir', texto: 'Excluir', classe: 'btn-perigo', semValidar: true });
    botoes.push({ valor: 'ok', texto: 'Salvar', classe: 'btn-primario' });
    const r = await App.dialogo({
      titulo: antigo ? 'Conta fixa' : 'Nova conta fixa', html, botoes,
      validar: (v) => {
        if (!v.descricao.trim()) return 'Dê um nome à conta.';
        if (!v.categoria) return 'Escolha a categoria.';
        if (v.valor.trim() && !$.lerValor(v.valor).ok) return 'Valor: ' + $.lerValor(v.valor).erro;
        if (v.inicio && !D.validarMes(v.inicio)) return 'Mês inicial inválido.';
        if (v.fim && (!D.validarMes(v.fim) || (v.inicio && v.fim < v.inicio))) return 'O mês final precisa ser depois do inicial.';
        return null;
      },
    });
    if (r.botao === 'excluir') {
      if (!(await App.confirmar('Excluir conta fixa', `Excluir "${antigo.descricao}"? Os lançamentos já feitos continuam no histórico.`, 'Excluir', true))) return;
      await App.excluir('recorrentes', [antigo], `Exclusão da conta fixa ${antigo.descricao}`);
      App.toast('Conta fixa excluída.', { acao: 'Desfazer', fn: async () => { await App.desfazer(); App.renderizar(true); } });
      App.renderizar(true);
      return;
    }
    if (r.botao !== 'ok') return;
    const v = r.valores;
    const lista = [];
    for (let i = 1; i <= 12; i++) if (v['m' + i]) lista.push(i);
    const valor = v.valor.trim() ? $.lerValor(v.valor).total : null;
    const reg = Object.assign({}, antigo || { id: U.novoId('r'), origem: 'app' }, {
      descricao: v.descricao.trim(), categoria_id: v.categoria, valor_esperado_centavos: valor, valor_variavel: !valor,
      valor_estimado: !!(valor && v.estimado), dia_vencimento: v.dia ? Number(v.dia) : null, conta_id: v.conta || null,
      meses: lista.length ? lista : null, frequencia: lista.length === 0 ? 'mensal' : lista.length === 1 ? 'anual' : 'meses',
      inicio: v.inicio || null, fim: v.fim || null, ativa: !!v.ativa,
    });
    await App.salvar([{ tabela: 'recorrentes', registro: reg }], `${antigo ? 'Edição' : 'Cadastro'} da conta fixa ${reg.descricao}`);
    App.toast('Conta fixa salva.');
    App.renderizar(true);
  }

  /* ---------------- Categorias e grupos ---------------- */

  function secaoCategorias(e) {
    const grupos = R.ativos(e.grupos).slice().sort((a, b) => (a.ordem || 0) - (b.ordem || 0));
    const cats = R.ativos(e.categorias);
    const uso = new Map();
    for (const x of R.ativos(e.lancamentos)) uso.set(x.categoria_id, (uso.get(x.categoria_id) || 0) + 1);
    const bloco = (g, lista) => `<section class="cartao cartao-lista"><h2 class="lista-mes">${esc(g ? g.nome : 'Sem grupo')}
        ${g ? `<button type="button" class="btn-link" data-acao="editar-grupo" data-id="${esc(g.id)}">renomear</button>` : ''}</h2>
      <ul class="lista">${lista.map((c) => `<li><button type="button" class="linha${c.ativa === false ? ' inativa' : ''}" data-acao="editar-categoria" data-id="${esc(c.id)}">
        <span class="linha-principal"><span class="linha-titulo">${esc(c.nome)}${c.ativa === false ? ' <span class="suave">(inativa)</span>' : ''}</span>
        <span class="linha-sub">${esc(R.TIPO_NOME[c.tipo] || c.tipo)}${(c.etiquetas || []).includes('essencial') ? ' · essencial' : ''} · ${uso.get(c.id) || 0} lançamento(s)</span></span>
        <span class="linha-valor" aria-hidden="true">›</span></button></li>`).join('')}</ul></section>`;
    let html = `<section class="cartao"><p>Categorias inativas somem da tela de lançar, mas o histórico delas continua.
      As marcadas como <b>essencial</b> entram no cálculo da reserva de emergência.</p>
      <div class="botoes"><button type="button" class="btn btn-primario" data-acao="editar-categoria" data-id="">+ Nova categoria</button>
      <button type="button" class="btn btn-sec" data-acao="editar-grupo" data-id="">+ Novo grupo</button></div></section>`;
    for (const g of grupos) {
      const lista = cats.filter((c) => c.grupo_id === g.id).sort((a, b) => (a.ativa === false) - (b.ativa === false) || (a.ordem || 0) - (b.ordem || 0));
      if (lista.length) html += bloco(g, lista);
    }
    const soltas = cats.filter((c) => !grupos.some((g) => g.id === c.grupo_id));
    if (soltas.length) html += bloco(null, soltas);
    return html;
  }

  async function editarCategoria(el) {
    const e = App.estado;
    const antiga = el.dataset.id ? e.categorias.find((c) => c.id === el.dataset.id) : null;
    const c0 = antiga || { nome: '', grupo_id: '', tipo: 'despesa', ativa: true, etiquetas: [] };
    const grupos = R.ativos(e.grupos).slice().sort((a, b) => (a.ordem || 0) - (b.ordem || 0));
    const usos = antiga ? contarUso(e, 'categoria_id', antiga.id) : 0;
    const html = `<label class="campo"><span>Nome</span><input name="nome" maxlength="50" value="${esc(c0.nome)}" autofocus></label>
      <label class="campo"><span>Grupo</span><select name="grupo">${UI.opcoes(grupos.map((g) => ({ valor: g.id, texto: g.nome })), c0.grupo_id, 'Escolha…')}</select></label>
      ${antiga ? `<p class="suave">Tipo: ${esc(R.TIPO_NOME[c0.tipo] || c0.tipo)} · ${usos} lançamento(s).</p>`
        : `<label class="campo"><span>Tipo</span><select name="tipo">${UI.opcoes([{ valor: 'despesa', texto: 'Despesa' }, { valor: 'receita', texto: 'Receita' }, { valor: 'pagamento_divida', texto: 'Pagamento de dívida' }], 'despesa')}</select></label>`}
      <label class="campo-check"><input type="checkbox" name="essencial"${(c0.etiquetas || []).includes('essencial') ? ' checked' : ''}> Essencial (conta para a reserva de emergência)</label>
      <label class="campo-check"><input type="checkbox" name="ativa"${c0.ativa !== false ? ' checked' : ''}> Ativa (aparece na tela de lançar)</label>`;
    const botoes = [BTN_CANCELAR];
    if (antiga && !usos) botoes.push({ valor: 'excluir', texto: 'Excluir', classe: 'btn-perigo', semValidar: true });
    botoes.push({ valor: 'ok', texto: 'Salvar', classe: 'btn-primario' });
    const r = await App.dialogo({
      titulo: antiga ? 'Categoria' : 'Nova categoria', html, botoes,
      validar: (v) => (!v.nome.trim() ? 'Dê um nome à categoria.' : !v.grupo ? 'Escolha o grupo.' : null),
    });
    if (r.botao === 'excluir') {
      await App.excluir('categorias', [antiga], `Exclusão da categoria ${antiga.nome}`);
      App.renderizar(true);
      return;
    }
    if (r.botao !== 'ok') return;
    const v = r.valores;
    const etiquetas = (c0.etiquetas || []).filter((t) => t !== 'essencial');
    if (v.essencial) etiquetas.push('essencial');
    const reg = Object.assign({}, antiga || {
      id: novoIdLegivel(v.nome, e.categorias), tipo: v.tipo || 'despesa',
      ordem: Math.max(0, ...e.categorias.map((c) => c.ordem || 0)) + 1, origem: 'app',
    }, { nome: v.nome.trim(), grupo_id: v.grupo, ativa: !!v.ativa, etiquetas });
    await App.salvar([{ tabela: 'categorias', registro: reg }], `${antiga ? 'Edição' : 'Criação'} da categoria ${reg.nome}`);
    App.renderizar(true);
  }

  async function editarGrupo(el) {
    const e = App.estado;
    const antigo = el.dataset.id ? e.grupos.find((g) => g.id === el.dataset.id) : null;
    const r = await App.dialogo({
      titulo: antigo ? 'Renomear grupo' : 'Novo grupo',
      html: `<label class="campo"><span>Nome do grupo</span><input name="nome" maxlength="40" value="${esc(antigo ? antigo.nome : '')}" autofocus></label>`,
      botoes: [BTN_CANCELAR, { valor: 'ok', texto: 'Salvar', classe: 'btn-primario' }],
      validar: (v) => (v.nome.trim() ? null : 'Dê um nome ao grupo.'),
    });
    if (r.botao !== 'ok') return;
    const reg = Object.assign({}, antigo || { id: novoIdLegivel(r.valores.nome, e.grupos, 'g-'), ordem: Math.max(0, ...e.grupos.map((g) => g.ordem || 0)) + 1 },
      { nome: r.valores.nome.trim() });
    await App.salvar([{ tabela: 'grupos', registro: reg }], `${antigo ? 'Renomeação' : 'Criação'} do grupo ${reg.nome}`);
    App.renderizar(true);
  }

  /* ---------------- Contas e cartões ---------------- */

  function secaoContas(e) {
    const contas = R.ativos(e.contas);
    const pagamento = contas.filter((c) => c.ativa !== false && c.tipo !== 'poupanca');
    return `<section class="cartao">
        <label class="campo"><span>Forma de pagamento padrão (quando a categoria ainda não tem uma)</span>
        <select data-mudar="conta-padrao">${UI.opcoes(pagamento.map((c) => ({ valor: c.id, texto: c.nome })), e.config.conta_padrao || '', 'Automática (a conta corrente)')}</select></label>
        <p class="suave">Na tela de lançar, cada categoria já vem com a forma de pagamento usada da última vez.</p>
        <button type="button" class="btn btn-primario" data-acao="editar-conta" data-id="">+ Nova conta ou cartão</button>
      </section>
      <section class="cartao cartao-lista"><ul class="lista">${contas.map((c) => `<li><button type="button" class="linha${c.ativa === false ? ' inativa' : ''}" data-acao="editar-conta" data-id="${esc(c.id)}">
        <span class="linha-principal"><span class="linha-titulo">${esc(c.nome)}${c.ativa === false ? ' <span class="suave">(inativa)</span>' : ''}</span>
        <span class="linha-sub">${esc((TIPOS_CONTA.find((t) => t.valor === c.tipo) || { texto: c.tipo }).texto)}${c.tipo === 'cartao_credito' ? ` · fecha ${Number(c.dia_fechamento) >= 31 ? 'no último dia' : 'dia ' + esc(c.dia_fechamento)} · vence dia ${esc(c.dia_vencimento)}` : ''}</span></span>
        <span class="linha-valor" aria-hidden="true">›</span></button></li>`).join('')}</ul></section>`;
  }

  async function editarConta(el) {
    const e = App.estado;
    const antiga = el.dataset.id ? e.contas.find((c) => c.id === el.dataset.id) : null;
    const c0 = antiga || { nome: '', tipo: 'conta_corrente', dia_fechamento: null, dia_vencimento: null, ativa: true };
    const usos = antiga ? contarUso(e, 'conta_id', antiga.id) : 0;
    const html = `<label class="campo"><span>Nome curto</span><input name="nome" maxlength="40" value="${esc(c0.nome)}" autofocus></label>
      <label class="campo"><span>Tipo</span><select name="tipo">${UI.opcoes(TIPOS_CONTA, c0.tipo)}</select></label>
      <div class="linha-campos">
        <label class="campo"><span>Cartão: fecha no dia</span><select name="fechamento">${UI.opcoes(DIAS, c0.dia_fechamento || '', '—')}</select></label>
        <label class="campo"><span>Cartão: vence no dia</span><select name="vencimento">${UI.opcoes(DIAS, c0.dia_vencimento || '', '—')}</select></label>
      </div>
      <p class="dica">Mudar os dias vale para as próximas compras; o que já foi lançado continua no mês em que está.</p>
      <label class="campo-check"><input type="checkbox" name="ativa"${c0.ativa !== false ? ' checked' : ''}> Ativa</label>
      ${antiga ? `<p class="suave">${usos} lançamento(s) usam esta conta.</p>` : ''}`;
    const botoes = [BTN_CANCELAR];
    if (antiga && !usos) botoes.push({ valor: 'excluir', texto: 'Excluir', classe: 'btn-perigo', semValidar: true });
    botoes.push({ valor: 'ok', texto: 'Salvar', classe: 'btn-primario' });
    const r = await App.dialogo({
      titulo: antiga ? 'Conta' : 'Nova conta ou cartão', html, botoes,
      validar: (v) => {
        if (!v.nome.trim()) return 'Dê um nome curto.';
        if (v.tipo === 'cartao_credito' && (!v.fechamento || !v.vencimento)) return 'Para cartão, informe o dia de fechamento e o de vencimento.';
        return null;
      },
    });
    if (r.botao === 'excluir') {
      await App.excluir('contas', [antiga], `Exclusão da conta ${antiga.nome}`);
      App.renderizar(true);
      return;
    }
    if (r.botao !== 'ok') return;
    const v = r.valores;
    const cartao = v.tipo === 'cartao_credito';
    const reg = Object.assign({}, antiga || { id: novoIdLegivel(v.nome, e.contas, 'c-'), origem: 'app' }, {
      nome: v.nome.trim(), tipo: v.tipo, ativa: !!v.ativa,
      dia_fechamento: cartao ? Number(v.fechamento) : null, dia_vencimento: cartao ? Number(v.vencimento) : null,
    });
    await App.salvar([{ tabela: 'contas', registro: reg }], `${antiga ? 'Edição' : 'Cadastro'} da conta ${reg.nome}`);
    App.renderizar(true);
  }

  /* ---------------- Acerto ---------------- */

  function secaoAcerto(e) {
    const regra = R.regraAcerto(e);
    if (!regra) {
      return `<section class="cartao"><p>O acerto calcula quanto repassar a outra pessoa por mês: valor-base + extras − gastos dela no seu cartão.
        Resultado negativo passa para o mês seguinte.</p>
        <button type="button" class="btn btn-primario" data-acao="editar-regra">Configurar acerto</button></section>`;
    }
    const exc = (regra.excecoes_base || []).slice().sort((a, b) => (a.mes_ref < b.mes_ref ? -1 : 1));
    return `<section class="cartao">
        <dl class="definicoes">
          <dt>Pessoa</dt><dd>${esc(regra.pessoa || '—')}</dd>
          <dt>Valor-base mensal</dt><dd>${$.brl(regra.base_padrao_centavos)}</dd>
          <dt>Categoria do repasse</dt><dd>${esc(R.nomeCategoria(e, regra.categoria_repasse_id))}</dd>
          ${regra.inicio ? `<dt>Começa em</dt><dd>${esc(D.formatarMes(regra.inicio))}</dd>` : ''}
        </dl>
        <div class="botoes"><button type="button" class="btn btn-sec" data-acao="editar-regra">Editar regra</button>
        <button type="button" class="btn btn-perigo" data-acao="desligar-acerto">Desligar acerto</button></div>
      </section>
      <section class="cartao"><h2>Meses com valor-base diferente</h2>
        ${exc.length ? `<ul class="lista-simples">${exc.map((x) => `<li><span>${esc(D.nomeMes(x.mes_ref))}</span><span class="linha-valor">${$.brl(x.base_centavos)}</span>
          <button type="button" class="btn-icone" data-acao="tirar-excecao" data-mes="${esc(x.mes_ref)}" aria-label="Remover exceção de ${esc(D.formatarMes(x.mes_ref))}">✕</button></li>`).join('')}</ul>` : '<p class="suave">Nenhum.</p>'}
        <button type="button" class="btn btn-sec" data-acao="nova-excecao">+ Mês com valor diferente</button>
      </section>`;
  }

  async function editarRegra() {
    const e = App.estado;
    // se o acerto foi desligado antes, a regra antiga volta como ponto de partida
    const regra = R.regraAcerto(e) || e.config.acerto_regra_desligada || { pessoa: '', base_padrao_centavos: 0, excecoes_base: [], categoria_repasse_id: '' };
    const r = await App.dialogo({
      titulo: 'Regra do acerto',
      html: `<label class="campo"><span>Nome curto da pessoa</span><input name="pessoa" maxlength="30" value="${esc(regra.pessoa || '')}" autofocus></label>
        <label class="campo"><span>Valor-base mensal</span><input name="base" inputmode="decimal" value="${regra.base_padrao_centavos ? esc($.formatarNumero(regra.base_padrao_centavos).replace(/\./g, '')) : ''}" placeholder="0,00"></label>
        <label class="campo"><span>Categoria do repasse</span><select name="categoria"><option value="">Criar categoria "Repasse"</option>${UI.opcoesCategorias(e, 'despesa', regra.categoria_repasse_id)}</select></label>
        <label class="campo"><span>Começa em (opcional)</span><input type="month" name="inicio" value="${esc(regra.inicio || '')}"></label>`,
      botoes: [BTN_CANCELAR, { valor: 'ok', texto: 'Salvar', classe: 'btn-primario' }],
      validar: (v) => {
        if (!v.pessoa.trim()) return 'Informe o nome curto da pessoa.';
        const lv = $.lerValor(v.base);
        if (!lv.ok) return 'Valor-base: ' + lv.erro;
        if (v.inicio && !D.validarMes(v.inicio)) return 'Mês inicial inválido.';
        return null;
      },
    });
    if (r.botao !== 'ok') return;
    const v = r.valores;
    let categoria = v.categoria;
    if (!categoria) {
      const mud = [];
      if (!R.ativos(e.grupos).some((g) => g.id === 'acertos')) mud.push({ tabela: 'grupos', registro: { id: 'acertos', nome: 'Acertos e repasses', ordem: 80 } });
      categoria = novoIdLegivel('repasse ' + v.pessoa, e.categorias);
      mud.push({ tabela: 'categorias', registro: { id: categoria, nome: 'Repasse ' + v.pessoa.trim(), grupo_id: 'acertos', tipo: 'despesa', ativa: true, etiquetas: [], ordem: 80, origem: 'app' } });
      await App.salvar(mud, 'Criação da categoria do repasse');
    }
    const nova = Object.assign({}, regra, { pessoa: v.pessoa.trim(), base_padrao_centavos: $.lerValor(v.base).total, categoria_repasse_id: categoria, inicio: v.inicio || null });
    await App.salvarConfig('acerto_regra', nova);
    App.toast('Regra do acerto salva.');
    App.renderizar(true);
  }

  async function novaExcecao() {
    const regra = R.regraAcerto(App.estado);
    if (!regra) return;
    const r = await App.dialogo({
      titulo: 'Mês com valor-base diferente',
      html: `<label class="campo"><span>Mês</span><input type="month" name="mes" value="${esc(App.ui.mes)}" autofocus></label>
        <label class="campo"><span>Valor-base nesse mês</span><input name="valor" inputmode="decimal" placeholder="0,00"></label>`,
      botoes: [BTN_CANCELAR, { valor: 'ok', texto: 'Salvar', classe: 'btn-primario' }],
      validar: (v) => (!D.validarMes(v.mes) ? 'Escolha o mês.' : !$.lerValor(v.valor).ok ? 'Valor: ' + $.lerValor(v.valor).erro : null),
    });
    if (r.botao !== 'ok') return;
    const exc = (regra.excecoes_base || []).filter((x) => x.mes_ref !== r.valores.mes);
    exc.push({ mes_ref: r.valores.mes, base_centavos: $.lerValor(r.valores.valor).total });
    await App.salvarConfig('acerto_regra', Object.assign({}, regra, { excecoes_base: exc }));
    App.renderizar(true);
  }

  async function tirarExcecao(el) {
    const regra = R.regraAcerto(App.estado);
    await App.salvarConfig('acerto_regra', Object.assign({}, regra, { excecoes_base: (regra.excecoes_base || []).filter((x) => x.mes_ref !== el.dataset.mes) }));
    App.renderizar(true);
  }

  async function desligarAcerto() {
    if (!(await App.confirmar('Desligar acerto', 'A tela de acerto deixa de calcular o repasse. O histórico registrado continua guardado e volta se você configurar de novo.', 'Desligar', true))) return;
    await App.salvarConfig('acerto_regra_desligada', R.regraAcerto(App.estado));
    await App.salvarConfig('acerto_regra', null);
    App.renderizar(true);
  }

  /* ---------------- Preferências ---------------- */

  function secaoGeral(e) {
    const dias = e.config.lembrete_backup_dias || 7;
    return `<section class="cartao">
      <label class="campo"><span>Lembrar de fazer backup depois de</span>
      <select data-mudar="lembrete">${UI.opcoes([3, 7, 14, 30].map((d) => ({ valor: d, texto: d + ' dias' })), dias)}</select></label>
      <p class="suave">O aviso aparece no início quando o último backup deste aparelho for mais antigo que isso.</p>
      <p>Histórico desde: <b>${esc(D.nomeMes(R.inicioHistorico(e)))}</b></p>
    </section>`;
  }

  /* ---------------- Tela ---------------- */

  function secao(params) { return SECOES.find((s) => s.id === params[0]) || null; }

  function render(params) {
    const e = App.estado;
    const s = secao(params);
    if (!s) return indice();
    const volta = '<p><a href="#/ajustes">‹ Todos os ajustes</a></p>';
    switch (s.id) {
      case 'recorrentes': return volta + secaoRecorrentes(e);
      case 'categorias': return volta + secaoCategorias(e);
      case 'contas': return volta + secaoContas(e);
      case 'acerto': return volta + secaoAcerto(e);
      default: return volta + secaoGeral(e);
    }
  }

  App.registrarTela('ajustes', {
    titulo: (p) => { const s = secao(p); return s ? s.titulo : 'Ajustes'; },
    render,
    acoes: {
      'editar-recorrente': editarRecorrente, 'editar-categoria': editarCategoria, 'editar-grupo': editarGrupo,
      'editar-conta': editarConta, 'editar-regra': editarRegra, 'nova-excecao': novaExcecao, 'tirar-excecao': tirarExcecao,
      'desligar-acerto': desligarAcerto,
    },
    mudancas: {
      'conta-padrao': async (el) => { await App.salvarConfig('conta_padrao', el.value || null); App.toast('Forma de pagamento padrão salva.'); },
      lembrete: async (el) => { await App.salvarConfig('lembrete_backup_dias', Number(el.value)); App.toast('Lembrete salvo.'); },
    },
  }, { rotulo: 'Ajustes', icone: 'ajustes', ordem: 30 });
})();

/* ==== tela-mais.js ==== */
/* tela-mais.js — no celular, o menu de baixo mostra só as telas do dia a dia; as demais ficam aqui,
   junto com uma ajuda curta (o manual de uma página resumido). */
(function () {
  'use strict';
  const esc = FN.util.esc;

  function render() {
