      if (params[1]) App.ui.filtros.categoria = params[1];
      App.ui.filtrosChave = chave;
    }
    const f = App.ui.filtros;
    const lista = filtrar(e, f);
    const soma = (t) => lista.filter((x) => x.tipo === t).reduce((a, x) => a + x.valor_centavos, 0);
    const grupos = R.ativos(e.grupos).slice().sort((a, b) => (a.ordem || 0) - (b.ordem || 0));
    const contas = R.ativos(e.contas);
    const ult = App.alteracoes[App.alteracoes.length - 1];

    const extras = [f.tipo, f.grupo, f.categoria, f.status, f.conta].filter(Boolean).length;
    let html = `<section class="cartao filtros" aria-label="Filtros">
      <div class="filtros-linha">
        <label class="campo"><span>Período</span><select data-mudar="periodo">${UI.opcoes([
          { valor: 'mes', texto: 'Um mês' }, { valor: '3m', texto: 'Últimos 3 meses' }, { valor: '12m', texto: 'Últimos 12 meses' },
          { valor: 'ano', texto: 'Este ano' }, { valor: 'tudo', texto: 'Tudo' }], f.periodo)}</select></label>
        ${f.periodo === 'mes' ? `<label class="campo"><span>Mês</span><input type="month" data-mudar="mes" value="${esc(f.mes)}"></label>` : ''}
      </div>
      <label class="campo campo-busca"><span>Buscar</span><input type="search" data-mudar="busca" value="${esc(f.busca)}" placeholder="descrição, categoria ou valor (ex.: 12,34)"></label>
      <details class="mais-filtros"${extras || App.ui.filtrosAbertos ? ' open' : ''}><summary>Mais filtros${extras ? ` (${extras} em uso)` : ''}</summary>
      <div class="filtros-linha">
        <label class="campo"><span>Tipo</span><select data-mudar="tipo">${UI.opcoes(R.TIPOS.map((t) => ({ valor: t, texto: R.TIPO_NOME[t] })), f.tipo, 'Todos')}</select></label>
        <label class="campo"><span>Grupo</span><select data-mudar="grupo">${UI.opcoes(grupos.map((g) => ({ valor: g.id, texto: g.nome })), f.grupo, 'Todos')}</select></label>
        <label class="campo"><span>Categoria</span><select data-mudar="categoria"><option value="">Todas</option>${UI.opcoesCategorias(e, '', f.categoria, true)}</select></label>
        <label class="campo"><span>Status</span><select data-mudar="status">${UI.opcoes([{ valor: 'pago', texto: 'Pago' }, { valor: 'previsto', texto: 'Previsto' }], f.status, 'Todos')}</select></label>
        <label class="campo"><span>Forma de pagamento</span><select data-mudar="conta">${UI.opcoes(contas.map((c) => ({ valor: c.id, texto: c.nome })).concat([{ valor: '__nenhuma', texto: 'Não informado' }]), f.conta, 'Todas')}</select></label>
      </div></details>
      ${(extras || f.busca) ? '<button type="button" class="btn-link" data-acao="limpar-filtros">Limpar filtros</button>' : ''}
    </section>`;

    if (ult) {
      html += `<div class="barra-desfazer"><span class="suave">Última alteração: ${esc(ult.descricao)}</span>
        <button type="button" class="btn btn-sec" data-acao="desfazer">Desfazer</button></div>`;
    }

    html += `<p class="resumo-filtro"><b>${lista.length}</b> lançamento(s) · Despesas ${$.brl(soma('despesa'))} · Receitas ${$.brl(soma('receita'))}${soma('pagamento_divida') ? ' · Dívida ' + $.brl(soma('pagamento_divida')) : ''}</p>`;

    if (!lista.length) return html + UI.vazio('Nenhum lançamento com esses filtros.');
    const mostrar = lista.slice(0, f.limite);
    let mesAtual = null;
    html += '<section class="cartao cartao-lista">';
    for (const x of mostrar) {
      if (x.mes_ref !== mesAtual) {
        if (mesAtual) html += '</ul>';
        mesAtual = x.mes_ref;
        const doMes = lista.filter((l) => l.mes_ref === mesAtual && l.tipo === 'despesa');
        const soma = doMes.reduce((a, l) => a + l.valor_centavos, 0);
        html += `<h2 class="lista-mes">${esc(D.nomeMes(mesAtual))}${doMes.length > 1 ? ` <span class="suave">despesas ${$.brl(soma)}</span>` : ''}</h2><ul class="lista">`;
      }
      html += UI.linhaLancamento(e, x);
    }
    html += '</ul></section>';
    if (lista.length > mostrar.length) html += `<p class="centro"><button type="button" class="btn btn-sec" data-acao="mais">Mostrar mais (${lista.length - mostrar.length} restantes)</button></p>`;
    return html;
  }

  let timerBusca = null;
  const mudancas = {};
  for (const campo of ['periodo', 'mes', 'tipo', 'grupo', 'categoria', 'status', 'conta']) {
    mudancas[campo] = (el) => {
      App.ui.filtros[campo] = el.value;
      App.ui.filtros.limite = PAGINA;
      if (campo === 'grupo') App.ui.filtros.categoria = '';
      App.renderizar(true);
    };
  }
  mudancas.busca = (el) => {
    App.ui.filtros.busca = el.value;
    clearTimeout(timerBusca);
    timerBusca = setTimeout(() => {
      App.renderizar(true);
      const b = document.querySelector('[data-mudar="busca"]');
      if (b) { b.focus(); b.setSelectionRange(b.value.length, b.value.length); }
    }, 350);
  };

  App.registrarTela('historico', {
    titulo: 'Histórico', render, mudancas,
    // lembra se "Mais filtros" ficou aberto (o evento "toggle" não sobe até o documento)
    depois: (raiz) => {
      const d = raiz.querySelector('.mais-filtros');
      if (d) d.addEventListener('toggle', () => { App.ui.filtrosAbertos = d.open; });
    },
    acoes: {
      'limpar-filtros': () => { const f = App.ui.filtros; Object.assign(f, { tipo: '', grupo: '', categoria: '', status: '', conta: '', busca: '' }); App.renderizar(true); },
      mais: () => { App.ui.filtros.limite += PAGINA; App.renderizar(true); },
    },
  }, { rotulo: 'Histórico', icone: 'lista', principal: true, ordem: 2 });
})();

/* ==== tela-contas.js ==== */
/* tela-contas.js — contas fixas do mês: vencimento, valor esperado e situação (paga, prevista,
   pendente, vencida), em lista ou calendário. "Criar previstos do mês" faz o que a fonte vermelha
   fazia na planilha: registra o que você já sabe que vai pagar. */
(function () {
  'use strict';
  const $ = FN.dinheiro;
  const D = FN.datas;
  const R = FN.regras;
  const U = FN.util;
  const esc = U.esc;

  function statusVisual(c) { return c.vencida ? 'vencida' : c.status; }

  function valorTexto(c) {
    const r = c.recorrente;
    if (c.valor_pago || c.valor_previsto) return $.brl(c.valor_pago + c.valor_previsto);
    if (r.valor_esperado_centavos) return `${$.brl(r.valor_esperado_centavos)}${r.valor_estimado ? ' <span class="suave">(estimado)</span>' : ''}`;
    return '<span class="suave">valor variável</span>';
  }

  function linha(c, mes) {
    const r = c.recorrente;
    const venc = c.vencimento ? `vence ${D.formatarDataCurta(c.vencimento)}${c.status !== 'pago' && c.dias !== null ? (c.dias < 0 ? ` · ${-c.dias} dia(s) atrás` : c.dias === 0 ? ' · hoje' : ` · em ${c.dias} dia(s)`) : ''}` : 'sem dia de vencimento';
    const botoes = [];
    if (c.status !== 'pago') botoes.push(`<button type="button" class="btn btn-mini btn-primario" data-acao="pagar" data-id="${esc(r.id)}">Marcar pago</button>`);
    if (c.status === 'pendente' && r.valor_esperado_centavos) botoes.push(`<button type="button" class="btn btn-mini btn-sec" data-acao="prever" data-id="${esc(r.id)}">Prever</button>`);
    if (c.status === 'pendente' && !r.valor_esperado_centavos) botoes.push(`<button type="button" class="btn btn-mini btn-sec" data-acao="lancar-conta" data-id="${esc(r.id)}">Lançar valor</button>`);
    const nomeCat = R.nomeCategoria(App.estado, r.categoria_id);
    const cat = U.normalizar(nomeCat) !== U.normalizar(r.descricao) ? ' · ' + nomeCat : '';
    return `<li class="conta-linha conta-${statusVisual(c)}">
      <div class="conta-info"><span class="linha-titulo">${esc(r.descricao)}</span>
        <span class="linha-sub">${esc(venc)}${esc(cat)}</span></div>
      <div class="conta-valor"><span class="linha-valor">${valorTexto(c)}</span>${UI.chipStatus(statusVisual(c))}</div>
      <div class="conta-botoes">${botoes.join('')}</div>
    </li>`;
  }

  function calendario(contas, mes) {
    const dias = D.diasNoMes(mes);
    const primeiro = D.diaDaSemana(mes + '-01');
    const hoje = D.hoje();
    let html = '<div class="calendario" role="grid" aria-label="Calendário de vencimentos">';
    html += D.SEMANA.map((s) => `<div class="cal-cab" role="columnheader">${s}</div>`).join('');
    for (let i = 0; i < primeiro; i++) html += '<div class="cal-dia cal-vazio"></div>';
    for (let d = 1; d <= dias; d++) {
      const data = `${mes}-${D.pad(d)}`;
      const doDia = contas.filter((c) => c.vencimento === data);
      html += `<div class="cal-dia${data === hoje ? ' cal-hoje' : ''}${doDia.length ? ' cal-com-conta' : ''}" role="gridcell"><span class="cal-num">${d}</span>
        ${doDia.map((c) => `<span class="cal-item cal-${statusVisual(c)}" title="${esc(c.recorrente.descricao)}">${esc(c.recorrente.descricao)}</span>`).join('')}</div>`;
    }
    html += '</div>';
    // agenda embaixo do calendário: no celular os nomes não cabem nos quadradinhos
    const comDia = contas.filter((c) => c.vencimento);
    if (comDia.length) {
      html += `<ul class="agenda">${comDia.map((c) => `<li><span class="agenda-dia">${esc(D.formatarDataCurta(c.vencimento))}<br><span class="suave">${esc(D.SEMANA[D.diaDaSemana(c.vencimento)])}</span></span>
        <span class="agenda-nome">${esc(c.recorrente.descricao)}<br>${UI.chipStatus(statusVisual(c))}</span>
        <span class="linha-valor">${valorTexto(c)}</span></li>`).join('')}</ul>`;
    }
    const semDia = contas.filter((c) => !c.vencimento);
    if (semDia.length) html += `<p class="suave">Sem dia de vencimento definido: ${semDia.map((c) => esc(c.recorrente.descricao)).join(', ')}. Defina em <a href="#/ajustes/recorrentes">Ajustes › Contas fixas</a>.</p>`;
    return html;
  }

  function render() {
    const e = App.estado;
    const mes = App.ui.mes;
    const contas = R.contasDoMes(e, mes, D.hoje());
    const pagas = contas.filter((c) => c.status === 'pago').length;
    const aPagar = contas.filter((c) => c.status !== 'pago').reduce((a, c) => a + (c.valor_previsto || (c.status === 'pendente' ? (c.recorrente.valor_esperado_centavos || 0) : 0)), 0);
    const podePrever = contas.some((c) => c.status === 'pendente' && c.recorrente.valor_esperado_centavos);
    const visao = App.ui.contasVisao;
    let html = UI.seletorMes(mes);
    if (!contas.length) {
      return html + UI.vazio('Nenhuma conta fixa cadastrada para este mês.', '<a class="btn btn-primario" href="#/ajustes/recorrentes">Cadastrar contas fixas</a>');
    }
    html += `<section class="cartao">
      <p class="resumo-contas"><b>${pagas} de ${contas.length}</b> pagas · ${$.brl(aPagar)} ainda a pagar${contas.some((c) => c.vencida) ? ` · <span class="texto-critico">${contas.filter((c) => c.vencida).length} vencida(s)</span>` : ''}</p>
      <div class="chips" role="group" aria-label="Visão">
        <button type="button" class="chip${visao === 'lista' ? ' ativo' : ''}" data-acao="visao" data-valor="lista" aria-pressed="${visao === 'lista'}">Lista</button>
        <button type="button" class="chip${visao === 'calendario' ? ' ativo' : ''}" data-acao="visao" data-valor="calendario" aria-pressed="${visao === 'calendario'}">Calendário</button>
      </div>
      ${podePrever ? '<button type="button" class="btn btn-sec" data-acao="criar-previstos">Criar previstos do mês</button> <span class="suave dica-inline">registra as contas com valor conhecido como "previsto", como a fonte vermelha da planilha</span>' : ''}
    </section>`;
    if (visao === 'calendario') html += `<section class="cartao">${calendario(contas, mes)}</section>`;
    else html += `<section class="cartao cartao-lista"><ul class="lista contas">${contas.map((c) => linha(c, mes)).join('')}</ul></section>`;
    html += '<p><a href="#/ajustes/recorrentes">Gerenciar contas fixas (valores, dias de vencimento, forma de pagamento)</a></p>';
    return html;
  }

  function contaDe(id) {
    return R.contasDoMes(App.estado, App.ui.mes, D.hoje()).find((c) => c.recorrente.id === id);
  }

  function novoLancamento(r, mes, status) {
    const hoje = D.hoje();
    const venc = D.vencimentoNoMes(mes, r.dia_vencimento);
    const data = status === 'pago' ? (mes === D.mesDe(hoje) ? hoje : venc) : venc;
    return {
      id: U.novoId('l'), tipo: 'despesa', mes_ref: mes, data: data || null, data_compra: null, valor_centavos: r.valor_esperado_centavos,
      categoria_id: r.categoria_id, conta_id: r.conta_id || null, status, descricao: r.descricao, grupo_entrada_id: null,
      parcela_num: null, parcela_total: null, compra_parcelada_id: null, recorrente_id: r.id, pessoa: null, desconta_repasse: false,
      obs: null, origem: 'app (conta fixa)',
    };
  }

  const acoes = {
    visao: (el) => { App.ui.contasVisao = el.dataset.valor; App.renderizar(true); },
    pagar: async (el) => {
      const c = contaDe(el.dataset.id);
      if (!c) return;
      const mes = App.ui.mes;
      const prev = c.lancamentos.filter((x) => x.status === 'previsto');
      if (prev.length) {
        const hoje = D.hoje();
        await App.salvar(prev.map((x) => ({ tabela: 'lancamentos', registro: Object.assign({}, x, { status: 'pago', data: x.data || (mes === D.mesDe(hoje) ? hoje : null) }) })),
          `${c.recorrente.descricao} marcada como paga`);
      } else if (c.recorrente.valor_esperado_centavos) {
        await App.salvar([{ tabela: 'lancamentos', registro: novoLancamento(c.recorrente, mes, 'pago') }], `${c.recorrente.descricao} paga`);
      } else {
        App.navegar(`#/lancar/nova/${encodeURIComponent(c.recorrente.categoria_id)}/${encodeURIComponent(c.recorrente.id)}`);
        return;
      }
      App.toast(`${c.recorrente.descricao}: paga.`, { acao: 'Desfazer', fn: async () => { await App.desfazer(); App.renderizar(true); } });
      App.renderizar(true);
    },
    prever: async (el) => {
      const c = contaDe(el.dataset.id);
      if (!c || !c.recorrente.valor_esperado_centavos) return;
      await App.salvar([{ tabela: 'lancamentos', registro: novoLancamento(c.recorrente, App.ui.mes, 'previsto') }], `${c.recorrente.descricao} prevista`);
      App.renderizar(true);
    },
    'lancar-conta': (el) => {
      const c = contaDe(el.dataset.id);
      if (c) App.navegar(`#/lancar/nova/${encodeURIComponent(c.recorrente.categoria_id)}/${encodeURIComponent(c.recorrente.id)}`);
    },
    'criar-previstos': async () => {
      const mes = App.ui.mes;
      const alvo = R.contasDoMes(App.estado, mes, D.hoje()).filter((c) => c.status === 'pendente' && c.recorrente.valor_esperado_centavos);
      if (!alvo.length) return;
      const ok = await App.confirmar('Criar previstos', `Registrar ${alvo.length} conta(s) como "previsto" em ${D.nomeMes(mes)}, total de ${$.brl(alvo.reduce((a, c) => a + c.recorrente.valor_esperado_centavos, 0))}?`, 'Criar');
      if (!ok) return;
      await App.salvar(alvo.map((c) => ({ tabela: 'lancamentos', registro: novoLancamento(c.recorrente, mes, 'previsto') })), `${alvo.length} contas previstas em ${D.formatarMes(mes)}`);
      App.toast(`${alvo.length} conta(s) prevista(s).`, { acao: 'Desfazer', fn: async () => { await App.desfazer(); App.renderizar(true); } });
      App.renderizar(true);
    },
  };

  App.registrarTela('contas', { titulo: 'Contas do mês', render, acoes }, { rotulo: 'Contas', icone: 'calendario', principal: true, ordem: 4 });
})();

/* ==== tela-cartoes.js ==== */
/* tela-cartoes.js — faturas de cada cartão (pelo mês em que vencem), registro do pagamento da
   fatura e compras parceladas em aberto (quantas parcelas faltam, quanto falta, quando termina).
   Ao registrar o pagamento: a parte da fatura sem lançamentos detalhados vira "fatura sem detalhe"
   e o que for pago acima da fatura vira "pagamento de dívida" (fora do consumo e do orçamento). */
(function () {
  'use strict';
  const $ = FN.dinheiro;
  const D = FN.datas;
  const R = FN.regras;
  const U = FN.util;
  const esc = U.esc;

  function diaFechamentoTexto(c) { return Number(c.dia_fechamento) >= 31 ? 'no último dia' : 'dia ' + c.dia_fechamento; }

  /** Faturas mostradas: a aberta sempre; a anterior e a seguinte só se tiverem lançamentos;
   *  e qualquer mês com parcela ou compra ainda prevista. */
  function mesesDoCartao(e, cartao) {
    const hoje = D.hoje();
    const aberta = D.mesDaFatura(hoje, cartao).mes_ref;
    const usados = new Set(R.ativos(e.lancamentos).filter((x) => x.conta_id === cartao.id).map((x) => x.mes_ref));
    const set = new Set([aberta]);
    for (const m of [D.somarMeses(aberta, -1), D.somarMeses(aberta, 1)]) if (usados.has(m)) set.add(m);
    for (const x of R.ativos(e.lancamentos)) if (x.conta_id === cartao.id && x.status === 'previsto') set.add(x.mes_ref);
    return { aberta, meses: [...set].sort() };
  }

  function situacao(f, hoje) {
    if (!f.total && !f.registro) return null;
    if (f.previsto === 0) return { rotulo: 'paga', status: 'pago' };
    if (f.vencimento && f.vencimento < hoje) return { rotulo: 'vencida', status: 'vencida' };
    return { rotulo: 'a pagar', status: 'previsto' };
  }

  function blocoFatura(e, f, aberta) {
    const hoje = D.hoje();
    const s = situacao(f, hoje);
    const rotulo = f.mes === aberta ? 'fatura aberta: compras de hoje entram nela' : f.mes < aberta ? 'fatura fechada' : 'fatura futura';
    return `<div class="fatura">
      <div class="fatura-topo"><div class="fatura-info"><b>${esc(D.nomeMes(f.mes))}</b>
        <span class="suave">${esc(rotulo)}${f.vencimento ? ' · vence ' + esc(D.formatarData(f.vencimento)) : ''}</span></div>
        <div class="fatura-valor">${s ? `<span class="linha-valor">${$.brl(f.total)}</span>${UI.chipStatus(s.status)}` : '<span class="suave">sem lançamentos</span>'}</div></div>
      ${f.registro ? `<p class="suave">Pagamento registrado: fatura ${$.brl(f.registro.valor_fatura)}, pago ${$.brl(f.registro.valor_pago)}${f.registro.data_pagamento ? ' em ' + esc(D.formatarData(f.registro.data_pagamento)) : ''}.</p>` : ''}
      ${f.lancamentos.length ? `<details><summary>${f.lancamentos.length} lançamento(s)</summary><ul class="lista">${f.lancamentos.map((x) => UI.linhaLancamento(e, x)).join('')}</ul></details>` : ''}
      ${f.previsto > 0 ? `<button type="button" class="btn btn-sec" data-acao="pagar-fatura" data-conta="${esc(f.conta.id)}" data-mes="${esc(f.mes)}">Registrar pagamento da fatura</button>` : ''}
    </div>`;
  }

  function render() {
    const e = App.estado;
    const cartoes = R.cartoes(e);
    if (!cartoes.length) return UI.vazio('Nenhum cartão de crédito cadastrado.', '<a class="btn btn-primario" href="#/ajustes/contas">Cadastrar cartão</a>');
    let html = '';
    for (const c of cartoes) {
      const { aberta, meses } = mesesDoCartao(e, c);
      html += `<section class="cartao"><h2>${esc(c.nome)}</h2><p class="suave">Fecha ${esc(diaFechamentoTexto(c))} e vence no dia ${esc(c.dia_vencimento)}.</p>
        ${meses.map((m) => blocoFatura(e, R.fatura(e, c, m), aberta)).join('')}
        <details class="historico-faturas"><summary>Faturas dos últimos 12 meses</summary>
        <table class="tabela"><thead><tr><th>Mês</th><th class="num">Total</th></tr></thead><tbody>
        ${D.listaMeses(D.somarMeses(aberta, -12), D.somarMeses(aberta, -1)).reverse().map((m) => { const f = R.fatura(e, c, m); return f.total ? `<tr><td>${esc(D.formatarMes(m))}</td><td class="num">${$.brl(f.total)}</td></tr>` : ''; }).join('') || '<tr><td colspan="2" class="suave">Sem faturas.</td></tr>'}
        </tbody></table></details></section>`;
    }
    const ab = R.parcelasEmAberto(e);
    html += `<section class="cartao"><h2>Compras parceladas em aberto</h2>${ab.length ? `<ul class="lista">${ab.map((p) => `<li class="parcela-linha">
      <div class="parcela-info"><span class="linha-titulo">${esc(p.compra.descricao || R.nomeCategoria(e, p.compra.categoria_id))}</span>
      <span class="linha-sub">${esc(R.nomeConta(e, p.compra.conta_id))} · faltam ${p.faltam} de ${p.total} · termina em ${esc(D.formatarMes(p.termina))}</span>
      <span class="linha-sub">próxima: ${$.brl(p.proxima.valor_centavos)} em ${esc(D.formatarMes(p.proxima.mes_ref))}</span></div>
      <div class="linha-valor">${$.brl(p.valor_restante)}<br><span class="suave">falta</span></div></li>`).join('')}</ul>`
      : '<p class="suave">Nenhuma compra parcelada em aberto. Para parcelar, escolha as parcelas na tela Lançar.</p>'}
      ${ab.length ? `<p><b>Total que falta pagar: ${$.brl(ab.reduce((a, p) => a + p.valor_restante, 0))}</b></p>` : ''}</section>`;
    return html;
  }

  /** Categoria para a parte da fatura sem lançamentos detalhados (cria se não existir). */
  function categoriaSemDetalhe(e, cartao, mudancas) {
    if (cartao.categoria_sem_detalhe_id && R.categoria(e, cartao.categoria_sem_detalhe_id)) return cartao.categoria_sem_detalhe_id;
    const doGrupo = new Set(R.ativos(e.categorias).filter((c) => c.grupo_id === 'cartao').map((c) => c.id));
    const cont = new Map();
    for (const x of R.ativos(e.lancamentos)) if (x.conta_id === cartao.id && doGrupo.has(x.categoria_id)) cont.set(x.categoria_id, (cont.get(x.categoria_id) || 0) + 1);
    const usada = [...cont.entries()].sort((a, b) => b[1] - a[1])[0];
    if (usada) return usada[0];
    if (!R.ativos(e.grupos).some((g) => g.id === 'cartao')) mudancas.push({ tabela: 'grupos', registro: { id: 'cartao', nome: 'Cartão sem categoria', ordem: 90 } });
    const id = 'fatura-sem-detalhe';
    if (!R.categoria(e, id)) mudancas.push({ tabela: 'categorias', registro: { id, nome: 'Fatura de cartão sem detalhe', grupo_id: 'cartao', tipo: 'despesa', ativa: true, etiquetas: [], ordem: 90 } });
    return id;
  }

  function categoriaDivida(e, mudancas) {
    const c = R.ativos(e.categorias).find((x) => x.tipo === 'pagamento_divida');
    if (c) return c.id;
    if (!R.ativos(e.grupos).some((g) => g.id === 'dividas')) mudancas.push({ tabela: 'grupos', registro: { id: 'dividas', nome: 'Dívidas', ordem: 95 } });
    mudancas.push({ tabela: 'categorias', registro: { id: 'amortizacao-divida', nome: 'Amortização de dívida', grupo_id: 'dividas', tipo: 'pagamento_divida', ativa: true, etiquetas: [], ordem: 95 } });
    return 'amortizacao-divida';
  }

  async function pagarFatura(el) {
    const e = App.estado;
    const cartao = e.contas.find((c) => c.id === el.dataset.conta);
    const mes = el.dataset.mes;
    const f = R.fatura(e, cartao, mes);
    const hoje = D.hoje();
    const r = await App.dialogo({
      titulo: `Pagar fatura de ${D.formatarMes(mes)}`,
      html: `<p>Lançado neste cartão para ${esc(D.nomeMes(mes))}: <b>${$.brl(f.total)}</b>.</p>
        <label class="campo"><span>Valor total da fatura (como está no banco)</span><input name="fatura" inputmode="decimal" value="${esc($.formatarNumero(f.total).replace(/\./g, ''))}" autofocus></label>
        <label class="campo"><span>Valor pago</span><input name="pago" inputmode="decimal" value="${esc($.formatarNumero(f.total).replace(/\./g, ''))}"></label>
        <label class="campo"><span>Data do pagamento</span><input type="date" name="data" value="${esc(f.vencimento && f.vencimento < hoje ? f.vencimento : hoje)}"></label>
        <p class="dica">Se a fatura for maior que o lançado, a diferença vira "fatura sem detalhe". Se você pagar mais que a fatura, o excedente vira "pagamento de dívida".</p>`,
      botoes: [{ valor: 'cancelar', texto: 'Cancelar', classe: 'btn-sec', semValidar: true }, { valor: 'ok', texto: 'Registrar', classe: 'btn-primario' }],
      validar: (v) => {
        const fa = $.lerValor(v.fatura);
        const pa = $.lerValor(v.pago);
        if (!fa.ok) return 'Valor da fatura: ' + fa.erro;
        if (!pa.ok) return 'Valor pago: ' + pa.erro;
        if (fa.total < f.total) return `A fatura não pode ser menor que o total lançado (${$.brl(f.total)}). Confira os lançamentos.`;
        if (pa.total < fa.total) return 'Pagamento parcial: registre o valor total pago ou ajuste a fatura.';
        if (!D.validarData(v.data)) return 'Informe a data do pagamento.';
        return null;
      },
    });
    if (r.botao !== 'ok') return;
    const valorFatura = $.lerValor(r.valores.fatura).total;
    const valorPago = $.lerValor(r.valores.pago).total;
    const mudancas = [];
    for (const x of f.lancamentos.filter((l) => l.status === 'previsto')) mudancas.push({ tabela: 'lancamentos', registro: Object.assign({}, x, { status: 'pago' }) });
    const base = { tipo: 'despesa', mes_ref: mes, data: r.valores.data, data_compra: null, conta_id: cartao.id, status: 'pago', grupo_entrada_id: null,
      parcela_num: null, parcela_total: null, compra_parcelada_id: null, recorrente_id: null, pessoa: null, desconta_repasse: false, origem: 'app (pagamento de fatura)' };
    if (valorFatura > f.total) {
      mudancas.push({ tabela: 'lancamentos', registro: Object.assign({}, base, { id: U.novoId('l'), valor_centavos: valorFatura - f.total,
        categoria_id: categoriaSemDetalhe(e, cartao, mudancas), descricao: `Fatura ${cartao.nome} sem detalhe`, obs: `Fatura de ${$.brl(valorFatura)} − ${$.brl(f.total)} lançados em detalhe.` }) });
    }
    if (valorPago > valorFatura) {
      mudancas.push({ tabela: 'lancamentos', registro: Object.assign({}, base, { id: U.novoId('l'), tipo: 'pagamento_divida', valor_centavos: valorPago - valorFatura,
        categoria_id: categoriaDivida(e, mudancas), descricao: `Amortização da dívida do ${cartao.nome}`, obs: `Pago ${$.brl(valorPago)} para fatura de ${$.brl(valorFatura)}.` }) });
    }
    const idFat = cartao.id + ':' + mes;
    const antigo = e.faturas.find((x) => x.id === idFat) || {};
    mudancas.push({ tabela: 'faturas', registro: Object.assign({}, antigo, { id: idFat, conta_id: cartao.id, mes_ref: mes, valor_fatura: valorFatura, valor_pago: valorPago, data_pagamento: r.valores.data, excluido_em: null }) });
    await App.salvar(mudancas, `Pagamento da fatura ${cartao.nome} de ${D.formatarMes(mes)}`);
    App.toast(`Fatura de ${D.formatarMes(mes)} registrada como paga.`, { acao: 'Desfazer', fn: async () => { await App.desfazer(); App.renderizar(true); } });
    App.renderizar(true);
  }

  App.registrarTela('cartoes', { titulo: 'Cartões', render, acoes: { 'pagar-fatura': pagarFatura } }, { rotulo: 'Cartões', icone: 'cartao', ordem: 5 });
})();

/* ==== tela-acerto.js ==== */
/* tela-acerto.js — acerto com outra pessoa (reproduz a aba de acerto da planilha):
   valor-base + extras − débitos (gastos dela no seu cartão) ± saldo negativo do mês anterior = repasse.
   Resultado negativo não vira repasse: passa para o mês seguinte. O nome da pessoa vem dos seus dados. */
(function () {
  'use strict';
  const $ = FN.dinheiro;
  const D = FN.datas;
  const R = FN.regras;
  const U = FN.util;
  const esc = U.esc;
  const TIPOS_EXTRA = ['13º (metade)', '1/3 de férias', 'Restituição do IR (10%)', 'Outro'];

  function registroDoMes(e, mes) {
    const r = e.acerto_meses.find((a) => a.mes_ref === mes && !a.excluido_em);
    return r ? U.clonar(r) : { id: 'am-' + mes, mes_ref: mes, extras: [], debitos: [] };
  }

  function render() {
    const e = App.estado;
    const regra = R.regraAcerto(e);
    if (!regra) {
      return UI.vazio('O acerto com outra pessoa não está configurado. Ele é criado ao importar o histórico ou em Ajustes.',
        '<a class="btn btn-primario" href="#/ajustes/acerto">Configurar acerto</a>');
    }
    const mes = App.ui.mes;
    const fim = mes > D.mesAtual() ? mes : D.mesAtual();
    const lista = R.acerto(e, fim);
    const a = lista.find((x) => x.mes === mes) || R.acerto(e, mes).find((x) => x.mes === mes);
    const pessoa = regra.pessoa || 'a outra pessoa';
    if (!a) return UI.seletorMes(mes) + UI.vazio(`O acerto começa em ${D.nomeMes(lista.length ? lista[0].mes : mes)}.`);
    const registrado = a.registrado_pago + a.registrado_previsto;
    const planilha = a.registro && a.registro.valor_planilha_centavos !== undefined && a.registro.valor_planilha_centavos !== a.repasse ? a.registro.valor_planilha_centavos : null;

    const linhasExtras = a.extras.map((x) => `<li><span>${esc(x.tipo || 'Extra')}${x.obs ? ` <span class="suave">${esc(x.obs)}</span>` : ''}</span>
      <span class="linha-valor">+ ${$.brl(x.valor_centavos)}</span><button type="button" class="btn-icone" data-acao="tirar-extra" data-id="${esc(x.id)}" aria-label="Remover extra">✕</button></li>`).join('');
    const linhasDeb = a.debitos.map((d) => `<li><span>${esc(d.descricao || 'Débito')}${d.obs ? ` <span class="suave">${esc(d.obs)}</span>` : ''}${d.status === 'previsto' ? ' ' + UI.chipStatus('previsto') : ''}</span>
      <span class="linha-valor">− ${$.brl(d.valor_centavos)}</span>${d.lancamento_id
        ? `<button type="button" class="btn-icone" data-acao="editar-lancamento" data-id="${esc(d.lancamento_id)}" aria-label="Abrir lançamento">↗</button>`
        : `<button type="button" class="btn-icone" data-acao="tirar-debito" data-id="${esc(d.id)}" aria-label="Remover débito">✕</button>`}</li>`).join('');

    let html = UI.seletorMes(mes) + `<section class="cartao conta-acerto">
      <h2>Repasse de ${esc(D.nomeMes(mes))}</h2>
      <ul class="acerto-conta">
        <li><span>Valor-base (mesada)</span><span class="linha-valor">${$.brl(a.base)}</span><span></span></li>
        ${linhasExtras}
        ${linhasDeb}
        ${a.saldo_anterior ? `<li><span>Saldo negativo de ${esc(D.formatarMes(D.somarMeses(mes, -1)))}</span><span class="linha-valor">${$.brl(a.saldo_anterior)}</span><span></span></li>` : ''}
        <li class="acerto-total"><span>${a.resultado < 0 ? 'Resultado' : 'Repasse do mês'}</span><span class="linha-valor">${$.brl(a.resultado < 0 ? a.resultado : a.repasse)}</span><span></span></li>
      </ul>
      ${a.resultado < 0 ? `<p class="dica">Sem repasse neste mês: ${$.brl(a.resultado)} passam para ${esc(D.nomeMes(D.somarMeses(mes, 1)))}.</p>` : ''}
      <div class="botoes">
        <button type="button" class="btn btn-sec" data-acao="novo-debito">+ Gasto de ${esc(pessoa)}</button>
        <button type="button" class="btn btn-sec" data-acao="novo-extra">+ Extra</button>
      </div>
      <p class="repasse-registro">${registrado
        ? `Repasse registrado: <b>${$.brl(registrado)}</b> ${UI.chipStatus(a.registrado_previsto ? 'previsto' : 'pago')}${registrado !== a.repasse ? ` <span class="texto-critico">diferente do calculado (${$.brl(a.repasse)})</span>` : ''}`
        : a.repasse > 0 ? `<button type="button" class="btn btn-primario" data-acao="registrar-repasse">Registrar repasse de ${$.brl(a.repasse)}</button>` : ''}</p>
      ${planilha !== null ? `<p class="suave">Na planilha este mês estava ${$.brl(planilha)}; aqui vale a regra do saldo negativo (confirmada por você).</p>` : ''}
    </section>`;

    html += `<section class="cartao"><h2>Histórico do acerto</h2><div class="rolagem-x"><table class="tabela">
      <thead><tr><th>Mês</th><th class="num col-op">Base</th><th class="num col-op">Extras</th><th class="num">Débitos</th><th class="num col-op">Saldo ant.</th><th class="num">Repasse</th><th class="num">Registrado</th></tr></thead><tbody>
      ${lista.slice().reverse().map((x) => `<tr${x.mes === mes ? ' class="linha-atual"' : ''}><td><button type="button" class="btn-link" data-acao="ir-mes" data-mes="${esc(x.mes)}">${esc(D.formatarMes(x.mes))}</button></td>
        <td class="num col-op">${$.brl(x.base)}</td><td class="num col-op">${x.total_extras ? $.brl(x.total_extras) : '—'}</td><td class="num">${x.total_debitos ? $.brl(x.total_debitos) : '—'}</td>
        <td class="num col-op">${x.saldo_anterior ? $.brl(x.saldo_anterior) : '—'}</td><td class="num"><b>${$.brl(x.repasse)}</b></td>
        <td class="num">${x.registrado_pago + x.registrado_previsto ? $.brl(x.registrado_pago + x.registrado_previsto) : '—'}</td></tr>`).join('')}
      </tbody></table></div>
      <p class="suave">Regra: ${$.brl(regra.base_padrao_centavos)} por mês${(regra.excecoes_base || []).length ? ` (${regra.excecoes_base.map((x) => `${D.formatarMes(x.mes_ref)}: ${$.brl(x.base_centavos)}`).join('; ')})` : ''}. <a href="#/ajustes/acerto">Mudar</a></p></section>`;
    return html;
  }

  async function novoDebito() {
    const e = App.estado;
    const regra = R.regraAcerto(e);
    const mes = App.ui.mes;
    const r = await App.dialogo({
      titulo: `Gasto de ${regra.pessoa || 'outra pessoa'}`,
      html: `<p class="suave">Compra dela no seu cartão (já está na fatura). Desconta do repasse.</p>
        <label class="campo"><span>Valor da compra</span><input name="valor" inputmode="decimal" autofocus placeholder="0,00"></label>
        <label class="campo"><span>Descrição</span><input name="descricao" maxlength="80"></label>
        <label class="campo"><span>Parcelas (uma por mês a partir de ${esc(D.formatarMes(mes))})</span><select name="parcelas">${UI.opcoes(Array.from({ length: 12 }, (_, i) => ({ valor: i + 1, texto: i ? `${i + 1}x` : 'À vista' })), 1)}</select></label>
        <label class="campo-check"><input type="checkbox" name="metade"> Dividir por 2 (só metade é dela)</label>`,
      botoes: [{ valor: 'cancelar', texto: 'Cancelar', classe: 'btn-sec', semValidar: true }, { valor: 'ok', texto: 'Adicionar', classe: 'btn-primario' }],
      validar: (v) => { const lv = $.lerValor(v.valor); return lv.ok ? null : lv.erro; },
    });
    if (r.botao !== 'ok') return;
    const total = $.lerValor(r.valores.valor).total;
    const n = Number(r.valores.parcelas) || 1;
    const partes = $.dividirEmParcelas(total, n);
    const mudancas = [];
    partes.forEach((p, i) => {
      const m = D.somarMeses(mes, i);
      const reg = registroDoMes(e, m);
      const valor = r.valores.metade ? $.metade(p) : p;
      const contas = [n > 1 ? `${$.formatarNumero(total)} ÷ ${n}` : '', r.valores.metade ? '÷ 2' : ''].filter(Boolean).join(' ');
      reg.debitos.push({ id: U.novoId('d'), valor_centavos: valor, descricao: (r.valores.descricao || 'Compra') + (n > 1 ? ` (parcela ${i + 1}/${n})` : ''),
        status: m > D.mesAtual() ? 'previsto' : 'pago', obs: contas ? 'Conta: ' + contas : null, origem: 'app' });
      mudancas.push({ tabela: 'acerto_meses', registro: reg });
    });
    await App.salvar(mudancas, `Gasto de ${regra.pessoa || 'outra pessoa'}: ${$.brl(total)}`);
    App.renderizar(true);
  }

  async function novoExtra() {
    const e = App.estado;
    const mes = App.ui.mes;
    const r = await App.dialogo({
      titulo: 'Extra do mês',
      html: `<label class="campo"><span>Tipo</span><select name="tipo">${UI.opcoes(TIPOS_EXTRA.map((t) => ({ valor: t, texto: t })), TIPOS_EXTRA[0])}</select></label>
        <label class="campo"><span>Valor</span><input name="valor" inputmode="decimal" autofocus placeholder="0,00"></label>`,
      botoes: [{ valor: 'cancelar', texto: 'Cancelar', classe: 'btn-sec', semValidar: true }, { valor: 'ok', texto: 'Adicionar', classe: 'btn-primario' }],
      validar: (v) => { const lv = $.lerValor(v.valor); return lv.ok ? null : lv.erro; },
    });
    if (r.botao !== 'ok') return;
    const reg = registroDoMes(e, mes);
    reg.extras.push({ id: U.novoId('x'), tipo: r.valores.tipo, valor_centavos: $.lerValor(r.valores.valor).total, origem: 'app' });
    await App.salvar([{ tabela: 'acerto_meses', registro: reg }], `Extra de ${D.formatarMes(mes)}`);
    App.renderizar(true);
  }

  async function tirar(el, campo) {
    const e = App.estado;
    const reg = registroDoMes(e, App.ui.mes);
    reg[campo] = reg[campo].filter((x) => x.id !== el.dataset.id);
    await App.salvar([{ tabela: 'acerto_meses', registro: reg }], `Remoção no acerto de ${D.formatarMes(App.ui.mes)}`);
    App.toast('Removido.', { acao: 'Desfazer', fn: async () => { await App.desfazer(); App.renderizar(true); } });
    App.renderizar(true);
  }

  async function registrarRepasse() {
    const e = App.estado;
    const regra = R.regraAcerto(e);
    const mes = App.ui.mes;
    const a = R.acerto(e, mes).find((x) => x.mes === mes);
    if (!a || a.repasse <= 0) return;
    const hoje = D.hoje();
    await App.salvar([{ tabela: 'lancamentos', registro: {
      id: U.novoId('l'), tipo: 'despesa', mes_ref: mes, data: mes === D.mesDe(hoje) ? hoje : null, data_compra: null, valor_centavos: a.repasse,
      categoria_id: regra.categoria_repasse_id, conta_id: null, status: 'pago', descricao: `Repasse ${regra.pessoa || ''}`.trim(), grupo_entrada_id: null,
      parcela_num: null, parcela_total: null, compra_parcelada_id: null, recorrente_id: null, pessoa: regra.pessoa || null, desconta_repasse: false,
      obs: 'Calculado pelo acerto do mês.', origem: 'app (acerto)' } }], `Repasse de ${D.formatarMes(mes)}`);
    App.toast(`Repasse de ${$.brl(a.repasse)} registrado.`, { acao: 'Desfazer', fn: async () => { await App.desfazer(); App.renderizar(true); } });
    App.renderizar(true);
  }

  App.registrarTela('acerto', {
    titulo: () => { const r = R.regraAcerto(App.estado); return r && r.pessoa ? `Acerto com ${r.pessoa}` : 'Acerto'; },
    render,
    acoes: {
      'novo-debito': novoDebito, 'novo-extra': novoExtra,
      'tirar-debito': (el) => tirar(el, 'debitos'), 'tirar-extra': (el) => tirar(el, 'extras'),
      'registrar-repasse': registrarRepasse,
      'ir-mes': (el) => { App.ui.mes = el.dataset.mes; App.renderizar(); },
    },
  }, { rotulo: 'Acerto', icone: 'pessoa', ordem: 6 });
})();

/* ==== tela-orcamento.js ==== */
/* tela-orcamento.js — orçamento por categoria e por grupo. Sugestão automática pela MEDIANA dos
   últimos 6 meses fechados (a mediana é o valor do meio: um mês fora do comum não puxa a
   sugestão). Alertas em 80% (atenção) e 100% (estourado), aqui e no início.
   O gasto do mês conta o que já foi pago e o que está previsto. Mudar o valor "a partir de"
   um mês guarda o histórico: os meses anteriores continuam com o valor antigo. */
(function () {
  'use strict';
  const $ = FN.dinheiro;
  const D = FN.datas;
  const R = FN.regras;
  const U = FN.util;
  const esc = U.esc;
  const NIVEL = {
    ok: { barra: 'b-ok', icone: '✓', texto: 'dentro' },
    atencao: { barra: 'b-atencao', icone: '▲', texto: 'atenção' },
    estourado: { barra: 'b-estourado', icone: '!', texto: 'estourado' },
  };
  const BTN_CANCELAR = { valor: 'cancelar', texto: 'Cancelar', classe: 'btn-sec', semValidar: true };
  const MESES_SUGESTAO = 6;

  function nomeAlvo(e, o) {
    return o.alvo_tipo === 'grupo' ? `Grupo ${R.nomeGrupo(e, o.alvo_id)}` : R.nomeCategoria(e, o.alvo_id);
  }

  /** Orçamento que vale para o alvo no mês (o de início mais recente). */
  function vigente(e, alvoTipo, alvoId, mes) {
    return R.ativos(e.orcamentos).filter((o) => o.alvo_tipo === alvoTipo && o.alvo_id === alvoId
      && (!o.vigencia_inicio || o.vigencia_inicio <= mes) && (!o.vigencia_fim || o.vigencia_fim >= mes))
      .sort((a, b) => ((a.vigencia_inicio || '') < (b.vigencia_inicio || '') ? 1 : -1))[0] || null;
  }

  function linha(e, it) {
    const o = it.orcamento;
    const n = NIVEL[it.nivel];
    const resta = o.valor_centavos - it.gasto;
    return `<li><button type="button" class="linha orc-linha" data-acao="editar" data-id="${esc(o.id)}">
      <span class="linha-principal"><span class="linha-titulo">${esc(nomeAlvo(e, o))}</span>
        <span class="linha-sub">${$.brl(it.gasto)} de ${$.brl(o.valor_centavos)} · ${resta >= 0 ? 'restam ' + $.brl(resta) : 'passou ' + $.brl(-resta)}</span>
        ${UI.barra(it.pct, n.barra)}</span>
      <span class="linha-valor"><span class="st st-${it.nivel}"><span aria-hidden="true">${n.icone}</span> ${it.pct === null ? '—' : $.pct(it.pct, 0)}</span>
        <span class="sr">${n.texto}</span></span></button></li>`;
  }

  function render(params) {
    if (params[0] === 'sugestoes') return sugestoes();
    const e = App.estado;
    const mes = App.ui.mes;
    const itens = R.orcamentoMes(e, mes).sort((a, b) => (b.pct || 0) - (a.pct || 0));
    let html = UI.seletorMes(mes);
    if (!itens.length) {
      return html + `<section class="cartao"><p>Nenhum orçamento vale para ${esc(D.nomeMes(mes))}.</p>
        <p>Comece pelas sugestões: para cada categoria, o app calcula a <b>mediana</b> do gasto dos últimos ${MESES_SUGESTAO} meses — o valor do meio, que não se deixa levar por um mês fora do comum.</p>
        <div class="botoes"><a class="btn btn-primario" href="#/orcamento/sugestoes">Ver sugestões</a>
        <button type="button" class="btn btn-sec" data-acao="novo">Criar um orçamento</button></div></section>`;
    }
    const cont = { ok: 0, atencao: 0, estourado: 0 };
    for (const it of itens) cont[it.nivel]++;
    const cats = itens.filter((it) => it.orcamento.alvo_tipo === 'categoria');
    const totalOrc = cats.reduce((a, it) => a + it.orcamento.valor_centavos, 0);
    const totalGasto = cats.reduce((a, it) => a + it.gasto, 0);
    html += `<section class="cartao">
      <p class="resumo-orc">${cont.estourado ? `<span class="texto-critico">${cont.estourado} passaram do limite</span> · ` : ''}${cont.atencao} em atenção (80% a 100%) · ${cont.ok} abaixo de 80%</p>
      ${cats.length ? `<p class="suave">Categorias com orçamento: ${$.brl(totalGasto)} gastos de ${$.brl(totalOrc)} (${$.pct(totalOrc ? totalGasto / totalOrc * 100 : 0, 0)}).</p>` : ''}
      <div class="botoes"><button type="button" class="btn btn-sec" data-acao="novo">+ Orçamento</button>
      <a class="btn btn-sec" href="#/orcamento/sugestoes">Sugestões pela mediana</a></div></section>
      <section class="cartao cartao-lista"><ul class="lista">${itens.map((it) => linha(e, it)).join('')}</ul></section>
      <p class="suave">Gasto = pago + previsto no mês. Toque num orçamento para mudar o valor ou encerrar.</p>`;
    return html;
  }

  /* ---------------- Sugestões ---------------- */

  /** Categorias de contas fixas (valor que não muda) e do repasse do acerto: orçamento serve
   *  melhor para o que varia, então elas vêm desmarcadas nas sugestões. */
  function categoriasFixas(e) {
    const s = new Set(R.ativos(e.recorrentes).filter((r) => r.ativa !== false && r.valor_esperado_centavos && !r.valor_estimado).map((r) => r.categoria_id));
    const regra = R.regraAcerto(e);
    if (regra && regra.categoria_repasse_id) s.add(regra.categoria_repasse_id);
    return s;
  }

  function sugestoes() {
    const e = App.estado;
    const mes = App.ui.mes;
    const fixas = categoriasFixas(e);
    const cats = R.ativos(e.categorias).filter((c) => c.tipo === 'despesa' && c.ativa !== false)
      .map((c) => ({ c, s: R.sugestaoOrcamento(e, 'categoria', c.id, mes, MESES_SUGESTAO), atual: vigente(e, 'categoria', c.id, mes) }))
      .filter((x) => x.s.valor > 0 || x.atual)
      .sort((a, b) => b.s.valor - a.s.valor);
    const grupos = R.ativos(e.grupos).filter((g) => R.ativos(e.categorias).some((c) => c.grupo_id === g.id && c.tipo === 'despesa'))
      .map((g) => ({ g, s: R.sugestaoOrcamento(e, 'grupo', g.id, mes, MESES_SUGESTAO), atual: vigente(e, 'grupo', g.id, mes) }))
      .filter((x) => x.s.valor > 0 || x.atual)
      .sort((a, b) => b.s.valor - a.s.valor);
    const linhaSug = (tipo, id, nome, s, atual) => `<tr>
      <td><label class="campo-check campo-check-tabela"><input type="checkbox" name="${tipo}:${esc(id)}"${!atual && s.valor > 0 && tipo === 'categoria' && !fixas.has(id) ? ' checked' : ''}> ${esc(nome)}${tipo === 'categoria' && fixas.has(id) ? ' <span class="suave">(fixa)</span>' : ''}</label></td>
      <td class="num">${$.brl(s.valor)}</td><td class="num col-op">${s.valores.length ? $.brl(Math.min(...s.valores)) + ' a ' + $.brl(Math.max(...s.valores)) : '—'}</td>
      <td class="num">${atual ? $.brl(atual.valor_centavos) : '—'}</td></tr>`;
    return `<p><a href="#/orcamento">‹ Voltar ao orçamento</a></p>
      <section class="cartao"><p>Sugestão para cada categoria: a <b>mediana</b> do gasto pago nos ${MESES_SUGESTAO} meses antes de ${esc(D.nomeMes(mes))}
        (meses sem gasto contam como zero). Marque o que quiser criar; o orçamento vale a partir de ${esc(D.nomeMes(mes))}.
        Contas fixas e o repasse vêm desmarcados: o valor delas não muda, então o orçamento só geraria aviso todo mês.</p>
      <div class="rolagem-x"><table class="tabela" id="tabela-sugestoes"><thead><tr><th>Categoria</th><th class="num">Sugestão</th><th class="num col-op">Faixa dos meses</th><th class="num">Atual</th></tr></thead>
      <tbody>${cats.map((x) => linhaSug('categoria', x.c.id, x.c.nome, x.s, x.atual)).join('')}</tbody></table></div>
      <h2 class="subtitulo">Por grupo (opcional)</h2>
      <div class="rolagem-x"><table class="tabela"><thead><tr><th>Grupo</th><th class="num">Sugestão</th><th class="num col-op">Faixa dos meses</th><th class="num">Atual</th></tr></thead>
      <tbody>${grupos.map((x) => linhaSug('grupo', x.g.id, x.g.nome, x.s, x.atual)).join('')}</tbody></table></div>
      <div class="botoes"><button type="button" class="btn btn-primario" data-acao="criar-marcados">Criar orçamentos marcados</button></div></section>`;
  }

  async function criarMarcados() {
    const e = App.estado;
    const mes = App.ui.mes;
    const marcados = [...document.querySelectorAll('#tela input[type="checkbox"]:checked')].map((el) => el.name.split(':'));
    if (!marcados.length) { App.toast('Marque pelo menos um item.'); return; }
    const mudancas = [];
    for (const [tipo, id] of marcados) {
      const s = R.sugestaoOrcamento(e, tipo, id, mes, MESES_SUGESTAO);
      if (!s.valor) continue;
      mudancas.push(...registrosNovoValor(e, tipo, id, s.valor, mes));
    }
    await App.salvar(mudancas, `Orçamentos criados pela sugestão (${marcados.length})`);
    App.toast(`${marcados.length} orçamento(s) criado(s).`, { acao: 'Desfazer', fn: async () => { await App.desfazer(); App.renderizar(true); } });
    App.navegar('#/orcamento');
  }

  /** Registros para o alvo passar a valer "valor" a partir de "desde", guardando o histórico. */
  function registrosNovoValor(e, tipo, id, valor, desde) {
    const out = [];
    const atual = vigente(e, tipo, id, desde);
    if (atual && atual.vigencia_inicio === desde) {
      out.push({ tabela: 'orcamentos', registro: Object.assign({}, atual, { valor_centavos: valor }) });
      return out;
    }
    if (atual) out.push({ tabela: 'orcamentos', registro: Object.assign({}, atual, { vigencia_fim: D.somarMeses(desde, -1) }) });
    // se houver orçamento futuro para o mesmo alvo, o novo vale até o mês anterior a ele
    const futuro = R.ativos(e.orcamentos).filter((o) => o.alvo_tipo === tipo && o.alvo_id === id && o.vigencia_inicio > desde)
      .sort((a, b) => (a.vigencia_inicio < b.vigencia_inicio ? -1 : 1))[0];
    out.push({ tabela: 'orcamentos', registro: { id: U.novoId('o'), alvo_tipo: tipo, alvo_id: id, valor_centavos: valor,
      vigencia_inicio: desde, vigencia_fim: futuro ? D.somarMeses(futuro.vigencia_inicio, -1) : null, origem: 'app' } });
    return out;
  }

  /* ---------------- Criar e editar ---------------- */

  async function editar(el) {
    const e = App.estado;
    const mes = App.ui.mes;
    const o = el && el.dataset.id ? e.orcamentos.find((x) => x.id === el.dataset.id) : null;
    const grupos = R.ativos(e.grupos).slice().sort((a, b) => (a.ordem || 0) - (b.ordem || 0));
    const sug = o ? R.sugestaoOrcamento(e, o.alvo_tipo, o.alvo_id, mes, MESES_SUGESTAO) : null;
    const html = o
      ? `<p><b>${esc(nomeAlvo(e, o))}</b> · vale desde ${esc(D.formatarMes(o.vigencia_inicio || mes))}</p>
        <p class="suave">Sugestão (mediana de ${MESES_SUGESTAO} meses): ${$.brl(sug.valor)}.</p>
        <label class="campo"><span>Valor mensal</span><input name="valor" inputmode="decimal" value="${esc($.formatarNumero(o.valor_centavos).replace(/\./g, ''))}" autofocus></label>
        <label class="campo"><span>Vale a partir de</span><input type="month" name="desde" value="${esc(mes)}"></label>
        <p class="dica">Os meses antes de "a partir de" continuam com o valor antigo.</p>`
      : `<label class="campo"><span>Orçamento de</span><select name="alvo"><optgroup label="Categorias">${R.ativos(e.categorias)
          .filter((c) => c.tipo === 'despesa' && c.ativa !== false).sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'))
          .map((c) => `<option value="categoria:${esc(c.id)}">${esc(c.nome)}</option>`).join('')}</optgroup>
          <optgroup label="Grupos">${grupos.map((g) => `<option value="grupo:${esc(g.id)}">Grupo ${esc(g.nome)}</option>`).join('')}</optgroup></select></label>
        <label class="campo"><span>Valor mensal (em branco = usar a sugestão pela mediana)</span><input name="valor" inputmode="decimal" placeholder="sugestão automática"></label>
        <label class="campo"><span>Vale a partir de</span><input type="month" name="desde" value="${esc(mes)}"></label>`;
    const botoes = [BTN_CANCELAR];
    if (o) botoes.push({ valor: 'encerrar', texto: 'Encerrar', classe: 'btn-perigo', semValidar: true });
    botoes.push({ valor: 'ok', texto: 'Salvar', classe: 'btn-primario' });
    const r = await App.dialogo({
      titulo: o ? 'Orçamento' : 'Novo orçamento', html, botoes,
      validar: (v) => {
        if (v.valor.trim() && !$.lerValor(v.valor).ok) return 'Valor: ' + $.lerValor(v.valor).erro;
        if (o && !v.valor.trim()) return 'Informe o valor.';
        if (!D.validarMes(v.desde)) return 'Escolha o mês.';
        return null;
      },
    });
    if (r.botao === 'encerrar') return encerrar(o);
    if (r.botao !== 'ok') return;
    const v = r.valores;
    const [tipo, id] = o ? [o.alvo_tipo, o.alvo_id] : v.alvo.split(':');
    let valor = v.valor.trim() ? $.lerValor(v.valor).total : R.sugestaoOrcamento(e, tipo, id, v.desde, MESES_SUGESTAO).valor;
    if (!valor) { App.toast('Sem gasto nos últimos meses para sugerir um valor. Digite o valor.'); return; }
    // editar para um mês igual ou anterior ao início: muda o próprio registro; depois dele: guarda o histórico
    const mudancas = o && (!o.vigencia_inicio || v.desde <= o.vigencia_inicio)
      ? [{ tabela: 'orcamentos', registro: Object.assign({}, o, { valor_centavos: valor, vigencia_inicio: v.desde }) }]
      : registrosNovoValor(e, tipo, id, valor, v.desde);
    await App.salvar(mudancas, `Orçamento de ${nomeAlvo(e, { alvo_tipo: tipo, alvo_id: id })}: ${$.brl(valor)}`);
    App.toast('Orçamento salvo.', { acao: 'Desfazer', fn: async () => { await App.desfazer(); App.renderizar(true); } });
    App.renderizar(true);
  }

  async function encerrar(o) {
    const e = App.estado;
    const mes = App.ui.mes;
    const ok = await App.confirmar('Encerrar orçamento', `${nomeAlvo(e, o)} deixa de ter orçamento a partir de ${D.nomeMes(mes)}. Os meses anteriores continuam como estão.`, 'Encerrar', true);
    if (!ok) return;
    const reg = (o.vigencia_inicio || mes) >= mes ? Object.assign({}, o, { excluido_em: U.agora() }) : Object.assign({}, o, { vigencia_fim: D.somarMeses(mes, -1) });
    await App.salvar([{ tabela: 'orcamentos', registro: reg }], `Orçamento de ${nomeAlvo(e, o)} encerrado`);
    App.toast('Orçamento encerrado.', { acao: 'Desfazer', fn: async () => { await App.desfazer(); App.renderizar(true); } });
    App.renderizar(true);
  }

  App.registrarTela('orcamento', {
    titulo: (p) => (p[0] === 'sugestoes' ? 'Sugestões de orçamento' : 'Orçamento'),
    render,
    acoes: { novo: () => editar(null), editar, 'criar-marcados': criarMarcados },
  }, { rotulo: 'Orçamento', icone: 'orcamento', ordem: 7, dica: 'Limites por categoria, com alerta em 80% e 100%' });
})();

/* ==== tela-contracheque.js ==== */
/* tela-contracheque.js — contracheque do mês (proventos, descontos, líquido, IR retido e alíquota
   efetiva) e a evolução mês a mês, com 13º, férias e retroativos marcados.
   "Alíquota efetiva" = IR retido ÷ bruto do mês: quanto do bruto foi para o IR de fato. Ela é menor
   que a alíquota da tabela, que vale só para a última faixa do salário. Não é orientação tributária. */
(function () {
  'use strict';
  const $ = FN.dinheiro;
  const D = FN.datas;
  const R = FN.regras;
  const U = FN.util;
  const G = FN.graficos;
  const esc = U.esc;
  const EVENTUAL = /13|natalina|f[ée]rias|retroativ|pontual|judicial|informad/i;   // verbas que não se repetem todo mês
  const BTN_CANCELAR = { valor: 'cancelar', texto: 'Cancelar', classe: 'btn-sec', semValidar: true };
  // categorias de receita que recebem o contracheque (as da migração; se não existirem, o cartão some)
  const RECEITA_LIQUIDO = 'salario-liquido';
  const RECEITA_BENEFICIOS = 'auxilio-alimentacao';

  function abas(atual) {
    return `<div class="chips abas" role="tablist">
      <a class="chip${atual === 'mes' ? ' ativo' : ''}" href="#/contracheque" role="tab" aria-selected="${atual === 'mes'}">Do mês</a>
      <a class="chip${atual === 'evolucao' ? ' ativo' : ''}" href="#/contracheque/evolucao" role="tab" aria-selected="${atual === 'evolucao'}">Evolução</a></div>`;
  }

  function marcas(e, mes) {
    const verbas = R.porId(e.verbas);
    const nomes = R.ativos(e.contracheque).filter((c) => c.mes_ref === mes).map((c) => (verbas.get(c.verba_id) || {}).nome || '');
    const m = [];
    if (nomes.some((n) => /13|natalina/i.test(n))) m.push('13º');
    if (nomes.some((n) => /f[ée]rias/i.test(n))) m.push('férias');
    if (nomes.some((n) => /retroativ/i.test(n))) m.push('retroativo');
    return m;
  }

  function tabelaVerbas(titulo, itens, total, classeTotal) {
    if (!itens.length) return '';
    return `<h3 class="subtitulo">${esc(titulo)}</h3><ul class="lista">${itens.map((it) => `<li><button type="button" class="linha linha-compacta" data-acao="editar-linha" data-id="${esc(it.id)}">
      <span class="linha-principal"><span class="linha-titulo">${esc(it.nome)}</span>${it.obs ? `<span class="linha-sub">${esc(it.obs)}</span>` : ''}</span>
      <span class="linha-valor">${$.brl(it.valor)}</span></button></li>`).join('')}
      ${total !== null ? `<li class="linha-total ${classeTotal || ''}"><span>Total</span><span class="linha-valor">${$.brl(total)}</span></li>` : ''}</ul>`;
  }

  function cartaoReceitas(e, mes, cc) {
    const cats = R.porId(e.categorias);
    if (!cats.has(RECEITA_LIQUIDO)) return '';
    const soma = (cat) => R.ativos(e.lancamentos).filter((x) => x.mes_ref === mes && x.tipo === 'receita' && x.categoria_id === cat);
    const linhaRec = (cat, rotulo, esperado) => {
      if (!cats.has(cat) || !esperado) return '';
      const ls = soma(cat);
      const lancado = ls.reduce((a, x) => a + x.valor_centavos, 0);
      let acao = '<span class="st st-pago"><span aria-hidden="true">✓</span> confere</span>';
      if (!ls.length) acao = `<button type="button" class="btn btn-mini btn-primario" data-acao="lancar-receita" data-cat="${esc(cat)}" data-valor="${esperado}">Lançar ${$.brl(esperado)}</button>`;
      else if (lancado !== esperado) {
        acao = ls.length === 1
          ? `<button type="button" class="btn btn-mini btn-sec" data-acao="ajustar-receita" data-id="${esc(ls[0].id)}" data-valor="${esperado}">Ajustar para ${$.brl(esperado)}</button>`
          : `<span class="texto-critico">diferente (${ls.length} lançamentos)</span>`;
      }
      return `<li><span>${esc(rotulo)}<br><span class="suave">contracheque ${$.brl(esperado)} · lançado ${ls.length ? $.brl(lancado) : 'nada'}</span></span><span>${acao}</span></li>`;
    };
    const linhas = linhaRec(RECEITA_LIQUIDO, R.nomeCategoria(e, RECEITA_LIQUIDO), cc.liquido) + linhaRec(RECEITA_BENEFICIOS, R.nomeCategoria(e, RECEITA_BENEFICIOS), cc.beneficios_total);
    if (!linhas) return '';
    return `<section class="cartao"><h2>Receitas do mês</h2><p class="suave">O que entrou na conta pelo contracheque, comparado com as receitas lançadas.</p>
      <ul class="lista-receitas">${linhas}</ul></section>`;
  }

  function doMes(e) {
    const mes = App.ui.mes;
    const cc = R.contracheque(e, mes);
    const meses = R.mesesContracheque(e);
    let html = UI.seletorMes(mes) + abas('mes');
    if (!cc.linhas) {
      const anterior = meses.filter((m) => m < mes).pop();
      const ultimo = meses[meses.length - 1];
      return html + `<section class="cartao vazio"><p>Sem contracheque em ${esc(D.nomeMes(mes))}.</p><div class="botoes centro-botoes">
        ${anterior ? `<button type="button" class="btn btn-primario" data-acao="copiar" data-de="${esc(anterior)}">Copiar de ${esc(D.formatarMes(anterior))}</button>` : ''}
        <button type="button" class="btn btn-sec" data-acao="nova-linha">Adicionar verba</button>
        ${ultimo && ultimo !== mes ? `<button type="button" class="btn btn-sec" data-acao="ir-mes" data-mes="${esc(ultimo)}">Ver o último (${esc(D.formatarMes(ultimo))})</button>` : ''}</div></section>`;
    }
    const m = marcas(e, mes);
    html += `${m.length ? `<p class="marcas">${m.map((x) => `<span class="st st-previsto">${esc(x)}</span>`).join(' ')}</p>` : ''}
      <section class="kpis" aria-label="Contracheque do mês">
        ${UI.kpi('Bruto', $.brl(cc.bruto), `${cc.proventos.length} provento(s)`)}
        ${UI.kpi('Descontos', $.brl(cc.descontos_total), cc.bruto ? `${$.pct(cc.descontos_total / cc.bruto * 100)} do bruto` : '')}
        ${UI.kpi('Líquido', $.brl(cc.liquido), cc.beneficios_total ? `+ ${$.brl(cc.beneficios_total)} fora do bruto = ${$.brl(cc.receita)} recebidos` : '', 'kpi-heroi')}
      </section>
      <section class="cartao"><h2>Imposto de renda</h2>
        <p>IR retido: <b>${$.brl(cc.ir)}</b> · alíquota efetiva <b>${cc.aliquota_ir === null ? '—' : $.pct(cc.aliquota_ir)}</b> do bruto</p>
        <p class="suave">Base do IR calculada: ${$.brl(cc.base_ir)}${cc.base_ir_planilha !== null && cc.base_ir_planilha !== cc.base_ir ? ` (na planilha: ${$.brl(cc.base_ir_planilha)})` : ''}.
        Alíquota efetiva = IR retido ÷ bruto; a da tabela vale só para a última faixa do salário.</p></section>
      <section class="cartao cartao-lista contracheque">
        ${tabelaVerbas('Proventos (entram no bruto)', cc.proventos, cc.bruto)}
        ${tabelaVerbas('Benefícios (fora do bruto)', cc.beneficios, cc.beneficios_total)}
        ${tabelaVerbas('Descontos', cc.descontos, cc.descontos_total, 'total-desconto')}
        ${tabelaVerbas('Informativos (não somam)', cc.informativos, null)}
        <div class="botoes rodape-cartao"><button type="button" class="btn btn-sec" data-acao="nova-linha">+ Verba neste mês</button></div>
      </section>
      ${cartaoReceitas(e, mes, cc)}`;
    return html;
  }

  function evolucao(e) {
    const meses = R.mesesContracheque(e);
    let html = abas('evolucao');
    if (!meses.length) return html + UI.vazio('Nenhum contracheque registrado.');
    const ultimos = meses.slice(-24);
    const ccs = ultimos.map((m) => R.contracheque(e, m));
    const opc = {
      id: 'contracheque', rotulos: ultimos.map((m) => D.formatarMes(m).replace(/\/20/, '/')), rotulosLongos: ultimos.map((m) => D.formatarMes(m)),
      series: [{ nome: 'Bruto', valores: ccs.map((c) => c.bruto) }, { nome: 'Líquido', valores: ccs.map((c) => c.liquido) }, { nome: 'IR retido', valores: ccs.map((c) => c.ir) }],
      descricao: 'Bruto, líquido e IR retido por mês',
      extraLeitura: (i) => (ccs[i].aliquota_ir === null ? '' : ` · alíquota efetiva ${$.pct(ccs[i].aliquota_ir)}`) + (marcas(e, ultimos[i]).length ? ` · ${marcas(e, ultimos[i]).join(', ')}` : ''),
    };
    html += `<section class="cartao"><h2>Mês a mês</h2>${G.linhas(opc)}</section>`;
    // por ano: soma do bruto e do IR e alíquota efetiva do ano
    const anos = [...new Set(meses.map((m) => m.slice(0, 4)))];
    const porAno = anos.map((a) => {
      const cs = meses.filter((m) => m.startsWith(a)).map((m) => R.contracheque(e, m));
      const b = cs.reduce((s, c) => s + c.bruto, 0);
      const ir = cs.reduce((s, c) => s + c.ir, 0);
      return { ano: a, meses: cs.length, bruto: b, ir, liquido: cs.reduce((s, c) => s + c.liquido, 0), aliq: b ? ir / b * 100 : null };
    });
    html += `<section class="cartao"><h2>Por ano</h2><div class="rolagem-x"><table class="tabela"><thead><tr><th>Ano</th><th class="num">Meses</th><th class="num">Bruto</th><th class="num">IR retido</th><th class="num">Alíq. efetiva</th><th class="num col-op">Líquido</th></tr></thead>
      <tbody>${porAno.map((x) => `<tr><td>${esc(x.ano)}</td><td class="num">${x.meses}</td><td class="num">${$.brl(x.bruto)}</td><td class="num">${$.brl(x.ir)}</td><td class="num">${x.aliq === null ? '—' : $.pct(x.aliq)}</td><td class="num col-op">${$.brl(x.liquido)}</td></tr>`).join('')}</tbody></table></div>
      <p class="suave">Para a declaração do IR, use o informe de rendimentos oficial; esta tabela serve para conferência.</p></section>`;
    html += `<section class="cartao"><h2>Todos os meses</h2><div class="rolagem-x"><table class="tabela"><thead><tr><th>Mês</th><th class="num">Bruto</th><th class="num col-op">Descontos</th><th class="num">Líquido</th><th class="num">IR</th><th class="num col-op">Alíq.</th><th>Marcas</th></tr></thead>
      <tbody>${meses.slice().reverse().map((m) => { const c = R.contracheque(e, m); return `<tr><td><button type="button" class="btn-link" data-acao="ir-mes" data-mes="${esc(m)}">${esc(D.formatarMes(m))}</button></td>
        <td class="num">${$.brl(c.bruto)}</td><td class="num col-op">${$.brl(c.descontos_total)}</td><td class="num">${$.brl(c.liquido)}</td><td class="num">${$.brl(c.ir)}</td>
        <td class="num col-op">${c.aliquota_ir === null ? '—' : $.pct(c.aliquota_ir)}</td><td>${esc(marcas(e, m).join(', '))}</td></tr>`; }).join('')}</tbody></table></div></section>`;
    return html;
  }

  function render(params) {
    const e = App.estado;
    return params[0] === 'evolucao' ? evolucao(e) : doMes(e);
  }

  /* ---------------- Edição ---------------- */

  function opcoesVerbas(e, sel) {
    const vs = R.ativos(e.verbas).filter((v) => v.ativa !== false || v.id === sel);
    const grupo = (tipo, rotulo) => {
      const l = vs.filter((v) => v.tipo === tipo).sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
      return l.length ? `<optgroup label="${rotulo}">${l.map((v) => `<option value="${esc(v.id)}"${v.id === sel ? ' selected' : ''}>${esc(v.nome)}</option>`).join('')}</optgroup>` : '';
    };
    return grupo('provento', 'Proventos e benefícios') + grupo('desconto', 'Descontos') + grupo('informativo', 'Informativos') + '<option value="__nova">Outra verba (criar)…</option>';
  }

  async function novaVerba() {
    const e = App.estado;
    const r = await App.dialogo({
      titulo: 'Nova verba',
      html: `<label class="campo"><span>Nome</span><input name="nome" maxlength="60" autofocus></label>
        <label class="campo"><span>Tipo</span><select name="tipo">${UI.opcoes([{ valor: 'provento', texto: 'Provento' }, { valor: 'desconto', texto: 'Desconto' }, { valor: 'informativo', texto: 'Informativo (não soma)' }], 'provento')}</select></label>
        <label class="campo-check"><input type="checkbox" name="bruto" checked> Provento que entra no bruto (desmarque para benefícios como auxílio-alimentação)</label>
        <label class="campo-check"><input type="checkbox" name="ir"> É imposto de renda retido</label>`,
      botoes: [BTN_CANCELAR, { valor: 'ok', texto: 'Criar', classe: 'btn-primario' }],
      validar: (v) => (v.nome.trim() ? null : 'Dê um nome à verba.'),
    });
    if (r.botao !== 'ok') return null;
    const v = r.valores;
    const base = U.normalizar(v.nome).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'verba';
    let id = base;
    for (let i = 2; e.verbas.some((x) => x.id === id); i++) id = base + '-' + i;
    const verba = { id, nome: v.nome.trim(), tipo: v.tipo, entra_no_bruto: v.tipo === 'provento' && !!v.bruto, ativa: true, grupo: v.tipo === 'desconto' && v.ir ? 'ir' : null, origem: 'app' };
    await App.salvar([{ tabela: 'verbas', registro: verba }], `Nova verba: ${verba.nome}`);
    return verba.id;
  }

  async function editarLinha(el) {
    const e = App.estado;
    const mes = App.ui.mes;
    const linha = el && el.dataset.id ? e.contracheque.find((c) => c.id === el.dataset.id) : null;
    const r = await App.dialogo({
      titulo: linha ? 'Verba do contracheque' : `Verba em ${D.formatarMes(mes)}`,
      html: `<label class="campo"><span>Verba</span><select name="verba"${linha ? ' disabled' : ''}>${opcoesVerbas(e, linha ? linha.verba_id : '')}</select></label>
        <label class="campo"><span>Valor</span><input name="valor" inputmode="decimal" placeholder="0,00" value="${linha ? esc($.formatarNumero(linha.valor_centavos).replace(/\./g, '')) : ''}" autofocus></label>
        <label class="campo"><span>Observação (opcional)</span><input name="obs" maxlength="120" value="${esc(linha && linha.obs ? linha.obs : '')}"></label>`,
      botoes: [BTN_CANCELAR].concat(linha ? [{ valor: 'excluir', texto: 'Excluir', classe: 'btn-perigo', semValidar: true }] : [], [{ valor: 'ok', texto: 'Salvar', classe: 'btn-primario' }]),
      validar: (v) => {
        if (!linha && !v.verba) return 'Escolha a verba.';
        if (v.verba === '__nova') return null;
        const lv = $.lerValor(v.valor);
        return lv.ok ? null : 'Valor: ' + lv.erro;
      },
    });
    if (r.botao === 'excluir') {
      await App.excluir('contracheque', [linha], `Verba excluída do contracheque de ${D.formatarMes(linha.mes_ref)}`);
      App.toast('Verba excluída.', { acao: 'Desfazer', fn: async () => { await App.desfazer(); App.renderizar(true); } });
      App.renderizar(true);
      return;
    }
    if (r.botao !== 'ok') return;
    let verbaId = linha ? linha.verba_id : r.valores.verba;
    if (verbaId === '__nova') {
      verbaId = await novaVerba();
      if (!verbaId) return;
      App.renderizar(true);
      return editarLinha({ dataset: {} });
    }
    const reg = Object.assign({}, linha || { id: U.novoId('cc'), mes_ref: mes, verba_id: verbaId, origem: 'app' },
      { valor_centavos: $.lerValor(r.valores.valor).total, obs: r.valores.obs.trim() || null });
    await App.salvar([{ tabela: 'contracheque', registro: reg }], `Contracheque de ${D.formatarMes(reg.mes_ref)}: ${R.porId(e.verbas).get(verbaId).nome}`);
    App.renderizar(true);
  }

  async function copiar(el) {
    const e = App.estado;
    const de = el.dataset.de;
    const mes = App.ui.mes;
    const verbas = R.porId(e.verbas);
    const linhas = R.ativos(e.contracheque).filter((c) => c.mes_ref === de);
    const r = await App.dialogo({
      titulo: `Copiar de ${D.formatarMes(de)}`,
      html: `<p class="suave">Marque as verbas que se repetem. Depois confira os valores com o contracheque de ${esc(D.nomeMes(mes))}.</p>
        ${linhas.map((c) => { const v = verbas.get(c.verba_id) || { nome: c.verba_id }; return `<label class="campo-check"><input type="checkbox" name="${esc(c.id)}"${EVENTUAL.test(v.nome) ? '' : ' checked'}> ${esc(v.nome)} · ${$.brl(c.valor_centavos)}</label>`; }).join('')}`,
      botoes: [BTN_CANCELAR, { valor: 'ok', texto: 'Copiar', classe: 'btn-primario' }],
    });
    if (r.botao !== 'ok') return;
    const novos = linhas.filter((c) => r.valores[c.id]).map((c) => ({ tabela: 'contracheque', registro: {
      id: U.novoId('cc'), mes_ref: mes, verba_id: c.verba_id, valor_centavos: c.valor_centavos, obs: null, origem: `app (cópia de ${de})` } }));
    if (!novos.length) return;
    await App.salvar(novos, `Contracheque de ${D.formatarMes(mes)} copiado de ${D.formatarMes(de)}`);
    App.toast(`${novos.length} verba(s) copiada(s). Confira os valores.`, { acao: 'Desfazer', fn: async () => { await App.desfazer(); App.renderizar(true); } });
    App.renderizar(true);
  }

  async function lancarReceita(el) {
    const mes = App.ui.mes;
    const valor = Number(el.dataset.valor);
    await App.salvar([{ tabela: 'lancamentos', registro: {
      id: U.novoId('l'), tipo: 'receita', mes_ref: mes, data: null, data_compra: null, valor_centavos: valor, categoria_id: el.dataset.cat,
      conta_id: null, status: mes <= D.mesAtual() ? 'pago' : 'previsto', descricao: null, grupo_entrada_id: null, parcela_num: null, parcela_total: null,
      compra_parcelada_id: null, recorrente_id: null, pessoa: null, desconta_repasse: false, obs: 'Valor do contracheque do mês.', origem: 'app (contracheque)' } }],
      `Receita de ${D.formatarMes(mes)} pelo contracheque`);
    App.toast(`Receita de ${$.brl(valor)} lançada.`, { acao: 'Desfazer', fn: async () => { await App.desfazer(); App.renderizar(true); } });
    App.renderizar(true);
  }

  async function ajustarReceita(el) {
    const x = App.estado.lancamentos.find((l) => l.id === el.dataset.id);
    if (!x) return;
    const valor = Number(el.dataset.valor);
    await App.salvar([{ tabela: 'lancamentos', registro: Object.assign({}, x, { valor_centavos: valor }) }], `Receita ajustada para ${$.brl(valor)}`);
    App.toast('Receita ajustada.', { acao: 'Desfazer', fn: async () => { await App.desfazer(); App.renderizar(true); } });
    App.renderizar(true);
  }

  App.registrarTela('contracheque', {
    titulo: 'Contracheque', render, redimensionar: true,
    acoes: {
      'editar-linha': editarLinha, 'nova-linha': () => editarLinha(null), copiar,
      'lancar-receita': lancarReceita, 'ajustar-receita': ajustarReceita,
      'ir-mes': (el) => { App.ui.mes = el.dataset.mes; App.navegar('#/contracheque'); },
    },
  }, { rotulo: 'Contracheque', icone: 'contracheque', ordem: 8, dica: 'Bruto, descontos, líquido e IR mês a mês' });
})();

/* ==== tela-relatorios.js ==== */
/* tela-relatorios.js — evolução de receitas e despesas, comparação entre anos (inclusive no mesmo
   período do ano), ranking de categorias e grupos e mapa de calor (meses × categorias: quanto mais
   forte o azul, maior o gasto). Todo gráfico tem "Ver como tabela" e leitura por toque.
   Meses futuros (só com previstos) ficam de fora; o mês atual aparece marcado como "em andamento". */
(function () {
  'use strict';
  const $ = FN.dinheiro;
  const D = FN.datas;
  const R = FN.regras;
  const U = FN.util;
  const G = FN.graficos;
  const esc = U.esc;
  const ABAS = [{ valor: 'evolucao', texto: 'Evolução' }, { valor: 'anos', texto: 'Anos' }, { valor: 'ranking', texto: 'Ranking' }, { valor: 'calor', texto: 'Mapa de calor' }];

  function rotuloCurto(m) { return D.formatarMes(m).replace('/20', '/'); }   // "set/26"

  /** Meses do período, do início do histórico até o mês atual. */
  function mesesDoPeriodo(e, periodo) {
    const fim = D.mesAtual();
    const ini = R.inicioHistorico(e);
    let desde;
    if (periodo === '24m') desde = D.somarMeses(fim, -23);
    else if (periodo === 'tudo') desde = ini;
    else if (periodo === 'ano') desde = fim.slice(0, 4) + '-01';
    else if (periodo === 'ano-passado') return D.listaMeses(String(Number(fim.slice(0, 4)) - 1) + '-01', String(Number(fim.slice(0, 4)) - 1) + '-12').filter((m) => m >= ini);
    else desde = D.somarMeses(fim, -11);
    if (desde < ini) desde = ini;
    return D.listaMeses(desde, fim);
  }

  /* ---------------- Evolução ---------------- */
  function evolucao(e) {
    const per = App.ui.relPeriodo || '12m';
    const meses = mesesDoPeriodo(e, per);
    const rs = meses.map((m) => R.resumoMes(e, m));
    const atual = D.mesAtual();
    const rotulos = meses.map((m) => rotuloCurto(m) + (m === atual ? '*' : ''));
    const longos = meses.map((m) => D.formatarMes(m) + (m === atual ? ' (em andamento)' : ''));
    const tot = (k) => rs.reduce((a, r) => a + r[k], 0);
    const rec = tot('receitas_total');
    const desp = tot('despesas');
    const saldo = tot('saldo');
    let html = UI.chipsEscolha('rel-periodo', [{ valor: '12m', texto: '12 meses' }, { valor: '24m', texto: '24 meses' }, { valor: 'tudo', texto: 'Tudo' }], per, 'Período');
    html += `<section class="cartao"><p>De ${esc(D.formatarMes(meses[0]))} a ${esc(D.formatarMes(meses[meses.length - 1]))}: receitas <b>${$.brl(rec)}</b>, despesas <b>${$.brl(desp)}</b>,
      sobrou <b>${$.brl(saldo)}</b>${rec ? ` (${$.pct(saldo / rec * 100)} da receita)` : ''}. Média mensal de despesas: ${$.brl(Math.round(desp / Math.max(1, meses.length)))}.</p></section>`;
    const g1 = { id: 'rel-evolucao', rotulos, rotulosLongos: longos, descricao: 'Receitas e despesas por mês',
      series: [{ nome: 'Receitas', valores: rs.map((r) => r.receitas_total) }, { nome: 'Despesas', valores: rs.map((r) => r.despesas), cor: G.CORES[1] }] };
    const g2 = { id: 'rel-saldo', rotulos, rotulosLongos: longos, descricao: 'Quanto sobrou por mês',
      series: [{ nome: 'Sobrou', valores: rs.map((r) => r.saldo), cor: G.CORES[2], corNegativo: '#d03b3b' }],
      extraLeitura: (i) => (rs[i].sobra_pct === null ? '' : ` (${$.pct(rs[i].sobra_pct)} da receita)`) };
    html += `<section class="cartao"><h2>Receitas e despesas</h2>${G.barras(g1)}${G.tabela(g1)}</section>
      <section class="cartao"><h2>Quanto sobrou</h2>${G.barras(g2)}${G.tabela(g2)}
      <p class="suave">Barras abaixo da linha do zero (em vermelho) são meses em que saiu mais do que entrou. * mês em andamento.</p></section>`;
    return html;
  }

  /* ---------------- Anos ---------------- */
  function anos(e) {
    const atual = D.mesAtual();
    const ini = R.inicioHistorico(e);
    const listaAnos = [];
    for (let a = Number(ini.slice(0, 4)); a <= Number(atual.slice(0, 4)); a++) listaAnos.push(String(a));
    const linhasAno = listaAnos.map((a) => {
      const meses = D.listaMeses(a + '-01', a + '-12').filter((m) => m >= ini && m <= atual);
      const rs = meses.map((m) => R.resumoMes(e, m));
      const s = (k) => rs.reduce((x, r) => x + r[k], 0);
      return { ano: a, meses: meses.length, rec: s('receitas_total'), desp: s('despesas'), saldo: s('saldo') };
    });
    let html = `<section class="cartao"><h2>Por ano</h2><div class="rolagem-x"><table class="tabela"><thead><tr><th>Ano</th><th class="num">Meses</th><th class="num">Receitas</th><th class="num">Despesas</th><th class="num">Sobrou</th><th class="num col-op">% sobra</th><th class="num col-op">Despesa/mês</th></tr></thead>
      <tbody>${linhasAno.map((x) => `<tr><td>${esc(x.ano)}${x.meses < 12 ? '*' : ''}</td><td class="num">${x.meses}</td><td class="num">${$.brl(x.rec)}</td><td class="num">${$.brl(x.desp)}</td>
        <td class="num">${$.brl(x.saldo)}</td><td class="num col-op">${x.rec ? $.pct(x.saldo / x.rec * 100) : '—'}</td><td class="num col-op">${$.brl(Math.round(x.desp / Math.max(1, x.meses)))}</td></tr>`).join('')}</tbody></table></div>
      <p class="suave">* ano incompleto (o histórico começa em ${esc(D.formatarMes(ini))}; o ano atual vai até ${esc(D.formatarMes(atual))}). Compare pela despesa média por mês.</p></section>`;
    // mesmo período: jan até o mês atual, este ano × ano passado
    const anoAt = atual.slice(0, 4);
    const anoAnt = String(Number(anoAt) - 1);
    const mmAt = D.listaMeses(anoAt + '-01', atual);
    const mmAnt = mmAt.map((m) => anoAnt + m.slice(4));
    if (mmAnt.every((m) => m >= ini)) {
      const soma = (ms, k) => ms.reduce((x, m) => x + R.resumoMes(e, m)[k], 0);
      const lin = (rot, k, ruim) => `<tr><td>${rot}</td><td class="num">${$.brl(soma(mmAnt, k))}</td><td class="num">${$.brl(soma(mmAt, k))}</td>
        <td class="num">${UI.delta(soma(mmAt, k), soma(mmAnt, k), ruim, '')}</td></tr>`;
      html += `<section class="cartao"><h2>Mesmo período: jan a ${esc(D.ABREV[Number(atual.slice(5)) - 1])}</h2><div class="rolagem-x"><table class="tabela tabela-comparacao">
        <thead><tr><th></th><th class="num">${anoAnt}</th><th class="num">${anoAt}</th><th class="num">Diferença</th></tr></thead>
        <tbody>${lin('Receitas', 'receitas_total', false)}${lin('Despesas', 'despesas', true)}${lin('Sobrou', 'saldo', false)}</tbody></table></div>
        <p class="suave">O mês atual está em andamento.</p></section>`;
    }
    // despesas mês a mês, uma linha por ano (até 3 anos)
    const ultimos = listaAnos.slice(-3);
    const g = { id: 'rel-anos', rotulos: D.ABREV.slice(), rotulosLongos: D.MESES.map((m) => m.charAt(0).toUpperCase() + m.slice(1)), descricao: 'Despesas por mês, um traço por ano',
      series: ultimos.map((a, i) => ({ nome: a, cor: G.CORES[i], valores: D.ABREV.map((_, k) => { const m = `${a}-${D.pad(k + 1)}`; return m < ini || m > atual ? null : R.resumoMes(e, m).despesas; }) })) };
    html += `<section class="cartao"><h2>Despesas mês a mês, por ano</h2>${G.linhas(g)}${G.tabela(g, 'Mês')}</section>`;
    return html;
  }

  /* ---------------- Ranking ---------------- */
  function ranking(e) {
    const per = App.ui.rankPeriodo || '12m';
    const modo = App.ui.rankModo || 'categoria';
    const meses = mesesDoPeriodo(e, per);
    const itens = modo === 'grupo' ? R.totaisPorGrupo(e, meses) : R.totaisPorCategoria(e, meses);
    const total = itens.reduce((a, x) => a + x.valor, 0);
    const max = itens.length ? itens[0].valor : 0;
    const mostrar = App.ui.rankTudo ? itens : itens.slice(0, 15);
    let html = UI.chipsEscolha('rank-periodo', [{ valor: '12m', texto: '12 meses' }, { valor: 'ano', texto: 'Este ano' }, { valor: 'ano-passado', texto: 'Ano passado' }, { valor: 'tudo', texto: 'Tudo' }], per, 'Período')
      + UI.chipsEscolha('rank-modo', [{ valor: 'categoria', texto: 'Categorias' }, { valor: 'grupo', texto: 'Grupos' }], modo, 'Agrupar por');
    if (!itens.length) return html + UI.vazio('Sem despesas no período.');
    html += `<section class="cartao"><p class="suave">${esc(D.formatarMes(meses[0]))} a ${esc(D.formatarMes(meses[meses.length - 1]))} · ${meses.length} meses · total ${$.brl(total)}</p>
      <ol class="barras ranking">${mostrar.map((x, i) => {
        const nome = modo === 'grupo' ? R.nomeGrupo(e, x.id) : R.nomeCategoria(e, x.id);
        const extra = modo === 'grupo' ? '' : R.nomeGrupo(e, (R.categoria(e, x.id) || {}).grupo_id);
        const link = modo === 'grupo' ? '' : ` href="#/historico/${esc(meses[meses.length - 1])}/${esc(x.id)}"`;
        return `<li class="barra-linha"><a${link}><span class="barra-rotulo">${i + 1}. ${esc(nome)} ${extra ? `<span class="suave">${esc(extra)}</span>` : ''}</span>
          <span class="barra-valor">${$.brl(x.valor)} <span class="suave">${$.pct(x.valor / total * 100, 0)}</span></span>
          ${UI.barra(max ? x.valor / max * 100 : 0)}<span class="barra-sub suave">média ${$.brl(Math.round(x.valor / meses.length))}/mês</span></a></li>`;
      }).join('')}</ol>
      ${itens.length > mostrar.length ? `<button type="button" class="btn btn-sec" data-acao="rank-tudo">Mostrar todas (${itens.length})</button>` : ''}</section>`;
    return html;
  }

  /* ---------------- Mapa de calor ---------------- */
  function calor(e) {
    const per = App.ui.calorPeriodo || '12m';
    const modo = App.ui.calorModo || 'linha';
    const meses = mesesDoPeriodo(e, per === '24m' ? '24m' : '12m');
    const cats = R.totaisPorCategoria(e, meses).filter((x) => x.valor > 0);
    let html = UI.chipsEscolha('calor-periodo', [{ valor: '12m', texto: '12 meses' }, { valor: '24m', texto: '24 meses' }], per, 'Período')
      + UI.chipsEscolha('calor-modo', [{ valor: 'linha', texto: 'Cor por categoria' }, { valor: 'tabela', texto: 'Cor na tabela toda' }], modo, 'Como colorir');
    if (!cats.length) return html + UI.vazio('Sem despesas no período.');
    const valores = new Map();
    for (const x of R.ativos(e.lancamentos)) {
      if (x.tipo !== 'despesa') continue;
      const k = x.categoria_id + '|' + x.mes_ref;
      valores.set(k, (valores.get(k) || 0) + x.valor_centavos);
    }
    const maxTabela = Math.max(...cats.flatMap((c) => meses.map((m) => valores.get(c.id + '|' + m) || 0)));
    html += `<section class="cartao"><p class="suave">${modo === 'linha' ? 'Cada linha tem a sua escala: o azul mais forte é o mês em que aquela categoria mais pesou.' : 'Uma escala só para a tabela toda: o azul mais forte é o maior gasto de todos.'}
      Valores em reais (mil = milhares). Toque no nome para ver os lançamentos.</p>
      <div class="rolagem-x mapa-calor-caixa"><table class="tabela mapa-calor"><thead><tr><th class="fixa">Categoria</th>${meses.map((m) => `<th class="num">${esc(rotuloCurto(m))}</th>`).join('')}<th class="num">Total</th></tr></thead><tbody>
      ${cats.map((c) => {
        const vs = meses.map((m) => valores.get(c.id + '|' + m) || 0);
        const maxLinha = Math.max(...vs);
