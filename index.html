  function celula(ref, valor, tipo) {
    if (valor === null || valor === undefined || valor === '') return '';
    if (tipo === 'moeda' || tipo === 'pct' || tipo === 'inteiro' || (typeof valor === 'number' && tipo !== 'texto')) {
      if (typeof valor !== 'number' || !Number.isFinite(valor)) return '';
      const s = tipo === 'moeda' ? ESTILO.moeda : tipo === 'pct' ? ESTILO.pct : tipo === 'inteiro' ? ESTILO.inteiro : 0;
      return `<c r="${ref}"${s ? ` s="${s}"` : ''}><v>${valor}</v></c>`;
    }
    const t = String(valor);
    const esp = /^\s|\s$/.test(t) ? ' xml:space="preserve"' : '';
    return `<c r="${ref}" t="inlineStr"><is><t${esp}>${xmlEsc(t)}</t></is></c>`;
  }

  function planilhaXml(aba) {
    const cols = aba.colunas;
    const linhas = aba.linhas;
    let x = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">';
    x += '<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>';
    x += '<cols>' + cols.map((c, i) => `<col min="${i + 1}" max="${i + 1}" width="${c.largura || 14}" customWidth="1"/>`).join('') + '</cols>';
    x += '<sheetData>';
    x += '<row r="1">' + cols.map((c, i) => `<c r="${colunaLetra(i)}1" t="inlineStr" s="${ESTILO.cabecalho}"><is><t>${xmlEsc(c.titulo)}</t></is></c>`).join('') + '</row>';
    linhas.forEach((ln, j) => {
      const r = j + 2;
      x += `<row r="${r}">` + cols.map((c, i) => celula(colunaLetra(i) + r, ln[i], c.tipo)).join('') + '</row>';
    });
    x += '</sheetData>';
    if (linhas.length) x += `<autoFilter ref="A1:${colunaLetra(cols.length - 1)}${linhas.length + 1}"/>`;
    x += '</worksheet>';
    return x;
  }

  function nomeAba(nome, usados) {
    let n = String(nome).replace(/[\[\]:*?/\\]/g, ' ').slice(0, 31) || 'Aba';
    let k = 2;
    const base = n;
    while (usados.has(n)) n = base.slice(0, 28) + ' ' + (k++);
    usados.add(n);
    return n;
  }

  /** abas: [{nome, colunas:[{titulo, largura, tipo:'texto'|'moeda'|'pct'|'inteiro'|'numero'}], linhas:[[...]]}]
   *  Valores de moeda vão em reais (número); porcentagem como fração (0,125 = 12,5%). Devolve Uint8Array. */
  function gerar(abas) {
    const enc = new TextEncoder();
    const usados = new Set();
    const nomes = abas.map((a) => nomeAba(a.nome, usados));
    const arquivos = [];
    const ct = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
      + '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
      + '<Default Extension="xml" ContentType="application/xml"/>'
      + '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'
      + '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'
      + abas.map((a, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')
      + '</Types>';
    arquivos.push({ nome: '[Content_Types].xml', bytes: enc.encode(ct) });
    arquivos.push({ nome: '_rels/.rels', bytes: enc.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>') });
    const wb = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'
      + nomes.map((n, i) => `<sheet name="${xmlEsc(n)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('') + '</sheets></workbook>';
    arquivos.push({ nome: 'xl/workbook.xml', bytes: enc.encode(wb) });
    const rels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
      + abas.map((a, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('')
      + `<Relationship Id="rId${abas.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`;
    arquivos.push({ nome: 'xl/_rels/workbook.xml.rels', bytes: enc.encode(rels) });
    const estilos = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
      + '<numFmts count="2"><numFmt numFmtId="164" formatCode="&quot;R$&quot;\\ #,##0.00;\\-&quot;R$&quot;\\ #,##0.00"/><numFmt numFmtId="165" formatCode="0.0%"/></numFmts>'
      + '<fonts count="2"><font><sz val="10"/><name val="Arial"/><family val="2"/></font><font><b/><sz val="10"/><name val="Arial"/><family val="2"/></font></fonts>'
      + '<fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills>'
      + '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>'
      + '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'
      + '<cellXfs count="5"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>'
      + '<xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/>'
      + '<xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>'
      + '<xf numFmtId="165" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>'
      + '<xf numFmtId="1" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs>'
      + '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>';
    arquivos.push({ nome: 'xl/styles.xml', bytes: enc.encode(estilos) });
    abas.forEach((a, i) => arquivos.push({ nome: `xl/worksheets/sheet${i + 1}.xml`, bytes: enc.encode(planilhaXml(a)) }));
    return zip(arquivos);
  }

  /** CSV com ";" e vírgula decimal (abre direto no Excel em português), com BOM para acentos. */
  function csv(colunas, linhas) {
    const q = (v) => {
      if (v === null || v === undefined) return '';
      const s = String(v);
      return /[";\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    const fmt = (v, tipo) => {
      if (v === null || v === undefined || v === '') return '';
      if (tipo === 'moeda' && typeof v === 'number') return v.toFixed(2).replace('.', ',');
      if (tipo === 'pct' && typeof v === 'number') return (v * 100).toFixed(1).replace('.', ',');
      return v;
    };
    const cab = colunas.map((c) => q(c.titulo)).join(';');
    const corpo = linhas.map((l) => colunas.map((c, i) => q(fmt(l[i], c.tipo))).join(';'));
    return '﻿' + [cab].concat(corpo).join('\r\n') + '\r\n';
  }

  return { crc32, zip, gerar, csv, colunaLetra };
})();

/* ==== espelho.js ==== */
/* espelho.js — monta o Excel "espelho" (e o CSV) a partir dos dados do app.
   É só de ida: serve para analisar no Excel ou mandar para a Claude; o backup de verdade é o .json. */
var FN = (typeof globalThis !== 'undefined' ? globalThis : window).FN || {};
(typeof globalThis !== 'undefined' ? globalThis : window).FN = FN;

FN.espelho = (function () {
  'use strict';
  const R = FN.regras;
  const D = FN.datas;
  const reais = (c) => (c == null ? null : c / 100);

  const COLS_LANC = [
    { titulo: 'Mês ref.', largura: 10 }, { titulo: 'Data', largura: 11 }, { titulo: 'Tipo', largura: 16 },
    { titulo: 'Grupo', largura: 20 }, { titulo: 'Categoria', largura: 28 }, { titulo: 'Descrição', largura: 32 },
    { titulo: 'Valor', largura: 13, tipo: 'moeda' }, { titulo: 'Forma de pagamento', largura: 22 },
    { titulo: 'Status', largura: 10 }, { titulo: 'Parcela', largura: 8 }, { titulo: 'Pessoa', largura: 10 },
    { titulo: 'Observação', largura: 50 }, { titulo: 'Origem', largura: 32 }, { titulo: 'ID', largura: 18 },
  ];

  function linhasLancamentos(estado) {
    const cats = R.porId(estado.categorias);
    return R.ativos(estado.lancamentos).slice()
      .sort((a, b) => (a.mes_ref + (a.data || '') + a.id < b.mes_ref + (b.data || '') + b.id ? -1 : 1))
      .map((x) => {
        const c = cats.get(x.categoria_id) || {};
        return [x.mes_ref, x.data ? D.formatarData(x.data) : '', R.TIPO_NOME[x.tipo] || x.tipo, R.nomeGrupo(estado, c.grupo_id),
          c.nome || x.categoria_id || '', x.descricao || '', reais(x.valor_centavos), R.nomeConta(estado, x.conta_id),
          x.status, x.parcela_num ? `${x.parcela_num}/${x.parcela_total}` : '', x.pessoa || '', x.obs || '', x.origem || '', x.id];
      });
  }

  function abas(estado, hoje) {
    hoje = hoje || D.hoje();
    const mesHoje = D.mesDe(hoje);
    const out = [];
    out.push({ nome: 'Lançamentos', colunas: COLS_LANC, linhas: linhasLancamentos(estado) });

    const verbas = R.porId(estado.verbas);
    out.push({
      nome: 'Contracheque',
      colunas: [{ titulo: 'Mês ref.', largura: 10 }, { titulo: 'Verba', largura: 40 }, { titulo: 'Tipo', largura: 12 },
        { titulo: 'Entra no bruto', largura: 12 }, { titulo: 'Valor', largura: 14, tipo: 'moeda' }, { titulo: 'Observação', largura: 50 }, { titulo: 'Origem', largura: 30 }],
      linhas: R.ativos(estado.contracheque).slice().sort((a, b) => (a.mes_ref + a.verba_id < b.mes_ref + b.verba_id ? -1 : 1)).map((c) => {
        const v = verbas.get(c.verba_id) || {};
        return [c.mes_ref, v.nome || c.verba_id, v.tipo || '', v.entra_no_bruto ? 'sim' : 'não', reais(c.valor_centavos), c.obs || '', c.origem || ''];
      }),
    });

    const meses = R.mesesComDados(estado);
    out.push({
      nome: 'Resumo mensal',
      colunas: [{ titulo: 'Mês ref.', largura: 10 }, { titulo: 'Receitas', largura: 14, tipo: 'moeda' }, { titulo: 'Despesas pagas', largura: 15, tipo: 'moeda' },
        { titulo: 'Despesas previstas', largura: 15, tipo: 'moeda' }, { titulo: 'Pagamento de dívida', largura: 15, tipo: 'moeda' },
        { titulo: 'Saldo', largura: 14, tipo: 'moeda' }, { titulo: 'Sobrou (% da receita)', largura: 14, tipo: 'pct' }],
      linhas: meses.map((m) => {
        const r = R.resumoMes(estado, m);
        return [m, reais(r.receitas_total), reais(r.despesas_pagas), reais(r.despesas_previstas), reais(r.divida), reais(r.saldo), r.sobra_pct == null ? null : r.sobra_pct / 100];
      }),
    });

    const orc = R.orcamentoMes(estado, mesHoje);
    const orcPorAlvo = new Map(orc.map((o) => [o.orcamento.alvo_tipo + ':' + o.orcamento.alvo_id, o]));
    const res = R.resumoMes(estado, mesHoje);
    out.push({
      nome: 'Orçamento',
      colunas: [{ titulo: 'Mês', largura: 10 }, { titulo: 'Grupo', largura: 20 }, { titulo: 'Categoria', largura: 28 }, { titulo: 'Orçado', largura: 13, tipo: 'moeda' },
        { titulo: 'Gasto no mês', largura: 13, tipo: 'moeda' }, { titulo: '% usado', largura: 10, tipo: 'pct' }, { titulo: 'Sugestão (mediana 6 meses)', largura: 16, tipo: 'moeda' }],
      linhas: R.ativos(estado.categorias).filter((c) => c.tipo === 'despesa' && c.ativa !== false).sort((a, b) => (a.ordem || 0) - (b.ordem || 0)).map((c) => {
        const o = orcPorAlvo.get('categoria:' + c.id);
        const gasto = res.por_categoria[c.id] || 0;
        const sug = R.sugestaoOrcamento(estado, 'categoria', c.id, mesHoje, 6);
        return [mesHoje, R.nomeGrupo(estado, c.grupo_id), c.nome, o ? reais(o.orcamento.valor_centavos) : null, reais(gasto), o && o.pct != null ? o.pct / 100 : null, reais(sug.valor)];
      }),
    });

    const regra = R.regraAcerto(estado);
    if (regra) {
      out.push({
        nome: 'Acerto ' + (regra.pessoa || ''),
        colunas: [{ titulo: 'Mês', largura: 10 }, { titulo: 'Valor-base', largura: 12, tipo: 'moeda' }, { titulo: 'Extras', largura: 12, tipo: 'moeda' },
          { titulo: 'Débitos', largura: 12, tipo: 'moeda' }, { titulo: 'Saldo do mês anterior', largura: 14, tipo: 'moeda' },
          { titulo: 'Repasse calculado', largura: 14, tipo: 'moeda' }, { titulo: 'Repasse registrado', largura: 14, tipo: 'moeda' }],
        linhas: R.acerto(estado, mesHoje).map((a) => [a.mes, reais(a.base), reais(a.total_extras), reais(a.total_debitos), reais(a.saldo_anterior), reais(a.repasse), reais(a.registrado_pago + a.registrado_previsto)]),
      });
    }

    out.push({
      nome: 'Poupança',
      colunas: [{ titulo: 'Data ou mês', largura: 12 }, { titulo: 'Tipo', largura: 12 }, { titulo: 'Descrição', largura: 30 },
        { titulo: 'Valor', largura: 14, tipo: 'moeda' }, { titulo: 'Histórico (antes do saldo inicial)', largura: 14 }, { titulo: 'Observação', largura: 50 }],
      linhas: R.ativos(estado.poupanca).map((p) => [p.data ? D.formatarData(p.data) : p.mes_ref, p.tipo, p.descricao || '', reais(p.valor_centavos), p.historico ? 'sim' : 'não', p.obs || '']),
    });

    out.push({
      nome: 'Contas fixas',
      colunas: [{ titulo: 'Conta', largura: 26 }, { titulo: 'Categoria', largura: 26 }, { titulo: 'Valor esperado', largura: 14, tipo: 'moeda' },
        { titulo: 'Dia de vencimento', largura: 12, tipo: 'inteiro' }, { titulo: 'Frequência', largura: 11 }, { titulo: 'Meses', largura: 22 }, { titulo: 'Ativa', largura: 8 }],
      linhas: R.ativos(estado.recorrentes).map((r) => [r.descricao, R.nomeCategoria(estado, r.categoria_id), reais(r.valor_esperado_centavos), r.dia_vencimento || null,
        r.frequencia || 'mensal', (r.meses || []).join(', ') || 'todos', r.ativa === false ? 'não' : 'sim']),
    });
    return out;
  }

  function excel(estado, hoje) { return FN.xlsx.gerar(abas(estado, hoje)); }
  function csvLancamentos(estado) { return FN.xlsx.csv(COLS_LANC, linhasLancamentos(estado)); }

  return { abas, excel, csvLancamentos };
})();

/* ==== graficos.js ==== */
/* graficos.js — gráficos em SVG desenhados aqui mesmo (nenhuma biblioteca de fora), pensados
   para o celular: barras de no máximo 24 px, rótulos em tamanho real, legenda quando há mais de
   uma série e leitura por toque (tocar num mês mostra os valores embaixo do gráfico).
   Toda tela que usa gráfico também oferece "Ver como tabela". */
var FN = (typeof globalThis !== 'undefined' ? globalThis : window).FN || {};
(typeof globalThis !== 'undefined' ? globalThis : window).FN = FN;

FN.graficos = (function () {
  'use strict';
  const $ = FN.dinheiro;
  const esc = FN.util.esc;
  const CORES = ['#2a78d6', '#eb6834', '#1baf7a'];   // azul, laranja e verde-água (paleta conferida)
  const GRADE = '#e1e0d9';
  const TEXTO = '#52514e';
  const registro = {};   // dados de cada gráfico desenhado, para a leitura por toque

  /** Escala "redonda" para o eixo (1, 2, 2,5 ou 5 × 10ⁿ), com cerca de n marcas. Valores em centavos. */
  function escala(maxValor, minValor, n) {
    n = n || 4;
    const min = Math.min(0, minValor || 0);
    const max = Math.max(0, maxValor || 0);
    const amplitude = (max - min) || 100;
    const bruto = amplitude / n;
    const pot = Math.pow(10, Math.floor(Math.log10(bruto)));
    const passo = [1, 2, 2.5, 5, 10].map((m) => m * pot).find((p) => p >= bruto - 1e-9);
    const ini = Math.floor(min / passo) * passo;
    const fim = Math.ceil(max / passo) * passo || passo;
    const marcas = [];
    for (let v = ini; v <= fim + passo / 2; v += passo) marcas.push(Math.round(v));
    return { min: ini, max: fim, passo, marcas };
  }

  /** Largura útil do gráfico: a largura real da tela, para o texto sair em tamanho real. */
  function larguraPadrao() {
    const el = typeof document !== 'undefined' ? document.getElementById('tela') : null;
    const w = el ? el.clientWidth - 64 : 600;
    return Math.max(280, Math.min(880, w));
  }

  /** Mostra 1 a cada k rótulos do eixo X para não encavalar. */
  function passoRotulos(n, larguraUtil, larguraRotulo) {
    return Math.max(1, Math.ceil((n * (larguraRotulo || 46)) / larguraUtil));
  }

  function eixoY(e, m, W, y) {
    return e.marcas.map((v) => `<line x1="${m.esq}" x2="${W - m.dir}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="${v === 0 ? '#898781' : GRADE}" stroke-width="1"/>
      <text x="${m.esq - 6}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end" font-size="11" fill="${TEXTO}">${esc($.brlCurto(v))}</text>`).join('');
  }

  /** Rótulos do eixo X contados a partir do último mês (o mais recente sempre aparece). */
  function eixoX(rotulos, m, banda, H, k) {
    const n = rotulos.length;
    return rotulos.map((r, i) => ((n - 1 - i) % k === 0
      ? `<text x="${(m.esq + banda * i + banda / 2).toFixed(1)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="${TEXTO}">${esc(r)}</text>` : '')).join('');
  }

  /** Áreas de toque (uma por mês), com a dica nativa do navegador (title) para quem usa mouse. */
  function alvos(id, rotulos, series, m, banda, H) {
    return rotulos.map((r, i) => {
      const dica = `${r}: ` + series.map((s) => `${s.nome} ${s.valores[i] === null || s.valores[i] === undefined ? '—' : $.brl(s.valores[i])}`).join(' · ');
      return `<rect class="alvo" x="${(m.esq + banda * i).toFixed(1)}" y="${m.topo}" width="${banda.toFixed(1)}" height="${H - m.topo - m.base}"
        fill="transparent" data-acao="grafico" data-grafico="${esc(id)}" data-i="${i}"><title>${esc(dica)}</title></rect>`;
    }).join('');
  }

  function legenda(series) {
    if (series.length < 2) return '';
    return `<ul class="legenda">${series.map((s, i) => `<li><i data-bg="${esc(s.cor || CORES[i])}"></i>${esc(s.nome)}</li>`).join('')}</ul>`;
  }

  function moldura(id, svg, series, descricao) {
    return `<figure class="grafico">${legenda(series)}
      <svg viewBox="0 0 ${svg.W} ${svg.H}" width="${svg.W}" height="${svg.H}" role="img" aria-label="${esc(descricao || '')}">${svg.corpo}</svg>
      <figcaption class="grafico-leitura" id="leitura-${esc(id)}" aria-live="polite">Toque num mês para ver os valores.</figcaption></figure>`;
  }

  /** Barras agrupadas. opc: {id, rotulos, series:[{nome, valores, cor}], altura, descricao}.
   *  Valores negativos descem abaixo da linha do zero. */
  function barras(opc) {
    const W = opc.largura || larguraPadrao();
    const H = opc.altura || 220;
    const m = { topo: 10, dir: 6, base: 26, esq: 50 };
    const n = opc.rotulos.length;
    const s = opc.series.length;
    const todos = opc.series.flatMap((x) => x.valores.filter((v) => v !== null && v !== undefined));
    const e = escala(Math.max(0, ...todos), Math.min(0, ...todos));
    const ih = H - m.topo - m.base;
    const y = (v) => m.topo + ih - ((v - e.min) / (e.max - e.min)) * ih;
    const banda = (W - m.esq - m.dir) / Math.max(1, n);
    const larg = Math.max(2, Math.min(24, (banda * 0.76) / s));
    const grupo = larg * s + (s - 1) * 1;
    let corpo = eixoY(e, m, W, y);
    opc.series.forEach((serie, j) => {
      const cor = serie.cor || CORES[j];
      serie.valores.forEach((v, i) => {
        if (!v) return;
        const x = m.esq + banda * i + (banda - grupo) / 2 + j * (larg + 1);
        const y0 = y(Math.max(v, 0));
        const y1 = y(Math.min(v, 0));
        const corBarra = serie.corNegativo && v < 0 ? serie.corNegativo : cor;
        corpo += `<rect x="${x.toFixed(1)}" y="${y0.toFixed(1)}" width="${larg.toFixed(1)}" height="${Math.max(1, y1 - y0).toFixed(1)}" rx="${Math.min(4, larg / 3).toFixed(1)}" fill="${corBarra}"/>`;
      });
    });
    corpo += eixoX(opc.rotulos, m, banda, H, passoRotulos(n, W - m.esq - m.dir));
    corpo += alvos(opc.id, opc.rotulos, opc.series, m, banda, H);
    registro[opc.id] = opc;
    return moldura(opc.id, { W, H, corpo }, opc.series, opc.descricao);
  }

  /** Linhas (uma por série). Valor null interrompe a linha (mês sem dado). */
  function linhas(opc) {
    const W = opc.largura || larguraPadrao();
    const H = opc.altura || 220;
    const m = { topo: 10, dir: 10, base: 26, esq: 50 };
    const n = opc.rotulos.length;
    const todos = opc.series.flatMap((x) => x.valores.filter((v) => v !== null && v !== undefined));
    const e = escala(Math.max(0, ...todos), Math.min(0, ...todos));
    const ih = H - m.topo - m.base;
    const y = (v) => m.topo + ih - ((v - e.min) / (e.max - e.min)) * ih;
    const banda = (W - m.esq - m.dir) / Math.max(1, n);
    const x = (i) => m.esq + banda * i + banda / 2;
    let corpo = eixoY(e, m, W, y);
    opc.series.forEach((serie, j) => {
      const cor = serie.cor || CORES[j];
      let d = '';
      let pontos = '';
      let caneta = false;
      serie.valores.forEach((v, i) => {
        if (v === null || v === undefined) { caneta = false; return; }
        d += `${caneta ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)} `;
        caneta = true;
        pontos += `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3" fill="${cor}"/>`;
      });
      corpo += `<path d="${d.trim()}" fill="none" stroke="${cor}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${pontos}`;
    });
    corpo += eixoX(opc.rotulos, m, banda, H, passoRotulos(n, W - m.esq - m.dir));
    corpo += alvos(opc.id, opc.rotulos, opc.series, m, banda, H);
    registro[opc.id] = opc;
    return moldura(opc.id, { W, H, corpo }, opc.series, opc.descricao);
  }

  /** Texto da leitura por toque: "set/2026 — Receitas R$ … · Despesas R$ …". */
  function leitura(id, i) {
    const opc = registro[id];
    if (!opc) return '';
    const rot = (opc.rotulosLongos || opc.rotulos)[i];
    return `${rot}: ` + opc.series.map((s) => `${s.nome} ${s.valores[i] === null || s.valores[i] === undefined ? '—' : $.brl(s.valores[i])}`).join(' · ')
      + (opc.extraLeitura ? opc.extraLeitura(i) : '');
  }

  /** Tabela com os mesmos números do gráfico (acessível e boa para conferir). */
  function tabela(opc, colunaRotulo) {
    return `<details class="ver-tabela"><summary>Ver como tabela</summary><div class="rolagem-x"><table class="tabela">
      <thead><tr><th>${esc(colunaRotulo || 'Mês')}</th>${opc.series.map((s) => `<th class="num">${esc(s.nome)}</th>`).join('')}</tr></thead>
      <tbody>${(opc.rotulosLongos || opc.rotulos).map((r, i) => `<tr><td>${esc(r)}</td>${opc.series.map((s) => `<td class="num">${s.valores[i] === null || s.valores[i] === undefined ? '—' : $.brl(s.valores[i])}</td>`).join('')}</tr>`).join('')}</tbody>
      </table></div></details>`;
  }

  /* ---- Mapa de calor: rampa de 5 tons de azul, do claro (pouco) ao escuro (muito).
     Texto escuro nos 4 primeiros tons e branco no último, para manter o contraste. ---- */
  const RAMPA = ['#e8f0fb', '#c9dcf5', '#a3c3ee', '#6fa0e2', '#1d5aa6'];
  function corCalor(valor, maximo) {
    if (!valor || !maximo) return null;
    const i = Math.min(RAMPA.length - 1, Math.floor((valor / maximo) * RAMPA.length));
    return { fundo: RAMPA[i], texto: i === RAMPA.length - 1 ? '#ffffff' : '#0b0b0b', nivel: i };
  }

  return { CORES, RAMPA, escala, barras, linhas, leitura, tabela, corCalor, larguraPadrao, registro };
})();

/* ==== db.js ==== */
/* db.js — banco de dados do próprio navegador (IndexedDB).
   Cada tabela é um "object store". A versão da estrutura (VERSAO) permite atualizar o app sem perder
   dados: numa versão nova, onupgradeneeded converte o que existir em vez de apagar. */
var FN = (typeof globalThis !== 'undefined' ? globalThis : window).FN || {};
(typeof globalThis !== 'undefined' ? globalThis : window).FN = FN;

FN.db = (function () {
  'use strict';
  const NOME = 'financas';
  const VERSAO = 1;                      // versão da estrutura do banco (não é a versão do app)
  const TABELAS = FN.dados.TABELAS.concat(['config', 'alteracoes']);
  let banco = null;

  function abrir() {
    if (banco) return Promise.resolve(banco);   // reaproveita a conexão já aberta
    return new Promise((resolve, reject) => {
      if (!('indexedDB' in globalThis)) { reject(new Error('Este navegador não oferece banco de dados local (IndexedDB).')); return; }
      const req = indexedDB.open(NOME, VERSAO);
      req.onupgradeneeded = (ev) => {
        const db = req.result;
        const anterior = ev.oldVersion;
        if (anterior < 1) {
          for (const t of TABELAS) if (!db.objectStoreNames.contains(t)) db.createObjectStore(t, { keyPath: 'id' });
        }
        // Próximas versões: if (anterior < 2) { ...converter sem apagar... }
      };
      req.onsuccess = () => {
        banco = req.result;
        banco.onversionchange = () => { banco.close(); banco = null; };
        resolve(banco);
      };
      req.onerror = () => reject(req.error || new Error('Não foi possível abrir o banco de dados.'));
      req.onblocked = () => reject(new Error('Feche as outras abas do app e tente de novo.'));
    });
  }

  function transacao(modo, tabelas) {
    if (!banco) throw new Error('Banco de dados não aberto.');
    return banco.transaction(tabelas || TABELAS, modo);
  }

  function concluir(tx) {
    return new Promise((resolve, reject) => {
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error || new Error('Falha ao gravar.'));
      tx.onabort = () => reject(tx.error || new Error('Gravação cancelada.'));
    });
  }

  /** Lê todas as tabelas de uma vez: {tabela: [registros]} */
  function lerTudo() {
    return new Promise((resolve, reject) => {
      const tx = transacao('readonly');
      const out = {};
      for (const t of TABELAS) {
        const r = tx.objectStore(t).getAll();
        r.onsuccess = () => { out[t] = r.result || []; };
      }
      tx.oncomplete = () => resolve(out);
      tx.onerror = () => reject(tx.error);
    });
  }

  /** Grava vários registros numa transação só (tudo ou nada). itens: [{tabela, registro}] ou [{tabela, apagarId}] */
  function gravar(itens) {
    const tabs = [...new Set(itens.map((i) => i.tabela))];
    if (!tabs.length) return Promise.resolve();
    const tx = transacao('readwrite', tabs);
    for (const i of itens) {
      const st = tx.objectStore(i.tabela);
      if (i.apagarId !== undefined) st.delete(i.apagarId);
      else st.put(i.registro);
    }
    return concluir(tx);
  }

  /** Troca todo o conteúdo pelo estado informado (restauração de backup). Tudo numa transação. */
  function substituirTudo(estado, configRegistros) {
    const tx = transacao('readwrite');
    for (const t of TABELAS) {
      if (t === 'alteracoes') { tx.objectStore(t).clear(); continue; }
      tx.objectStore(t).clear();
    }
    for (const t of FN.dados.TABELAS) for (const r of estado[t] || []) tx.objectStore(t).put(r);
    for (const r of configRegistros || []) tx.objectStore('config').put(r);
    return concluir(tx);
  }

  function apagarTudo() {
    const tx = transacao('readwrite');
    for (const t of TABELAS) tx.objectStore(t).clear();
    return concluir(tx);
  }

  return { NOME, VERSAO, TABELAS, abrir, lerTudo, gravar, substituirTudo, apagarTudo };
})();

/* ==== app-base.js ==== */
/* app-base.js — o "motor" da interface: estado em memória, gravação no banco com desfazer,
   rotas (#/inicio, #/lancar...), diálogos, avisos e arquivos (baixar e abrir). */
var App = (function () {
  'use strict';
  const D = FN.datas;
  const U = FN.util;
  const esc = U.esc;
  const LIMITE_DESFAZER = 50;

  const App = {
    estado: FN.dados.estadoVazio(),
    alteracoes: [],
    telas: {},
    telaAtual: null,
    rotaAtual: null,
    parametros: [],
    ui: { mes: D.mesAtual(), mesHistorico: null, contasVisao: 'lista' },
    MENU: [],   // preenchido pelas telas: {rota, rotulo, icone, principal}
    ouvintes: [],   // funções chamadas depois de cada alteração (outras abas, sincronização)
    iniciais: [],   // funções chamadas depois de carregar os dados e antes da primeira tela
    alertasExtras: [],   // funções (mes) => alerta ou null, mostradas no início (ex.: sincronização pausada)
  };

  /* ---------------- Carga e gravação ---------------- */

  App.carregar = async function () {
    await FN.db.abrir();
    const t = await FN.db.lerTudo();
    const e = FN.dados.estadoVazio();
    for (const k of FN.dados.TABELAS) e[k] = t[k] || [];
    for (const r of t.config || []) {
      e.config[r.id] = r.valor;
      e.configMeta[r.id] = { atualizado_em: r.atualizado_em, dispositivo: r.dispositivo };
    }
    App.estado = e;
    App.alteracoes = (t.alteracoes || []).sort((a, b) => (a.quando < b.quando ? -1 : 1)).slice(-LIMITE_DESFAZER);
    if (!e.config.dispositivo) await App.salvarConfig('dispositivo', U.novoId('aparelho'));
  };

  App.temDados = function () { return FN.regras.ativos(App.estado.lancamentos).length > 0; };

  /** Grava registros (novos ou alterados) com carimbo e guarda o "antes" para poder desfazer.
   *  mudancas: [{tabela, registro}] */
  App.salvar = async function (mudancas, descricao) {
    const agora = U.agora();
    const disp = App.estado.config.dispositivo || '';
    const alt = { id: U.novoId('alt'), quando: agora, descricao: descricao || 'Alteração', mudancas: [] };
    const itens = [];
    for (const m of mudancas) {
      const lista = App.estado[m.tabela];
      const idx = lista.findIndex((x) => x.id === m.registro.id);
      const antes = idx >= 0 ? lista[idx] : null;
      const novo = Object.assign({}, m.registro, { atualizado_em: agora, dispositivo: disp });
      if (!novo.criado_em) novo.criado_em = agora;
      if (novo.excluido_em === undefined) novo.excluido_em = null;
      if (idx >= 0) lista[idx] = novo; else lista.push(novo);
      alt.mudancas.push({ tabela: m.tabela, antes: antes ? U.clonar(antes) : null, depois: U.clonar(novo) });
      itens.push({ tabela: m.tabela, registro: novo });
    }
    if (descricao !== null) {
      App.alteracoes.push(alt);
      itens.push({ tabela: 'alteracoes', registro: alt });
      while (App.alteracoes.length > LIMITE_DESFAZER) itens.push({ tabela: 'alteracoes', apagarId: App.alteracoes.shift().id });
    }
    await FN.db.gravar(itens);
    App.aposAlterar();
    return alt;
  };

  /** Exclusão "para a lixeira": o registro fica marcado com a data da exclusão (e se propaga na sincronização). */
  App.excluir = function (tabela, registros, descricao) {
    const agora = U.agora();
    return App.salvar(registros.map((r) => ({ tabela, registro: Object.assign({}, r, { excluido_em: agora }) })), descricao);
  };

  /** Desfaz a última alteração: devolve cada registro ao que era antes (o que foi criado vai para a lixeira). */
  App.desfazer = async function () {
    const alt = App.alteracoes.pop();
    if (!alt) return null;
    const agora = U.agora();
    const disp = App.estado.config.dispositivo || '';
    const itens = [];
    for (const m of alt.mudancas.slice().reverse()) {
      const ref = m.depois || m.antes;
      const lista = App.estado[m.tabela];
      const idx = lista.findIndex((x) => x.id === ref.id);
      const volta = m.antes
        ? Object.assign({}, m.antes, { atualizado_em: agora, dispositivo: disp })
        : Object.assign({}, m.depois, { excluido_em: agora, atualizado_em: agora, dispositivo: disp });
      if (idx >= 0) lista[idx] = volta; else lista.push(volta);
      itens.push({ tabela: m.tabela, registro: volta });
    }
    itens.push({ tabela: 'alteracoes', apagarId: alt.id });
    await FN.db.gravar(itens);
    App.aposAlterar();
    return alt;
  };

  App.salvarConfig = async function (chave, valor) {
    const agora = U.agora();
    const disp = App.estado.config.dispositivo || (chave === 'dispositivo' ? valor : '');
    App.estado.config[chave] = valor;
    App.estado.configMeta[chave] = { atualizado_em: agora, dispositivo: disp };
    await FN.db.gravar([{ tabela: 'config', registro: { id: chave, valor, atualizado_em: agora, dispositivo: disp, excluido_em: null } }]);
    if (!FN.dados.CONFIG_LOCAL.has(chave)) App.aposAlterar();
  };

  /** Troca todos os dados (restauração). A configuração do aparelho (identificador, último backup) é mantida. */
  App.substituirEstado = async function (novo) {
    const e = Object.assign(FN.dados.estadoVazio(), novo);
    e.config = Object.assign({}, novo.config || {});
    e.configMeta = Object.assign({}, novo.configMeta || {});
    for (const k of FN.dados.CONFIG_LOCAL) {
      if (k in App.estado.config) { e.config[k] = App.estado.config[k]; e.configMeta[k] = App.estado.configMeta[k]; }
    }
    const regs = Object.keys(e.config).map((k) => ({ id: k, valor: e.config[k], atualizado_em: (e.configMeta[k] || {}).atualizado_em || U.agora(),
      dispositivo: (e.configMeta[k] || {}).dispositivo || '', excluido_em: null }));
    await FN.db.substituirTudo(e, regs);
    App.estado = e;
    App.alteracoes = [];
    App.aposAlterar();
  };

  /** Junta dados de outro aparelho (ou de um backup) com os daqui, sem perder nada. */
  App.juntarEstado = async function (remoto) {
    const { estado, stats } = FN.dados.mesclar(App.estado, remoto);
    await App.substituirEstado(estado);
    return stats;
  };

  /** Aplica o que veio de outro aparelho (sincronização) sem regravar tudo e sem apagar o
   *  "desfazer" daqui. Não dispara nova sincronização: a mudança veio de fora. */
  App.aplicarRemoto = async function (dif) {
    const itens = [];
    for (const { tabela, registro } of dif.registros) {
      const lista = App.estado[tabela];
      const i = lista.findIndex((x) => x.id === registro.id);
      if (i >= 0) lista[i] = registro; else lista.push(registro);
      itens.push({ tabela, registro });
    }
    for (const c of dif.config) {
      App.estado.config[c.id] = c.valor;
      App.estado.configMeta[c.id] = { atualizado_em: c.atualizado_em, dispositivo: c.dispositivo };
      itens.push({ tabela: 'config', registro: c });
    }
    if (itens.length) await FN.db.gravar(itens);
    if (App.avisarAbas) App.avisarAbas();
  };

  App.aposAlterar = function () {
    App.alterado = true;
    for (const fn of App.ouvintes) {
      try { fn(); } catch (e) { console.error(e); }
    }
  };

  /* ---------------- Rotas e tela ---------------- */

  App.registrarTela = function (nome, tela, menu) {
    App.telas[nome] = tela;
    if (menu) App.MENU.push(Object.assign({ rota: '#/' + nome }, menu));
  };

  App.rota = function () {
    const h = (location.hash || '').replace(/^#\/?/, '');
    const [nome, ...params] = h.split('/').map((p) => decodeURIComponent(p));
    return { nome: nome || 'inicio', params };
  };

  App.navegar = function (rota) {
    if (location.hash !== rota) location.hash = rota;
    else App.renderizar();
  };

  App.renderizar = function (manterRolagem) {
    const { nome, params } = App.rota();
    const tela = App.telas[nome] || App.telas.inicio;
    const mudouTela = App.rotaAtual !== nome;
    App.telaAtual = tela;
    App.rotaAtual = nome;
    App.parametros = params;
    const main = document.getElementById('tela');
    const rolagem = window.scrollY;
    try {
      main.innerHTML = tela.render(params);
    } catch (e) {
      console.error(e);
      main.innerHTML = `<section class="cartao"><h2>Algo deu errado nesta tela</h2><p>${esc(e.message)}</p><p><a class="btn" href="#/inicio">Voltar ao início</a></p></section>`;
    }
    App.aplicarEstilos(main);
    const titulo = typeof tela.titulo === 'function' ? tela.titulo(params) : (tela.titulo || 'Finanças');
    document.getElementById('titulo').textContent = titulo;
    document.title = titulo + ' · Finanças';
    for (const a of document.querySelectorAll('[data-menu]')) {
      const ativo = a.getAttribute('href') === '#/' + nome || (nome !== 'inicio' && a.dataset.menu === 'mais' && !App.MENU.some((m) => m.principal && m.rota === '#/' + nome) && nome !== 'lancar');
      if (ativo) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    }
    if (tela.depois) tela.depois(main, params);
    if (mudouTela && !manterRolagem) window.scrollTo(0, 0);
    else window.scrollTo(0, rolagem);
  };

  /** Estilos dinâmicos (largura de barras, cores) aplicados pelo JavaScript: a política de segurança
   *  da página proíbe estilo escrito direto no HTML, mas permite este caminho. */
  App.aplicarEstilos = function (raiz) {
    for (const el of raiz.querySelectorAll('[data-w]')) el.style.setProperty('width', Math.max(0, Math.min(100, Number(el.dataset.w))) + '%');
    for (const el of raiz.querySelectorAll('[data-bg]')) el.style.setProperty('background', el.dataset.bg);
    for (const el of raiz.querySelectorAll('[data-cor]')) el.style.setProperty('color', el.dataset.cor);
  };

  /* ---------------- Avisos, diálogos e erros ---------------- */

  let timerToast = null;
  App.toast = function (texto, opcoes) {
    const t = document.getElementById('toast');
    t.innerHTML = `<span>${esc(texto)}</span>` + (opcoes && opcoes.acao ? `<button type="button" class="toast-acao">${esc(opcoes.acao)}</button>` : '');
    t.classList.add('visivel');
    const b = t.querySelector('.toast-acao');
    if (b) b.addEventListener('click', () => { t.classList.remove('visivel'); Promise.resolve(opcoes.fn()).catch(App.erro); }, { once: true });
    clearTimeout(timerToast);
    timerToast = setTimeout(() => t.classList.remove('visivel'), (opcoes && opcoes.tempo) || 6000);
  };

  App.erro = function (e) {
    console.error(e);
    App.toast('Algo deu errado: ' + (e && e.message ? e.message : e));
  };

  /** Diálogo modal. botoes: [{valor, texto, classe}]. validar(valores) pode devolver uma mensagem de erro.
   *  Devolve {botao, valores}; fechar pelo X ou Esc devolve botao = null. */
  App.dialogo = function (opcoes) {
    const dlg = document.getElementById('dialogo');
    const botoes = opcoes.botoes || [{ valor: 'ok', texto: 'OK', classe: 'btn-primario' }];
    dlg.innerHTML = `<div class="dlg" role="document">
      <div class="dlg-topo"><h2 id="dlg-titulo">${esc(opcoes.titulo || '')}</h2>
      <button type="button" class="btn-icone" data-dlg="__fechar" aria-label="Fechar">✕</button></div>
      <div class="dlg-corpo">${opcoes.html || ''}</div>
      <p class="dlg-erro" role="alert"></p>
      <div class="dlg-botoes">${botoes.map((b) => `<button type="button" class="btn ${b.classe || ''}" data-dlg="${esc(b.valor)}">${esc(b.texto)}</button>`).join('')}</div>
    </div>`;
    dlg.setAttribute('aria-labelledby', 'dlg-titulo');
    App.aplicarEstilos(dlg);
    if (opcoes.depois) opcoes.depois(dlg);
    return new Promise((resolve) => {
      const valores = () => {
        const v = {};
        for (const el of dlg.querySelectorAll('[name]')) {
          if (el.type === 'checkbox') v[el.name] = el.checked;
          else if (el.type === 'radio') { if (el.checked) v[el.name] = el.value; }
          else v[el.name] = el.value;
        }
        return v;
      };
      const fechar = (botao) => {
        dlg.removeEventListener('click', aoClicar);
        dlg.removeEventListener('keydown', aoTeclar);
        dlg.removeEventListener('cancel', aoCancelar);
        const v = valores();
        dlg.close();
        resolve({ botao, valores: v });
      };
      const aoClicar = (ev) => {
        const b = ev.target.closest('[data-dlg]');
        if (!b) return;
        const val = b.dataset.dlg;
        if (val === '__fechar') { fechar(null); return; }
        const def = botoes.find((x) => x.valor === val);
        if (def && def.validar !== false && opcoes.validar && !def.semValidar) {
          const erro = opcoes.validar(valores(), val);
          if (erro) { dlg.querySelector('.dlg-erro').textContent = erro; return; }
        }
        fechar(val);
      };
      const aoTeclar = (ev) => {
        if (ev.key === 'Enter' && ev.target.tagName === 'INPUT' && ev.target.type !== 'checkbox') {
          ev.preventDefault();
          const prim = dlg.querySelector('.dlg-botoes .btn-primario') || dlg.querySelector('.dlg-botoes .btn');
          if (prim) prim.click();
        }
      };
      const aoCancelar = (ev) => { ev.preventDefault(); fechar(null); };
      dlg.addEventListener('click', aoClicar);
      dlg.addEventListener('keydown', aoTeclar);
      dlg.addEventListener('cancel', aoCancelar);
      dlg.showModal();
      const foco = dlg.querySelector('[autofocus]') || dlg.querySelector('input, select, textarea');
      if (foco) foco.focus();
    });
  };

  App.confirmar = async function (titulo, texto, textoOk, perigo) {
    const r = await App.dialogo({
      titulo, html: `<p>${esc(texto)}</p>`,
      botoes: [{ valor: 'nao', texto: 'Cancelar', classe: 'btn-sec', semValidar: true }, { valor: 'sim', texto: textoOk || 'Confirmar', classe: perigo ? 'btn-perigo' : 'btn-primario' }],
    });
    return r.botao === 'sim';
  };

  /** Pede uma senha (com confirmação quando é para criar). Devolve o texto ou null. */
  App.pedirSenha = async function (titulo, criar, explicacao) {
    const r = await App.dialogo({
      titulo,
      html: `${explicacao ? `<p class="suave">${esc(explicacao)}</p>` : ''}
        <label class="campo"><span>Senha</span><input type="password" name="senha" autocomplete="${criar ? 'new-password' : 'current-password'}" autofocus></label>
        ${criar ? '<label class="campo"><span>Repita a senha</span><input type="password" name="senha2" autocomplete="new-password"></label>' : ''}`,
      botoes: [{ valor: 'cancelar', texto: 'Cancelar', classe: 'btn-sec', semValidar: true }, { valor: 'ok', texto: 'Continuar', classe: 'btn-primario' }],
      validar: (v) => {
        if (!v.senha) return 'Digite a senha.';
        if (criar && v.senha.length < 8) return 'Use pelo menos 8 caracteres.';
        if (criar && v.senha !== v.senha2) return 'As duas senhas não são iguais.';
        return null;
      },
    });
    return r.botao === 'ok' ? r.valores.senha : null;
  };

  /* ---------------- Arquivos ---------------- */

  App.baixar = function (nome, conteudo, tipo) {
    const blob = conteudo instanceof Blob ? conteudo : new Blob([conteudo], { type: tipo || 'application/octet-stream' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = nome;
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 2000);
  };

  /** Abre o seletor de arquivos e devolve o texto do arquivo escolhido (ou null). */
  App.escolherArquivo = function (aceitar) {
    return new Promise((resolve) => {
      const inp = document.createElement('input');
      inp.type = 'file';
      inp.accept = aceitar || '.json,application/json';
      inp.addEventListener('change', async () => {
        const f = inp.files && inp.files[0];
        if (!f) { resolve(null); return; }
        resolve({ nome: f.name, texto: await f.text() });
      }, { once: true });
      inp.addEventListener('cancel', () => resolve(null), { once: true });   // fechou o seletor sem escolher
      inp.click();
    });
  };

  /** Pede ao navegador para não apagar os dados deste site quando faltar espaço. */
  App.pedirPersistencia = async function () {
    try {
      if (!navigator.storage || !navigator.storage.persist) return null;
      if (await navigator.storage.persisted()) return true;
      return await navigator.storage.persist();
    } catch (e) { return null; }
  };

  App.nomeArquivo = function (base, ext) {
    const d = D.hoje();
    const agora = new Date();
    const hora = D.pad(agora.getHours()) + D.pad(agora.getMinutes());
    return `${base}-${d}-${hora}.${ext}`;
  };

  return App;
})();

/* ==== app-comum.js ==== */
/* app-comum.js — peças de interface usadas em várias telas (seletor de mês, cartões de número,
   etiquetas de status, barras, linha de lançamento) e ações comuns (trocar de mês, desfazer). */
var UI = (function () {
  'use strict';
  const $ = FN.dinheiro;
  const D = FN.datas;
  const R = FN.regras;
  const esc = FN.util.esc;

  function seletorMes(mes) {
    const hoje = D.mesAtual();
    return `<div class="seletor-mes" role="group" aria-label="Mês">
      <button type="button" class="btn-icone" data-acao="mes-anterior" aria-label="Mês anterior">‹</button>
      <button type="button" class="mes-nome" data-acao="mes-escolher" aria-label="Escolher mês">${esc(D.nomeMes(mes))}</button>
      <button type="button" class="btn-icone" data-acao="mes-seguinte" aria-label="Próximo mês">›</button>
      ${mes !== hoje ? '<button type="button" class="btn-link" data-acao="mes-hoje">voltar para hoje</button>' : ''}
    </div>`;
  }

  function kpi(rotulo, valor, sub, extra) {
    return `<div class="kpi ${extra || ''}"><div class="kpi-rotulo">${esc(rotulo)}</div><div class="kpi-valor">${valor}</div>${sub ? `<div class="kpi-sub">${sub}</div>` : ''}</div>`;
  }

  const STATUS = {
    pago: ['st-pago', '✓', 'pago'],
    previsto: ['st-previsto', '◷', 'previsto'],
    pendente: ['st-pendente', '•', 'pendente'],
    vencida: ['st-vencida', '!', 'vencida'],
    recebido: ['st-pago', '✓', 'recebido'],
  };
  function chipStatus(status) {
    const s = STATUS[status] || STATUS.pendente;
    return `<span class="st ${s[0]}"><span aria-hidden="true">${s[1]}</span> ${s[2]}</span>`;
  }

  function vazio(texto, botaoHtml) {
    return `<div class="vazio"><p>${esc(texto)}</p>${botaoHtml || ''}</div>`;
  }

  function barra(pct, classe) {
    const p = Math.max(0, Math.min(100, pct || 0));
    return `<span class="barra ${classe || ''}" aria-hidden="true"><i data-w="${p.toFixed(1)}"></i></span>`;
  }

  /** Diferença contra uma referência. Para gastos, subir é ruim (maiorEhRuim = true). */
  function delta(atual, ref, maiorEhRuim, rotuloRef) {
    if (ref === null || ref === undefined) return '';
    const d = atual - ref;
    if (d === 0) return `<span class="delta">igual ${esc(rotuloRef)}</span>`;
    const sobe = d > 0;
    const ruim = maiorEhRuim ? sobe : !sobe;
    const p = ref ? ` (${sobe ? '+' : '−'}${$.pct(Math.abs(d) / Math.abs(ref) * 100)})` : '';
    return `<span class="delta ${ruim ? 'delta-ruim' : 'delta-bom'}"><span aria-hidden="true">${sobe ? '▲' : '▼'}</span> ${$.brl(Math.abs(d))} ${sobe ? 'a mais' : 'a menos'}${p} ${esc(rotuloRef)}</span>`;
  }

  function opcoes(lista, selecionado, vazioTexto) {
    return (vazioTexto !== undefined ? `<option value="">${esc(vazioTexto)}</option>` : '')
      + lista.map((o) => `<option value="${esc(o.valor)}"${String(o.valor) === String(selecionado) ? ' selected' : ''}>${esc(o.texto)}</option>`).join('');
  }

  function opcoesCategorias(estado, tipo, selecionada, incluirInativas) {
    const grupos = R.ativos(estado.grupos).slice().sort((a, b) => (a.ordem || 0) - (b.ordem || 0));
    const cats = R.ativos(estado.categorias).filter((c) => (!tipo || c.tipo === tipo) && (incluirInativas || c.ativa !== false || c.id === selecionada));
    let html = '';
    for (const g of grupos) {
      const cs = cats.filter((c) => c.grupo_id === g.id).sort((a, b) => (a.ordem || 0) - (b.ordem || 0));
      if (!cs.length) continue;
      html += `<optgroup label="${esc(g.nome)}">` + cs.map((c) => `<option value="${esc(c.id)}"${c.id === selecionada ? ' selected' : ''}>${esc(c.nome)}${c.ativa === false ? ' (inativa)' : ''}</option>`).join('') + '</optgroup>';
    }
    const soltas = cats.filter((c) => !grupos.some((g) => g.id === c.grupo_id));
    html += soltas.map((c) => `<option value="${esc(c.id)}"${c.id === selecionada ? ' selected' : ''}>${esc(c.nome)}</option>`).join('');
    return html;
  }

  function descricaoLancamento(estado, x) {
    const nomeCat = R.nomeCategoria(estado, x.categoria_id);
    const desc = x.descricao && x.descricao !== nomeCat && !x.descricao.startsWith(nomeCat + ' (item') ? x.descricao : '';
    return { nomeCat, desc };
  }

  /** Uma linha de lançamento para listas (toque abre a edição). */
  function linhaLancamento(estado, x, opc) {
    const { nomeCat, desc } = descricaoLancamento(estado, x);
    const sinal = x.tipo === 'receita' ? '+' : '';
    const parcela = x.parcela_num ? ` · parcela ${x.parcela_num}/${x.parcela_total}` : '';
    const quando = x.data ? D.formatarDataCurta(x.data) : '';
    const conta = x.conta_id ? R.nomeConta(estado, x.conta_id) : '';
    const detalhes = [quando, conta && conta !== 'Não informado' ? conta : '', x.tipo === 'pagamento_divida' ? 'pagamento de dívida' : x.tipo === 'transferencia' ? 'transferência' : ''].filter(Boolean).join(' · ');
    return `<li><button type="button" class="linha" data-acao="${(opc && opc.acao) || 'editar-lancamento'}" data-id="${esc(x.id)}">
      <span class="linha-principal"><span class="linha-titulo">${esc(nomeCat)}${desc ? ` <span class="suave">— ${esc(desc)}</span>` : ''}</span>
      <span class="linha-sub">${esc(detalhes)}${esc(parcela)}${x.pessoa ? ' · ' + esc(x.pessoa) : ''}</span></span>
      <span class="linha-valor ${x.tipo === 'receita' ? 'valor-receita' : ''}">${sinal}${$.brl(x.valor_centavos)}${x.status === 'previsto' ? '<br>' + chipStatus('previsto') : ''}</span>
    </button></li>`;
  }

  function pctTexto(v) { return v === null || v === undefined ? '—' : $.pct(v); }

  /** Ações que funcionam em qualquer tela (usadas quando a tela não define a sua). */
  const acoesComuns = {
    'mes-anterior': () => { App.ui.mes = D.somarMeses(App.ui.mes, -1); App.renderizar(true); },
    'mes-seguinte': () => { App.ui.mes = D.somarMeses(App.ui.mes, 1); App.renderizar(true); },
    'mes-hoje': () => { App.ui.mes = D.mesAtual(); App.renderizar(true); },
    'mes-escolher': async () => {
      const r = await App.dialogo({
        titulo: 'Escolher mês',
        html: `<label class="campo"><span>Mês</span><input type="month" name="mes" value="${esc(App.ui.mes)}" autofocus></label>`,
        botoes: [{ valor: 'cancelar', texto: 'Cancelar', classe: 'btn-sec', semValidar: true }, { valor: 'ok', texto: 'Ir', classe: 'btn-primario' }],
        validar: (v) => (D.validarMes(v.mes) ? null : 'Escolha um mês.'),
      });
      if (r.botao === 'ok') { App.ui.mes = r.valores.mes; App.renderizar(true); }
    },
    'desfazer': async () => {
      const alt = await App.desfazer();
      App.toast(alt ? `Desfeito: ${alt.descricao}` : 'Nada para desfazer.');
      App.renderizar(true);
    },
    'ir': (el) => App.navegar(el.dataset.rota),
    'editar-lancamento': (el) => App.navegar('#/lancar/' + encodeURIComponent(el.dataset.id)),
    // leitura por toque dos gráficos: mostra os valores do mês tocado embaixo do gráfico
    'grafico': (el) => {
      const id = el.dataset.grafico;
      const alvo = document.getElementById('leitura-' + id);
      if (alvo) alvo.textContent = FN.graficos.leitura(id, Number(el.dataset.i));
      const svg = el.closest('svg');
      if (svg) for (const r of svg.querySelectorAll('.alvo.ativo')) r.classList.remove('ativo');
      el.classList.add('ativo');
    },
  };

  /** Chips de escolha (período, aba, modo) que chamam a ação data-acao com data-valor. */
  function chipsEscolha(acao, lista, atual, rotulo) {
    return `<div class="chips" role="group"${rotulo ? ` aria-label="${esc(rotulo)}"` : ''}>${lista.map((o) => `<button type="button" class="chip${o.valor === atual ? ' ativo' : ''}"
      aria-pressed="${o.valor === atual}" data-acao="${esc(acao)}" data-valor="${esc(o.valor)}">${esc(o.texto)}</button>`).join('')}</div>`;
  }

  return { seletorMes, kpi, chipStatus, vazio, barra, delta, opcoes, opcoesCategorias, linhaLancamento, descricaoLancamento, pctTexto, acoesComuns, chipsEscolha };
})();

/* ==== tela-inicio.js ==== */
/* tela-inicio.js — painel do mês: receitas, despesas, quanto sobrou, comparações, alertas e
   para onde foi o dinheiro. É a tela que abre quando você toca no ícone. */
(function () {
  'use strict';
  const $ = FN.dinheiro;
  const D = FN.datas;
  const R = FN.regras;
  const esc = FN.util.esc;

  function boasVindas() {
    return `<section class="cartao destaque">
      <h2>Bem-vindo!</h2>
      <p>Seus dados ficam só neste aparelho. Para começar, importe o histórico migrado da planilha
      (arquivo <b>financas-migracao-v1.json</b>) ou lance o primeiro gasto.</p>
      <div class="botoes">
        <a class="btn btn-primario" href="#/dados">Importar meu histórico</a>
        <a class="btn btn-sec" href="#/lancar">Lançar um gasto</a>
      </div>
    </section>`;
  }

  const ICONE = { critico: '!', atencao: '▲', info: 'i' };
  const ROTULO = { critico: 'Urgente', atencao: 'Atenção', info: 'Aviso' };

  function render() {
    const e = App.estado;
    if (!App.temDados()) return boasVindas();
    const mes = App.ui.mes;
    const r = R.resumoMes(e, mes);
    const ant = R.resumoMes(e, D.somarMeses(mes, -1));
    const media = R.mediaMeses(e, mes, 12);
    const alertas = R.alertas(e, mes, D.hoje());
    // avisos que não dependem só dos dados (ex.: sincronização pausada)
    for (const fn of App.alertasExtras || []) {
      try { const a = fn(mes); if (a) alertas.push(a); } catch (err) { console.error(err); }
    }

    const subReceitas = r.receitas_previstas ? `${$.brl(r.receitas_previstas)} ainda previstas` : '';
    const subDespesas = [r.despesas_previstas ? `${$.brl(r.despesas_previstas)} a pagar` : '', r.divida ? `+ ${$.brl(r.divida)} de dívida` : ''].filter(Boolean).join(' · ');
    const sobra = r.receitas_total ? `${$.pct(r.sobra_pct)} da receita` : 'sem receita lançada';

    const top = Object.entries(r.por_categoria).sort((a, b) => b[1] - a[1]).slice(0, 6);
    const maxTop = top.length ? top[0][1] : 0;
    const linhasTop = top.map(([id, v]) => {
      const c = R.categoria(e, id) || {};
      return `<li class="barra-linha"><a href="#/historico/${esc(mes)}/${esc(id)}">
        <span class="barra-rotulo">${esc(c.nome || id)} <span class="suave">${esc(R.nomeGrupo(e, c.grupo_id))}</span></span>
        <span class="barra-valor">${$.brl(v)} <span class="suave">${r.despesas ? $.pct(v / r.despesas * 100, 0) : ''}</span></span>
        ${UI.barra(maxTop ? v / maxTop * 100 : 0)}</a></li>`;
    }).join('');

    return `${UI.seletorMes(mes)}
      <section class="kpis" aria-label="Resumo do mês">
        ${UI.kpi('Receitas', $.brl(r.receitas_total), subReceitas)}
        ${UI.kpi('Despesas', $.brl(r.despesas), subDespesas)}
        ${UI.kpi('Sobrou', $.brl(r.saldo), sobra, r.saldo < 0 ? 'kpi-heroi kpi-negativo' : 'kpi-heroi')}
      </section>
      <section class="cartao">
        <h2>Despesas comparadas</h2>
        <p class="comparacao">${ant.n ? UI.delta(r.despesas, ant.despesas, true, 'que no mês anterior') : '<span class="suave">Sem dados do mês anterior.</span>'}</p>
        <p class="comparacao">${media ? UI.delta(r.despesas, media.despesas, true, `que a média de ${media.n} ${media.n === 1 ? 'mês' : 'meses'}`) : '<span class="suave">Sem meses anteriores para a média.</span>'}</p>
      </section>
      ${alertas.length ? `<section class="cartao"><h2>Alertas</h2><ul class="alertas">${alertas.map((a) => `<li class="alerta alerta-${a.nivel}">
        <a href="${esc(a.rota)}"><span class="alerta-icone" aria-hidden="true">${ICONE[a.nivel]}</span><span><b>${ROTULO[a.nivel]}:</b> ${esc(a.texto)}</span></a></li>`).join('')}</ul></section>` : ''}
      <section class="cartao">
        <h2>Para onde foi o dinheiro</h2>
        ${top.length ? `<ul class="barras">${linhasTop}</ul><p><a href="#/historico/${esc(mes)}">Ver todos os lançamentos do mês</a></p>` : UI.vazio('Nenhuma despesa lançada neste mês.')}
      </section>`;
  }

  App.registrarTela('inicio', { titulo: 'Início', render, acoes: {} }, { rotulo: 'Início', icone: 'inicio', principal: true, ordem: 1 });
})();

/* ==== tela-lancar.js ==== */
/* tela-lancar.js — lançamento rápido (meta: menos de 15 segundos no celular) e edição.
   Mínimo para salvar: valor + categoria. Data (hoje), forma de pagamento (a última usada na
   categoria) e status já vêm preenchidos. "4,79+10,97" vira 2 lançamentos; "329,70" em 3x vira
   3 parcelas previstas nos meses seguintes; compra no cartão vai para o mês em que a fatura vence. */
(function () {
  'use strict';
  const $ = FN.dinheiro;
  const D = FN.datas;
  const R = FN.regras;
  const U = FN.util;
  const esc = U.esc;

  function contasPagamento(e) {
    return R.ativos(e.contas).filter((c) => c.ativa !== false && c.tipo !== 'poupanca');
  }

  function contaPadrao(e, categoriaId) {
    if (categoriaId) {
      const ult = R.ativos(e.lancamentos).filter((x) => x.categoria_id === categoriaId && x.conta_id)
        .sort((a, b) => (a.criado_em < b.criado_em ? 1 : -1))[0];
      if (ult && contasPagamento(e).some((c) => c.id === ult.conta_id)) return ult.conta_id;
    }
    if (e.config.conta_padrao) return e.config.conta_padrao;
    const cc = contasPagamento(e).find((c) => c.tipo === 'conta_corrente');
    return cc ? cc.id : null;
  }

  function ehCartao(e, contaId) {
    const c = e.contas.find((x) => x.id === contaId);
    return !!(c && c.tipo === 'cartao_credito');
  }

  function formNovo(pref) {
    const e = App.estado;
    const f = {
      id: null, tipo: 'despesa', valor: pref.valor || '', categoria_id: pref.categoria || null, data: D.hoje(),
      conta_id: null, contaManual: false, status: 'pago', statusManual: false, parcelas: 1, divisao: 'nao',
      descricao: pref.descricao || '', obs: '', recorrente_id: pref.recorrente || null, erro: '',
    };
    f.conta_id = contaPadrao(e, f.categoria_id);
    if (ehCartao(e, f.conta_id)) f.status = 'previsto';
    return f;
  }

  function formDe(x) {
    const e = App.estado;
    const deb = acharDebito(e, x.id);
    const regra = R.regraAcerto(e);
    let divisao = 'nao';
    if (deb && regra) divisao = deb.debito.valor_centavos === x.valor_centavos ? 'tudo' : 'metade';
    return {
      id: x.id, tipo: x.tipo, valor: $.formatarNumero(x.valor_centavos).replace(/\./g, ''), categoria_id: x.categoria_id,
      data: x.data || '', conta_id: x.conta_id || null, contaManual: true, status: x.status, statusManual: true,
      parcelas: 1, divisao, descricao: x.descricao || '', obs: x.obs || '', recorrente_id: x.recorrente_id || null,
      mes_ref: x.mes_ref, erro: '', original: x,
    };
  }

  function acharDebito(e, lancamentoId) {
    for (const am of R.ativos(e.acerto_meses)) {
      const d = (am.debitos || []).find((x) => x.lancamento_id === lancamentoId && !x.excluido_em);
      if (d) return { mes: am, debito: d };
    }
    return null;
  }

  function prepararForm(params) {
    const chave = params.join('/');
    if (App.ui.formChave === chave && App.ui.form) return App.ui.form;
    let f;
    if (params[0] && params[0] !== 'nova') {
      const x = App.estado.lancamentos.find((l) => l.id === params[0]);
      f = x ? formDe(x) : formNovo({});
    } else {
      f = formNovo({ categoria: params[1] || null, recorrente: params[2] || null, valor: params[3] ? $.formatarNumero(Number(params[3])).replace(/\./g, '') : '' });
    }
    App.ui.form = f;
    App.ui.formChave = chave;
    return f;
  }

  function resumoValor(f) {
    if (!f.valor) return '<span class="suave">Digite o valor. Para várias compras, use + (ex.: 4,79+10,97).</span>';
    const lv = $.lerValor(f.valor);
    if (!lv.ok) return `<span class="erro">${esc(lv.erro)}</span>`;
    const n = Number(f.parcelas) || 1;
    let s = `= <b>${$.brl(lv.total)}</b>`;
    if (lv.itens.length > 1) s += ` · ${lv.itens.length} itens`;
    if (n > 1 && lv.itens.length === 1) {
      const p = $.dividirEmParcelas(lv.total, n);
      s += ` · ${n}x de ${$.brl(p[p.length - 1])}${p[0] !== p[p.length - 1] ? ' (1ª ' + $.brl(p[0]) + ')' : ''}`;
    }
    return s;
  }

  function chips(campo, lista, atual) {
    return lista.map((o) => `<button type="button" class="chip${String(o.valor) === String(atual) ? ' ativo' : ''}" aria-pressed="${String(o.valor) === String(atual)}"
      data-acao="escolher" data-campo="${campo}" data-valor="${esc(o.valor)}">${esc(o.texto)}</button>`).join('');
  }

  function render(params) {
    const e = App.estado;
    const f = prepararForm(params);
    const tipoCat = f.tipo === 'receita' ? 'receita' : f.tipo;
    const top = R.maisUsadas(e, tipoCat, D.mesAtual(), 8);
    if (f.categoria_id && !top.includes(f.categoria_id)) top.unshift(f.categoria_id);
    const catChips = top.map((id) => ({ valor: id, texto: R.nomeCategoria(e, id) }));
    const contas = contasPagamento(e).map((c) => ({ valor: c.id, texto: c.nome })).concat([{ valor: '', texto: 'Não informado' }]);
    const regra = R.regraAcerto(e);
    const conta = e.contas.find((c) => c.id === f.conta_id);
    let aviso = '';
    if (conta && conta.tipo === 'cartao_credito' && D.validarData(f.data) && !f.id) {
      const fat = D.mesDaFatura(f.data, conta);
      aviso = `Vai para a fatura de <b>${esc(D.formatarMes(fat.mes_ref))}</b> (vence ${esc(D.formatarData(fat.vencimento))}) e fica prevista até você registrar o pagamento da fatura.`;
    }
    const hoje = D.hoje();
    const ontem = D.somarDias(hoje, -1);
    const orig = f.original;
    const toque = document.body.classList.contains('toque');

    return `<form class="lancar" data-acao="nada" autocomplete="off" novalidate>
      ${f.id ? `<p class="suave">Editando lançamento de ${esc(D.formatarMes(f.mes_ref))}${orig && orig.origem ? ` · origem: ${esc(orig.origem)}` : ''}${orig && orig.parcela_num ? ` · parcela ${orig.parcela_num}/${orig.parcela_total}` : ''}</p>` : ''}
      <div class="chips" role="group" aria-label="Tipo">${chips('tipo', [{ valor: 'despesa', texto: 'Despesa' }, { valor: 'receita', texto: 'Receita' }].concat(f.tipo === 'pagamento_divida' ? [{ valor: 'pagamento_divida', texto: 'Pagamento de dívida' }] : []), f.tipo)}</div>

      <div class="valor-caixa">
        <label for="campo-valor" class="rotulo">Valor</label>
        <input id="campo-valor" class="valor-input" type="text" ${toque ? 'inputmode="none"' : 'inputmode="decimal"'} data-mudar="valor" value="${esc(f.valor)}" placeholder="0,00" aria-describedby="valor-resumo">
        <div id="valor-resumo" class="valor-resumo" aria-live="polite">${resumoValor(f)}</div>
      </div>
      <div class="teclado" role="group" aria-label="Teclado numérico">
        ${['7', '8', '9', '⌫', '4', '5', '6', '+', '1', '2', '3', '×', ',', '0', '00', 'C'].map((t) => `<button type="button" class="tecla${'⌫+×C'.includes(t) ? ' tecla-op' : ''}" data-acao="tecla" data-tecla="${t}" aria-label="${t === '⌫' ? 'Apagar' : t === 'C' ? 'Limpar' : t === '×' ? 'Vezes' : t}">${t}</button>`).join('')}
      </div>

      <fieldset class="grupo-campo"><legend>Categoria</legend>
        <div class="chips">${chips('categoria_id', catChips, f.categoria_id)}
        <button type="button" class="chip chip-mais" data-acao="outra-categoria">Outra…</button></div>
      </fieldset>

      <fieldset class="grupo-campo"><legend>Data${D.validarData(f.data) ? ` · <span class="legenda-valor">${esc(D.formatarData(f.data))}${f.data === hoje ? ' (hoje)' : f.data === ontem ? ' (ontem)' : ''}</span>` : ''}</legend>
        <div class="chips">${chips('data', [{ valor: hoje, texto: 'Hoje' }, { valor: ontem, texto: 'Ontem' }], f.data)}
        <input type="date" class="campo-data" data-mudar="data" value="${esc(f.data)}" aria-label="Outra data"></div>
      </fieldset>

      <fieldset class="grupo-campo"><legend>${f.tipo === 'receita' ? 'Onde entrou' : 'Forma de pagamento'}</legend>
        <div class="chips">${chips('conta_id', contas, f.conta_id || '')}</div>
        ${aviso ? `<p class="dica">${aviso}</p>` : ''}
      </fieldset>

      <div class="linha-campos">
        <fieldset class="grupo-campo"><legend>Status</legend>
          <div class="chips">${chips('status', [{ valor: 'pago', texto: f.tipo === 'receita' ? 'Recebido' : 'Pago' }, { valor: 'previsto', texto: 'Previsto' }], f.status)}</div>
        </fieldset>
        ${!f.id && f.tipo === 'despesa' ? `<label class="campo campo-parcelas"><span>Parcelas</span>
          <select data-mudar="parcelas">${UI.opcoes(Array.from({ length: 24 }, (_, i) => ({ valor: i + 1, texto: i === 0 ? 'À vista' : `${i + 1}x` })), f.parcelas)}</select></label>` : ''}
      </div>

      ${regra && f.tipo === 'despesa' ? `<fieldset class="grupo-campo"><legend>Divisão com ${esc(regra.pessoa || 'outra pessoa')}</legend>
        <div class="chips">${chips('divisao', [{ valor: 'nao', texto: 'Não' }, { valor: 'metade', texto: `Metade de ${regra.pessoa || 'outra pessoa'}` }, { valor: 'tudo', texto: `Tudo de ${regra.pessoa || 'outra pessoa'}` }], f.divisao)}</div>
        ${f.divisao !== 'nao' ? `<p class="dica">A parte de ${esc(regra.pessoa || 'outra pessoa')} desconta do repasse do mês (tela Acerto).</p>` : ''}
      </fieldset>` : ''}

      <details class="mais-detalhes"${f.descricao || f.obs ? ' open' : ''}><summary>Descrição e observação</summary>
        <label class="campo"><span>Descrição (opcional)</span><input type="text" data-mudar="descricao" value="${esc(f.descricao)}" maxlength="120"></label>
        <label class="campo"><span>Observação (opcional)</span><textarea data-mudar="obs" rows="2" maxlength="500">${esc(f.obs)}</textarea></label>
      </details>

      <p class="erro" role="alert" id="erro-form">${esc(f.erro || '')}</p>
      <div class="botoes botoes-fixos">
        <button type="button" class="btn btn-primario btn-grande" data-acao="salvar">Salvar</button>
        ${f.id ? '<button type="button" class="btn btn-perigo" data-acao="excluir">Excluir</button>' : '<button type="button" class="btn btn-sec" data-acao="salvar-outro">Salvar e lançar outro</button>'}
      </div>
    </form>`;
  }

  function atualizarResumo() {
    const el = document.getElementById('valor-resumo');
    if (el) el.innerHTML = resumoValor(App.ui.form);
  }

  function juntarObs(...partes) { return partes.filter((p) => p && String(p).trim()).join(' · ') || null; }

  function registroAcerto(mapa, e, mes) {
    if (mapa.has(mes)) return mapa.get(mes);
    const atual = e.acerto_meses.find((a) => a.mes_ref === mes && !a.excluido_em);
    const r = atual ? U.clonar(atual) : { id: 'am-' + mes, mes_ref: mes, extras: [], debitos: [] };
    mapa.set(mes, r);
    return r;
  }

  async function salvar(outro) {
    const e = App.estado;
    const f = App.ui.form;
    const erro = (m) => { f.erro = m; const el = document.getElementById('erro-form'); if (el) el.textContent = m; };
    const lv = $.lerValor(f.valor);
    if (!lv.ok) return erro(lv.erro);
    if (!f.categoria_id) return erro('Escolha a categoria.');
    if (!D.validarData(f.data) && !(f.id && !f.data)) return erro('Escolha uma data válida.');
    const n = Number(f.parcelas) || 1;
    if (n > 1 && lv.itens.length > 1) return erro('Para parcelar, lance um valor só (sem +).');
    const cat = R.categoria(e, f.categoria_id) || { nome: f.categoria_id };
    const conta = e.contas.find((c) => c.id === f.conta_id) || null;
    const cartao = conta && conta.tipo === 'cartao_credito';
    const mesBase = f.data ? (cartao ? D.mesDaFatura(f.data, conta).mes_ref : D.mesDe(f.data)) : f.mes_ref;
    const regra = R.regraAcerto(e);
    const mudancas = [];
    const acertos = new Map();
    const criados = [];

    // remove o débito ligado a um lançamento (edição/exclusão)
    const tirarDebito = (lancId) => {
      const achado = acharDebito(e, lancId);
      if (!achado) return;
      const r = registroAcerto(acertos, e, achado.mes.mes_ref);
      r.debitos = r.debitos.filter((d) => d.lancamento_id !== lancId);
    };
    const porDebito = (l) => {
      if (!regra || f.divisao === 'nao' || l.tipo !== 'despesa') return;
      const r = registroAcerto(acertos, e, l.mes_ref);
      r.debitos.push({
        id: 'd-' + l.id, valor_centavos: f.divisao === 'tudo' ? l.valor_centavos : $.metade(l.valor_centavos),
        descricao: (l.descricao || cat.nome) + (l.parcela_num ? ` (parcela ${l.parcela_num}/${l.parcela_total})` : '') + (f.divisao === 'metade' ? ' — metade' : ''),
        lancamento_id: l.id, status: l.status, origem: 'app',
      });
    };

    if (f.id) {
      const antigo = e.lancamentos.find((x) => x.id === f.id);
      const contaTxt = lv.itens.length > 1 ? `Conta: ${f.valor}` : (lv.itens[0].conta ? `Conta: ${lv.itens[0].conta}` : '');
      const mudouQuando = (antigo.data || '') !== (f.data || '') || (antigo.conta_id || null) !== (f.conta_id || null);
      const novo = Object.assign({}, antigo, {
        tipo: f.tipo, valor_centavos: lv.total, categoria_id: f.categoria_id, data: f.data || null, conta_id: f.conta_id || null,
        status: f.status, descricao: f.descricao || null, obs: juntarObs(f.obs, contaTxt === '' || (f.obs || '').includes(contaTxt) ? '' : contaTxt),
        mes_ref: mudouQuando && f.data ? mesBase : antigo.mes_ref,
        pessoa: regra && f.divisao !== 'nao' ? regra.pessoa : (antigo.pessoa && regra && antigo.pessoa === regra.pessoa ? null : antigo.pessoa),
        desconta_repasse: !!(regra && f.divisao !== 'nao'),
      });
      mudancas.push({ tabela: 'lancamentos', registro: novo });
      tirarDebito(novo.id);
      porDebito(novo);
      criados.push(novo);
    } else {
      const base = (extra) => Object.assign({
        id: U.novoId('l'), tipo: f.tipo, mes_ref: mesBase, data: f.data, data_compra: cartao ? f.data : null,
        valor_centavos: 0, categoria_id: f.categoria_id, conta_id: f.conta_id || null, status: f.status,
        descricao: f.descricao || null, grupo_entrada_id: null, parcela_num: null, parcela_total: null,
        compra_parcelada_id: null, recorrente_id: f.recorrente_id || null,
        pessoa: regra && f.divisao !== 'nao' && f.tipo === 'despesa' ? regra.pessoa : null,
        desconta_repasse: !!(regra && f.divisao !== 'nao' && f.tipo === 'despesa'),
        obs: f.obs || null, origem: 'app',
      }, extra);
      if (n > 1) {
        const cp = { id: U.novoId('cp'), descricao: f.descricao || cat.nome, conta_id: f.conta_id || null, data_compra: f.data,
          valor_total_centavos: lv.total, num_parcelas: n, categoria_id: f.categoria_id, origem: 'app' };
        mudancas.push({ tabela: 'compras_parceladas', registro: cp });
        $.dividirEmParcelas(lv.total, n).forEach((v, i) => {
          const l = base({ valor_centavos: v, mes_ref: D.somarMeses(mesBase, i), status: i === 0 ? f.status : 'previsto',
            compra_parcelada_id: cp.id, parcela_num: i + 1, parcela_total: n });
          mudancas.push({ tabela: 'lancamentos', registro: l });
          criados.push(l);
          porDebito(l);
        });
      } else {
        const grupo = lv.itens.length > 1 ? U.novoId('g') : null;
        lv.itens.forEach((it) => {
          const l = base({ valor_centavos: it.centavos, grupo_entrada_id: grupo, obs: juntarObs(f.obs, it.conta ? 'Conta: ' + it.conta : '') });
          mudancas.push({ tabela: 'lancamentos', registro: l });
          criados.push(l);
          porDebito(l);
        });
      }
    }
    for (const r of acertos.values()) mudancas.push({ tabela: 'acerto_meses', registro: r });
    const total = criados.reduce((a, l) => a + l.valor_centavos, 0);
    const desc = `${f.id ? 'Edição' : 'Lançamento'} de ${$.brl(total)} em ${cat.nome}`;
    await App.salvar(mudancas, desc);
    App.toast(`${f.id ? 'Salvo' : 'Lançado'}: ${$.brl(total)} em ${cat.nome}${criados.length > 1 ? ` (${criados.length} ${n > 1 ? 'parcelas' : 'itens'})` : ''}`,
      { acao: 'Desfazer', fn: async () => { await App.desfazer(); App.toast('Lançamento desfeito.'); App.renderizar(true); } });
    if (outro) {
      const novo = formNovo({});
      novo.tipo = f.tipo;
      novo.data = f.data;
      App.ui.form = novo;
      App.renderizar(true);
      const inp = document.getElementById('campo-valor');
      if (inp && !document.body.classList.contains('toque')) inp.focus();
    } else {
      App.ui.form = null;
      App.ui.formChave = null;
      if (history.length > 1 && f.id) history.back(); else App.navegar('#/inicio');
    }
  }

  async function excluir() {
    const e = App.estado;
    const f = App.ui.form;
    const x = e.lancamentos.find((l) => l.id === f.id);
    if (!x) return;
    let alvo = [x];
    if (x.compra_parcelada_id) {
      const todas = R.ativos(e.lancamentos).filter((l) => l.compra_parcelada_id === x.compra_parcelada_id);
      const r = await App.dialogo({ titulo: 'Excluir parcela', html: `<p>Esta é a parcela ${x.parcela_num} de ${x.parcela_total}.</p>`,
        botoes: [{ valor: 'cancelar', texto: 'Cancelar', classe: 'btn-sec' }, { valor: 'uma', texto: 'Só esta parcela', classe: 'btn-sec' }, { valor: 'todas', texto: `Todas (${todas.length})`, classe: 'btn-perigo' }] });
      if (!r.botao || r.botao === 'cancelar') return;
      if (r.botao === 'todas') alvo = todas;
    } else if (!(await App.confirmar('Excluir lançamento', `Excluir ${$.brl(x.valor_centavos)} em ${R.nomeCategoria(e, x.categoria_id)}? Você pode desfazer logo depois.`, 'Excluir', true))) return;
    const agora = U.agora();
    const mudancas = alvo.map((l) => ({ tabela: 'lancamentos', registro: Object.assign({}, l, { excluido_em: agora }) }));
    const acertos = new Map();
    for (const l of alvo) {
      const achado = acharDebito(e, l.id);
      if (!achado) continue;
      const r = registroAcerto(acertos, e, achado.mes.mes_ref);
      r.debitos = r.debitos.filter((d) => d.lancamento_id !== l.id);
    }
    for (const r of acertos.values()) mudancas.push({ tabela: 'acerto_meses', registro: r });
    if (x.compra_parcelada_id && alvo.length > 1) {
      const cp = e.compras_parceladas.find((c) => c.id === x.compra_parcelada_id);
      if (cp) mudancas.push({ tabela: 'compras_parceladas', registro: Object.assign({}, cp, { excluido_em: agora }) });
    }
    await App.salvar(mudancas, `Exclusão de ${alvo.length > 1 ? alvo.length + ' parcelas' : $.brl(x.valor_centavos)} em ${R.nomeCategoria(e, x.categoria_id)}`);
    App.ui.form = null;
    App.ui.formChave = null;
    App.toast('Excluído.', { acao: 'Desfazer', fn: async () => { await App.desfazer(); App.toast('Exclusão desfeita.'); App.renderizar(true); } });
    if (history.length > 1) history.back(); else App.navegar('#/historico');
  }

  const acoes = {
    nada: () => {},
    tecla: (el) => {
      const f = App.ui.form;
      const t = el.dataset.tecla;
      if (t === '⌫') f.valor = f.valor.slice(0, -1);
      else if (t === 'C') f.valor = '';
      else if (t === '×') f.valor += '*';
      else f.valor += t;
      const inp = document.getElementById('campo-valor');
      if (inp) inp.value = f.valor;
      f.erro = '';
      atualizarResumo();
    },
    escolher: (el) => {
      const f = App.ui.form;
      const campo = el.dataset.campo;
      let v = el.dataset.valor;
      if (campo === 'conta_id') {
        f.contaManual = true;
        v = v || null;
        if (!f.statusManual && f.tipo !== 'receita') f.status = ehCartao(App.estado, v) ? 'previsto' : 'pago';
      }
      if (campo === 'status') f.statusManual = true;
      if (campo === 'categoria_id' && !f.contaManual && !f.id) {
        f.conta_id = contaPadrao(App.estado, v);
        if (!f.statusManual) f.status = ehCartao(App.estado, f.conta_id) ? 'previsto' : 'pago';
      }
      if (campo === 'tipo' && v !== f.tipo) {
        f.categoria_id = null;
        if (v === 'receita') { f.parcelas = 1; f.divisao = 'nao'; if (!f.statusManual) f.status = 'pago'; }
      }
      f[campo] = v;
      f.erro = '';
      App.renderizar(true);
    },
    'outra-categoria': async () => {
      const f = App.ui.form;
      const tipo = f.tipo === 'receita' ? 'receita' : f.tipo;
      const r = await App.dialogo({
        titulo: 'Categoria',
        html: `<label class="campo"><span>Escolha a categoria</span><select name="cat" autofocus>${UI.opcoesCategorias(App.estado, tipo, f.categoria_id)}</select></label>`,
        botoes: [{ valor: 'cancelar', texto: 'Cancelar', classe: 'btn-sec', semValidar: true }, { valor: 'ok', texto: 'Usar', classe: 'btn-primario' }],
      });
      if (r.botao === 'ok' && r.valores.cat) acoes.escolher({ dataset: { campo: 'categoria_id', valor: r.valores.cat } });
    },
    salvar: () => salvar(false),
    'salvar-outro': () => salvar(true),
    excluir,
  };

  const mudancas = {
    valor: (el) => { App.ui.form.valor = el.value; App.ui.form.erro = ''; atualizarResumo(); },
    data: (el) => { if (D.validarData(el.value)) { App.ui.form.data = el.value; App.renderizar(true); } },
    parcelas: (el) => { App.ui.form.parcelas = Number(el.value) || 1; atualizarResumo(); },
    descricao: (el) => { App.ui.form.descricao = el.value; },
    obs: (el) => { App.ui.form.obs = el.value; },
  };

  App.registrarTela('lancar', {
    titulo: (p) => (p[0] && p[0] !== 'nova' ? 'Editar lançamento' : 'Lançar'),
    render, acoes, mudancas,
    depois: () => {
      const inp = document.getElementById('campo-valor');
      if (inp && !document.body.classList.contains('toque') && !App.ui.form.id && !App.ui.form.valor) inp.focus();
    },
  }, { rotulo: 'Lançar', icone: 'mais', principal: true, ordem: 3 });

  // Ao sair e voltar para "#/lancar", começa um formulário novo.
  window.addEventListener('hashchange', () => {
    if (!/^#\/lancar/.test(location.hash)) { App.ui.form = null; App.ui.formChave = null; }
  });
})();

/* ==== tela-historico.js ==== */
/* tela-historico.js — todos os lançamentos, com filtros (período, tipo, grupo, categoria, status,
   forma de pagamento), busca, edição (toque na linha) e "desfazer". */
(function () {
  'use strict';
  const $ = FN.dinheiro;
  const D = FN.datas;
  const R = FN.regras;
  const U = FN.util;
  const esc = U.esc;
  const PAGINA = 150;

  function filtrosPadrao() {
    return { periodo: 'mes', mes: App.ui.mes, tipo: '', grupo: '', categoria: '', status: '', conta: '', busca: '', limite: PAGINA };
  }

  function mesesDoPeriodo(f) {
    const hoje = D.mesAtual();
    switch (f.periodo) {
      case 'mes': return new Set([f.mes]);
      case '3m': return new Set(D.listaMeses(D.somarMeses(hoje, -2), hoje));
      case '12m': return new Set(D.listaMeses(D.somarMeses(hoje, -11), hoje));
      case 'ano': return new Set(D.listaMeses(hoje.slice(0, 4) + '-01', hoje.slice(0, 4) + '-12'));
      default: return null;
    }
  }

  function filtrar(e, f) {
    const meses = mesesDoPeriodo(f);
    const cats = R.porId(e.categorias);
    const busca = U.normalizar(f.busca.trim());
    const buscaValor = /^[\d.,]+$/.test(f.busca.trim()) ? $.lerValor(f.busca.trim()) : null;
    return R.ativos(e.lancamentos).filter((x) => {
      if (meses && !meses.has(x.mes_ref)) return false;
      if (f.tipo && x.tipo !== f.tipo) return false;
      if (f.categoria && x.categoria_id !== f.categoria) return false;
      if (f.grupo && (cats.get(x.categoria_id) || {}).grupo_id !== f.grupo) return false;
      if (f.status && x.status !== f.status) return false;
      if (f.conta === '__nenhuma' && x.conta_id) return false;
      if (f.conta && f.conta !== '__nenhuma' && x.conta_id !== f.conta) return false;
      if (busca) {
        const c = cats.get(x.categoria_id) || {};
        const texto = U.normalizar([c.nome, x.descricao, x.obs, x.origem, x.pessoa].filter(Boolean).join(' '));
        const bateValor = buscaValor && buscaValor.ok && buscaValor.total === x.valor_centavos;
        if (!texto.includes(busca) && !bateValor) return false;
      }
      return true;
    }).sort((a, b) => {
      if (a.mes_ref !== b.mes_ref) return a.mes_ref < b.mes_ref ? 1 : -1;
      const da = a.data || '';
      const db = b.data || '';
      if (da !== db) return da < db ? 1 : -1;
      const ca = (cats.get(a.categoria_id) || {}).ordem || 0;
      const cb = (cats.get(b.categoria_id) || {}).ordem || 0;
      if (ca !== cb) return ca - cb;
      return a.id < b.id ? -1 : 1;
    });
  }

  function render(params) {
    const e = App.estado;
    const chave = params.join('/');
    if (!App.ui.filtros || App.ui.filtrosChave !== chave) {
      App.ui.filtros = filtrosPadrao();
      if (params[0] && D.validarMes(params[0])) { App.ui.filtros.mes = params[0]; App.ui.filtros.periodo = 'mes'; }
